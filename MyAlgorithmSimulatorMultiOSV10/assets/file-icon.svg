<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MyAlgorithmSimulator project file (.myalgo): a page with a folded corner and the 3D cap. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6f5"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c4de"/>
      <stop offset="1" stop-color="#f4f7fd"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2440b8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11131c"/>
      <stop offset="0.38" stop-color="#3b4157"/>
      <stop offset="0.55" stop-color="#2a2f42"/>
      <stop offset="1" stop-color="#0d0f16"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c5470"/>
      <stop offset="0.5" stop-color="#2b3044"/>
      <stop offset="1" stop-color="#171a26"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1e2b"/>
      <stop offset="0.5" stop-color="#0a0b11"/>
      <stop offset="1" stop-color="#262a3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.45" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#c77a0a"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1640" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- page: a thick sheet (darker edge below and right), then its face -->
  <g filter="url(#drop)">
    <path d="M106 52h236l100 100v304a28 28 0 0 1-28 28H106a28 28 0 0 1-28-28V80a28 28 0 0 1 28-28z" fill="#8d9cc4"/>
    <path d="M96 40h236l100 100v304a28 28 0 0 1-28 28H96a28 28 0 0 1-28-28V68a28 28 0 0 1 28-28z" fill="url(#page)"/>
    <path d="M96 40h236l100 100v304a28 28 0 0 1-28 28H96a28 28 0 0 1-28-28V68a28 28 0 0 1 28-28z" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
  </g>
  <path d="M332 40v72a28 28 0 0 0 28 28h72z" fill="url(#fold)"/>
  <!-- text lines -->
  <g fill="#9fb0d6">
    <rect x="112" y="92"  width="168" height="18" rx="9"/>
    <rect x="112" y="130" width="120" height="18" rx="9"/>
  </g>
  <!-- colour band at the foot of the page -->
  <path d="M68 404h364v40a28 28 0 0 1-28 28H96a28 28 0 0 1-28-28z" fill="url(#band)"/>

  <!-- 3D cap -->
  <g transform="translate(250 300)">
    <ellipse cx="0" cy="102" rx="96" ry="16" fill="#0b1640" fill-opacity="0.25"/>
    <path d="M-80 -20v78c0 18 36 32 80 32s80-14 80-32V-20z" fill="url(#body)"/>
    <path d="M-150 -34L0 30L150 -34v16L0 46L-150 -18z" fill="url(#edge)"/>
    <path d="M-150 -34L0 -104L150 -34L0 30z" fill="url(#top)"/>
    <path d="M-150 -34L0 -104L150 -34" fill="none" stroke="#8a93b8" stroke-opacity="0.65" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -40Q62 -46 106 -24L106 40" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="0" cy="-42" rx="18" ry="11" fill="url(#gold)"/>
    <path d="M94 36h24l8 52q-20 10-40 0z" fill="url(#gold)"/>
  </g>
</svg>
