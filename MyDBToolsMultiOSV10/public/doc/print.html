<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBTools — Print</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="stylesheet" href="viewer.css" />
    <link rel="stylesheet" href="print.css" />
  </head>
  <body class="print-page">
    <div class="pp">
      <aside class="pp-settings" id="settings"></aside>
      <section class="pp-preview" id="preview">
        <div class="pp-sheet" id="sheet"><iframe id="frame" title="preview"></iframe></div>
      </section>
    </div>
    <footer class="pp-status"><span id="info"></span><span class="spacer"></span><span id="message"></span></footer>
    <script src="icons.js"></script>
    <script src="markdown.js"></script>
    <script src="print.js"></script>
  </body>
</html>
