<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBTools</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="doc-bar">
      <img class="doc-logo" src="../favicon.png" alt="" />
      <strong>DBTools v1.0.1</strong>
      <nav class="doc-group" aria-label="documents">
        <button type="button" data-doc="guide"></button>
        <button type="button" data-doc="tutorial"></button>
      </nav>
      <span class="spacer"></span>
      <div class="doc-group font-stepper" role="group">
        <span class="font-label" id="font-label"></span>
        <button type="button" class="icon-only" id="font-down"></button>
        <output id="font-size" class="font-value"></output>
        <button type="button" class="icon-only" id="font-up"></button>
        <button type="button" class="icon-only" id="font-reset"></button>
      </div>
      <nav class="doc-group" aria-label="language">
        <button type="button" data-lang="ko"></button>
        <button type="button" data-lang="en"></button>
      </nav>
      <button type="button" id="print"></button>
      <div class="win-controls" id="win-controls" hidden>
        <button type="button" class="win-btn" id="win-min"></button>
        <button type="button" class="win-btn" id="win-max"></button>
        <button type="button" class="win-btn win-close" id="win-close"></button>
      </div>
    </header>
    <div class="doc-layout">
      <aside class="doc-toc" id="toc"></aside>
      <main class="doc-body" id="body"></main>
    </div>
    <script src="icons.js"></script>
    <script src="markdown.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
