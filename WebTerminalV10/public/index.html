<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Terminal</title>
    <link rel="icon" type="image/x-icon" href="./daemon_hammer.ico" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .title-icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .title-text {
        margin: 0;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 140px 180px 180px auto auto;
        gap: 8px;
        margin-bottom: 12px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #111827;
        font-size: 14px;
        color: #94a3b8;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #6b7280;
        box-shadow: 0 0 0 2px rgba(107, 114, 128, 0.2);
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }
      .status-dot.connecting {
        background: #f59e0b;
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
      }
      .status-dot.connected {
        background: #22c55e;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
        animation: pulse-green 1s infinite ease-in-out;
      }
      @keyframes pulse-green {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
          box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.85);
          box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }
      }
      input,
      button {
        border: 1px solid #334155;
        background: #111827;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 10px;
      }
      button {
        cursor: pointer;
        background: #1d4ed8;
        border: none;
      }
      .tabs {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .tab {
        border: 1px solid #334155;
        background: #0b1220;
        color: #cbd5e1;
        border-radius: 8px;
        padding: 6px 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }
      .tab.active {
        background: #1e293b;
        color: #f8fafc;
        border-color: #475569;
      }
      .tab-close {
        border: none;
        background: transparent;
        color: #94a3b8;
        padding: 0;
        line-height: 1;
      }
      .tab-close:hover {
        color: #f8fafc;
      }
      #newTabBtn {
        background: #0f172a;
        border: 1px dashed #475569;
      }
      #terminalWrap {
        height: 72vh;
        min-height: 280px;
        min-width: 320px;
        resize: both;
        border: 1px solid #334155;
        border-radius: 12px;
        overflow: hidden;
      }
      #terminalHost {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .terminal-pane {
        width: 100%;
        height: 100%;
        display: none;
      }
      .terminal-pane.active {
        display: block;
      }
      #terminal {
        width: 100%;
        height: 100%;
      }
      .hint {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 13px;
      }
      @media (max-width: 900px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title-row">
        <img
          class="title-icon"
          src="./daemon_hammer.ico"
          alt="daemon hammer icon"
        />
        <h2 class="title-text">Web Embedded Terminal</h2>
      </div>
      <div class="controls">
        <input id="host" type="text" placeholder="Host (default: localhost)" />
        <input id="port" type="number" placeholder="Port (22)" value="22" />
        <input id="username" type="text" placeholder="SSH username (remote)" />
        <input
          id="password"
          type="password"
          placeholder="SSH password (remote)"
        />
        <button id="connectBtn">Connect</button>
        <div class="status">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Disconnected</span>
        </div>
      </div>
      <div id="tabs" class="tabs">
        <button id="newTabBtn" type="button">+ New Tab</button>
      </div>
      <div id="terminalWrap">
        <div id="terminalHost"></div>
      </div>
      <p class="hint">
        host가 localhost/127.0.0.1이면 로컬 셸에 연결됩니다. 그 외 host는 SSH로 연결합니다.
        터미널 오른쪽 아래를 드래그해서 크기를 조절할 수 있습니다.
      </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
