<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Terminal</title>
    <link rel="icon" type="image/x-icon" href="./daemon_hammer.ico" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .title-icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .title-text {
        margin: 0;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 140px 180px 180px auto auto;
        gap: 8px;
        margin-bottom: 12px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #111827;
        font-size: 14px;
        color: #94a3b8;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #6b7280;
        box-shadow: 0 0 0 2px rgba(107, 114, 128, 0.2);
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }
      .status-dot.connecting {
        background: #f59e0b;
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
      }
      .status-dot.connected {
        background: #22c55e;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
        animation: pulse-green 1s infinite ease-in-out;
      }
      @keyframes pulse-green {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
          box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.85);
          box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }
      }
      input,
      button {
        border: 1px solid #334155;
        background: #111827;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 10px;
      }
      button {
        cursor: pointer;
        background: #1d4ed8;
        border: none;
      }
      .tabs {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .tab {
        border: 1px solid #334155;
        background: #0b1220;
        color: #cbd5e1;
        border-radius: 8px;
        padding: 6px 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }
      .tab.active {
        background: #1e293b;
        color: #f8fafc;
        border-color: #475569;
      }
      .tab-close {
        border: none;
        background: transparent;
        color: #94a3b8;
        padding: 0;
        line-height: 1;
      }
      .tab-close:hover {
        color: #f8fafc;
      }
      #newTabBtn {
        background: #0f172a;
        border: 1px dashed #475569;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .file-row input[type="text"] {
        flex: 1;
        min-width: 200px;
      }
      .file-row button {
        background: #0f766e;
        white-space: nowrap;
      }
      .file-row button.dl-btn {
        background: #7c3aed;
      }
      .file-status {
        font-size: 13px;
        color: #94a3b8;
      }
      .file-status.ok { color: #22c55e; }
      .file-status.err { color: #ef4444; }
      #terminalWrap {
        height: 72vh;
        min-height: 280px;
        min-width: 320px;
        resize: both;
        border: 1px solid #334155;
        border-radius: 12px;
        overflow: hidden;
      }
      #terminalHost {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .terminal-pane {
        width: 100%;
        height: 100%;
        display: none;
      }
      .terminal-pane.active {
        display: block;
      }
      #terminal {
        width: 100%;
        height: 100%;
      }
      .hint {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 13px;
      }
      @media (max-width: 900px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }

      /* ── File Browser Modal ────────────────────────────── */
      .fb-overlay {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.65);
        display: flex; align-items: center; justify-content: center;
        z-index: 100;
      }
      .fb-modal {
        background: #1e293b;
        border: 1px solid #475569;
        border-radius: 12px;
        width: 560px; max-width: 95vw;
        display: flex; flex-direction: column;
        max-height: 78vh;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      .fb-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #334155;
        font-weight: 600; font-size: 15px; flex-shrink: 0;
      }
      .fb-close-btn {
        background: transparent; border: none;
        color: #94a3b8; font-size: 18px; padding: 2px 8px; cursor: pointer; border-radius: 6px;
      }
      .fb-close-btn:hover { background: #334155; color: #f1f5f9; }
      .fb-path-row {
        display: flex; gap: 6px; align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #334155; flex-shrink: 0;
      }
      .fb-path-row input { flex: 1; font-size: 13px; font-family: monospace; padding: 7px 10px; }
      .fb-path-row button { padding: 7px 11px; font-size: 13px; white-space: nowrap; }
      .fb-list {
        flex: 1; overflow-y: auto;
        padding: 4px 0; min-height: 240px;
      }
      .fb-item {
        display: flex; align-items: center; gap: 10px;
        padding: 7px 18px; cursor: pointer;
        font-size: 14px; color: #e2e8f0; user-select: none;
      }
      .fb-item:hover { background: #273548; }
      .fb-item.fb-selected { background: #1d4ed8; color: #fff; }
      .fb-item-icon { font-size: 15px; flex-shrink: 0; }
      .fb-empty { padding: 40px; text-align: center; color: #64748b; font-size: 13px; }
      .fb-footer {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid #334155; flex-shrink: 0;
      }
      .fb-footer-info {
        flex: 1; font-size: 12px; color: #94a3b8;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-family: monospace;
      }
      .fb-action-btn { background: #0f766e; }
      .fb-action-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
      .fb-cancel-btn { background: #374151; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title-row">
        <img
          class="title-icon"
          src="./daemon_hammer.ico"
          alt="daemon hammer icon"
        />
        <h2 class="title-text">Web Embedded Terminal</h2>
      </div>
      <div class="controls">
        <input id="host" type="text" placeholder="Host (default: localhost)" />
        <input id="port" type="number" placeholder="Port (22)" value="22" />
        <input id="username" type="text" placeholder="SSH username (remote)" />
        <input
          id="password"
          type="password"
          placeholder="SSH password (remote)"
        />
        <button id="connectBtn">Connect</button>
        <div class="status">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Disconnected</span>
        </div>
      </div>
      <div id="tabs" class="tabs">
        <button id="newTabBtn" type="button">+ New Tab</button>
      </div>
      <div class="file-row">
        <input type="file" id="fileInput" style="display:none" multiple />
        <button id="uploadBtn" type="button">&#8593; Upload</button>
        <input id="uploadDir" type="text" placeholder="Upload directory (빈칸 = ~)" style="max-width:220px;" />
        <button id="downloadBtn" type="button" class="dl-btn">&#8595; Download</button>
        <input id="downloadPath" type="text" placeholder="Download 파일 경로 (빈칸 = 브라우저로 선택)" />
        <span id="fileStatus" class="file-status"></span>
      </div>

      <!-- File Browser Modal -->
      <div id="fileBrowserModal" class="fb-overlay" style="display:none">
        <div class="fb-modal">
          <div class="fb-header">
            <span id="fbTitle">파일 브라우저</span>
            <button id="fbClose" type="button" class="fb-close-btn">✕</button>
          </div>
          <div class="fb-path-row">
            <button id="fbUpBtn" type="button">⬆ Up</button>
            <input id="fbPathInput" type="text" />
            <button id="fbGoBtn" type="button">이동</button>
          </div>
          <div id="fbList" class="fb-list"></div>
          <div class="fb-footer">
            <span id="fbFooterInfo" class="fb-footer-info"></span>
            <button id="fbCancelBtn" type="button" class="fb-cancel-btn">취소</button>
            <button id="fbActionBtn" type="button" class="fb-action-btn">선택</button>
          </div>
        </div>
      </div>
      <div id="terminalWrap">
        <div id="terminalHost"></div>
      </div>
      <p class="hint">
        host가 localhost/127.0.0.1이면 로컬 셸에 연결됩니다. 그 외 host는 SSH로 연결합니다.
        터미널 오른쪽 아래를 드래그해서 크기를 조절할 수 있습니다.
      </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
