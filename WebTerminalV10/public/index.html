<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Terminal</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 140px 180px 180px auto;
        gap: 8px;
        margin-bottom: 12px;
      }
      input,
      button {
        border: 1px solid #334155;
        background: #111827;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 10px;
      }
      button {
        cursor: pointer;
        background: #1d4ed8;
        border: none;
      }
      #terminal {
        height: 72vh;
        border: 1px solid #334155;
        border-radius: 12px;
        overflow: hidden;
      }
      .hint {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 13px;
      }
      @media (max-width: 900px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>Web Embedded Terminal</h2>
      <div class="controls">
        <input id="host" type="text" placeholder="Host (default: localhost)" />
        <input id="port" type="number" placeholder="Port (22)" value="22" />
        <input id="username" type="text" placeholder="SSH username (remote)" />
        <input
          id="password"
          type="password"
          placeholder="SSH password (remote)"
        />
        <button id="connectBtn">Connect</button>
      </div>
      <div id="terminal"></div>
      <p class="hint">
        host가 localhost/127.0.0.1이면 로컬 셸에 연결됩니다. 그 외 host는 SSH로 연결합니다.
      </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
