<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A "3D" tile: bevelled rounded square lit from the top-left (gloss and a
       soft specular highlight up there, a darker rim at the bottom-right),
       with the server tower and the shield modelled the same way. -->
  <defs>
    <!-- background body: lit corner → deep tone -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.45" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <!-- top-left light: a broad soft reflection -->
    <radialGradient id="light" cx="0.18" cy="0.14" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- glossy upper half, like a curved glass surface -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- bevel rim: bright on the lit edges, dark on the far edges -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <!-- server tower: brushed dark metal with a lit left edge -->
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.12" stop-color="#1e293b"/>
      <stop offset="0.85" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="ledG" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.4" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="ledA" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.4" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    <!-- shield: gold with a lit top-left facet -->
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.35" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shieldGloss" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f0d3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
  </defs>

  <!-- tile: drop shadow, body, bottom shade, top gloss, top-left reflection, bevel rim -->
  <g filter="url(#softShadow)">
    <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#shade)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#gloss)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#light)"/>
    <!-- specular: a soft bright spot in the top-left corner -->
    <ellipse cx="118" cy="96" rx="92" ry="52" fill="#ffffff" fill-opacity="0.35" filter="url(#glow)" transform="rotate(-28 118 96)"/>
  </g>
  <rect x="19" y="19" width="474" height="474" rx="101" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <rect x="26" y="26" width="460" height="460" rx="95" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- server tower: a slab with depth (right face), lit top edge -->
  <g filter="url(#shadow)">
    <path d="M316 108 L336 96 V404 C336 418 326 430 312 430 L316 416 Z" fill="#020617" fill-opacity="0.9"/>
    <rect x="96" y="96" width="220" height="320" rx="26" fill="url(#tower)"/>
    <rect x="99" y="99" width="214" height="314" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
    <path d="M122 98 H290" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <!-- drive bays -->
    <g>
      <rect x="120" y="124" width="172" height="64" rx="12" fill="url(#bay)"/>
      <rect x="120" y="212" width="172" height="64" rx="12" fill="url(#bay)"/>
      <rect x="120" y="300" width="172" height="64" rx="12" fill="url(#bay)"/>
      <rect x="120" y="124" width="172" height="64" rx="12" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="2"/>
      <rect x="120" y="212" width="172" height="64" rx="12" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="2"/>
      <rect x="120" y="300" width="172" height="64" rx="12" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="2"/>
    </g>
    <!-- LEDs with a glow and a highlight -->
    <circle cx="146" cy="156" r="14" fill="#22c55e" fill-opacity="0.45" filter="url(#glow)"/>
    <circle cx="146" cy="244" r="14" fill="#22c55e" fill-opacity="0.45" filter="url(#glow)"/>
    <circle cx="146" cy="332" r="14" fill="#f59e0b" fill-opacity="0.45" filter="url(#glow)"/>
    <circle cx="146" cy="156" r="10" fill="url(#ledG)"/>
    <circle cx="146" cy="244" r="10" fill="url(#ledG)"/>
    <circle cx="146" cy="332" r="10" fill="url(#ledA)"/>
    <circle cx="142" cy="152" r="3" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="142" cy="240" r="3" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="142" cy="328" r="3" fill="#ffffff" fill-opacity="0.9"/>
    <!-- handles -->
    <rect x="170" y="148" width="100" height="16" rx="8" fill="url(#bar)"/>
    <rect x="170" y="236" width="100" height="16" rx="8" fill="url(#bar)"/>
    <rect x="170" y="324" width="100" height="16" rx="8" fill="url(#bar)"/>
    <path d="M176 152 H264" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
    <path d="M176 240 H264" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
    <path d="M176 328 H264" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- shield with lock (FTPS / SFTP): bevelled gold, glossy upper-left -->
  <g filter="url(#shadow)">
    <path d="M370 176 L446 204 V292 C446 348 410 392 370 410 C330 392 294 348 294 292 V204 Z" fill="url(#shield)"/>
    <path d="M370 176 L446 204 V292 C446 348 410 392 370 410 C330 392 294 348 294 292 V204 Z" fill="url(#shieldGloss)"/>
    <path d="M370 176 L446 204 V292 C446 348 410 392 370 410 C330 392 294 348 294 292 V204 Z" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5"/>
    <path d="M370 186 L436 210 V292 C436 340 404 380 370 398" fill="none" stroke="#7c2d12" stroke-opacity="0.35" stroke-width="4"/>
    <!-- lock body with a lit top edge -->
    <rect x="344" y="284" width="52" height="42" rx="8" fill="url(#lock)"/>
    <path d="M350 287 H390" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
    <path d="M352 284 V268 A18 18 0 0 1 388 268 V284" fill="none" stroke="url(#lock)" stroke-width="10" stroke-linecap="round"/>
    <path d="M356 282 V268 A14 14 0 0 1 384 268 V282" fill="none" stroke="#a5b4fc" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    <circle cx="370" cy="303" r="6" fill="#fde68a"/>
    <rect x="367" y="303" width="6" height="12" rx="2" fill="#fde68a"/>
    <circle cx="368" cy="301" r="2" fill="#ffffff"/>
  </g>

  <!-- network pulses: embossed lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M124 442 H288" stroke="#000000" stroke-opacity="0.35" stroke-width="12" transform="translate(0 3)"/>
    <path d="M124 440 H288" stroke="#ffffff" stroke-opacity="0.85" stroke-width="12"/>
    <path d="M160 464 H252" stroke="#000000" stroke-opacity="0.3" stroke-width="12" transform="translate(0 3)"/>
    <path d="M160 462 H252" stroke="#ffffff" stroke-opacity="0.5" stroke-width="12"/>
  </g>
</svg>
