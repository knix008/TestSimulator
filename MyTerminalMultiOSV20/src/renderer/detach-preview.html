<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Detach preview</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      .ghost {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        border: 2px dashed rgba(59, 130, 246, 0.95);
        border-radius: 10px;
        background: rgba(37, 99, 235, 0.12);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        color: rgba(255, 255, 255, 0.92);
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      }

      .ghost-titlebar {
        flex: 0 0 34px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border-bottom: 1px dashed rgba(59, 130, 246, 0.7);
        background: rgba(15, 23, 42, 0.45);
      }

      .ghost-dots {
        display: inline-flex;
        gap: 5px;
      }

      .ghost-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
        display: block;
      }

      .ghost-title {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ghost-body {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
      }

      .ghost-hint {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(147, 197, 253, 0.45);
        max-width: 80%;
      }
    </style>
  </head>
  <body>
    <div class="ghost">
      <div class="ghost-titlebar">
        <span class="ghost-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="ghost-title">MyTerminal</span>
      </div>
      <div class="ghost-body">
        <div class="ghost-hint" id="hint">Release to open in a new window</div>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const hint = params.get('hint');
      if (hint) document.getElementById('hint').textContent = hint;
    </script>
  </body>
</html>
