<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Tile: a bevelled slab lit from the top left -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5170"/>
      <stop offset="0.55" stop-color="#1f2c3f"/>
      <stop offset="1" stop-color="#121a26"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d131c"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="tileGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bevelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Chip: the temperature field, with a lit top and a dark extruded side -->
    <radialGradient id="heat" cx="0.46" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.2" stop-color="#ffb02e"/>
      <stop offset="0.42" stop-color="#f0522a"/>
      <stop offset="0.66" stop-color="#9b2fae"/>
      <stop offset="0.86" stop-color="#2e64e0"/>
      <stop offset="1" stop-color="#173a86"/>
    </radialGradient>
    <linearGradient id="chipSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3a"/>
      <stop offset="1" stop-color="#0c0f14"/>
    </linearGradient>
    <linearGradient id="chipGloss" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="pinV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8a99"/>
      <stop offset="0.35" stop-color="#f2f5f9"/>
      <stop offset="0.7" stop-color="#b8c2cf"/>
      <stop offset="1" stop-color="#6b7584"/>
    </linearGradient>
    <linearGradient id="pinH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8a99"/>
      <stop offset="0.35" stop-color="#f2f5f9"/>
      <stop offset="0.7" stop-color="#b8c2cf"/>
      <stop offset="1" stop-color="#6b7584"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="18" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="chipTop"><rect x="232" y="222" width="560" height="560" rx="56"/></clipPath>
  </defs>

  <!-- the tile: its thickness (a darker slab under it), the face, a bevel rim and a gloss -->
  <rect x="32" y="52" width="960" height="952" rx="200" fill="url(#tileEdge)"/>
  <rect x="32" y="32" width="960" height="952" rx="200" fill="url(#tile)"/>
  <rect x="38" y="38" width="948" height="940" rx="194" fill="none" stroke="url(#bevelLight)" stroke-width="12"/>
  <path d="M232 40 H792 a194 194 0 0 1 194 194 V420 C780 470 244 470 38 420 V234 a194 194 0 0 1 194 -194 Z" fill="url(#tileGloss)"/>

  <g filter="url(#drop)">
    <!-- pins, metallic, each with its own small shadow -->
    <g filter="url(#soft)">
      <g fill="url(#pinV)">
        <rect x="300" y="138" width="44" height="100" rx="14"/><rect x="390" y="138" width="44" height="100" rx="14"/><rect x="480" y="138" width="44" height="100" rx="14"/><rect x="570" y="138" width="44" height="100" rx="14"/><rect x="660" y="138" width="44" height="100" rx="14"/>
        <rect x="300" y="772" width="44" height="100" rx="14"/><rect x="390" y="772" width="44" height="100" rx="14"/><rect x="480" y="772" width="44" height="100" rx="14"/><rect x="570" y="772" width="44" height="100" rx="14"/><rect x="660" y="772" width="44" height="100" rx="14"/>
      </g>
      <g fill="url(#pinH)">
        <rect x="140" y="290" width="100" height="44" rx="14"/><rect x="140" y="380" width="100" height="44" rx="14"/><rect x="140" y="470" width="100" height="44" rx="14"/><rect x="140" y="560" width="100" height="44" rx="14"/><rect x="140" y="650" width="100" height="44" rx="14"/>
        <rect x="784" y="290" width="100" height="44" rx="14"/><rect x="784" y="380" width="100" height="44" rx="14"/><rect x="784" y="470" width="100" height="44" rx="14"/><rect x="784" y="560" width="100" height="44" rx="14"/><rect x="784" y="650" width="100" height="44" rx="14"/>
      </g>
    </g>

    <!-- chip: the extruded side (thickness) below the top face -->
    <rect x="232" y="252" width="560" height="560" rx="56" fill="url(#chipSide)"/>
    <!-- top face: the temperature field with isotherms -->
    <rect x="232" y="222" width="560" height="560" rx="56" fill="url(#heat)"/>
    <g clip-path="url(#chipTop)" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="10">
      <ellipse cx="512" cy="530" rx="90" ry="80"/>
      <ellipse cx="512" cy="530" rx="170" ry="155"/>
      <ellipse cx="512" cy="530" rx="250" ry="230"/>
      <ellipse cx="512" cy="530" rx="330" ry="305"/>
    </g>
    <!-- gloss and rim of the top face -->
    <rect x="232" y="222" width="560" height="560" rx="56" fill="url(#chipGloss)"/>
    <rect x="241" y="231" width="542" height="542" rx="48" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7"/>
    <rect x="232" y="222" width="560" height="560" rx="56" fill="none" stroke="#e8eef6" stroke-width="16"/>

    <!-- flame, raised off the chip with its own shadow -->
    <g filter="url(#soft)">
      <path d="M512 368 C562 440 612 482 602 562 C594 626 556 662 512 662 C468 662 430 626 422 562 C416 510 450 480 470 444 C478 490 498 506 512 512 C500 460 500 414 512 368 Z" fill="url(#flame)"/>
      <path d="M512 520 C538 560 552 584 546 612 C540 638 526 650 512 650 C498 650 484 638 478 612 C474 590 490 572 500 556 C504 576 510 584 516 586 C510 566 506 544 512 520 Z" fill="#ff8a3c" fill-opacity="0.85"/>
      <path d="M470 470 C460 500 448 520 446 552" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
</svg>
