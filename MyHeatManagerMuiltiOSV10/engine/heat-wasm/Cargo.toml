[package]
name = "heat-wasm"
version = "0.1.0"
edition = "2021"
description = "MyHeatManager engine as a plain wasm32 module (no wasm-bindgen)"
license = "MIT"

[lib]
name = "heat_wasm"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
heat-core = { path = "../heat-core", default-features = false }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
