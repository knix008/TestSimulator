[package]
name = "heat-core"
version = "0.1.0"
edition = "2021"
description = "MyHeatManager numerical engine: conduction, CHT flow, phase change, thermal stress"
license = "MIT"

[lib]
name = "heat_core"
path = "src/lib.rs"

[features]
default = ["parallel"]
# Multithreaded mat-vecs and stress operator (native only; must stay off for wasm32).
parallel = ["dep:rayon"]

[dependencies]
serde = "1"
serde_json = "1"
rayon = { version = "1", optional = true }

# The physics tests are numerically heavy; keep debug/test builds optimised.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
opt-level = 3
