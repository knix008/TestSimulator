<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MySimulationMath app icon: a bevelled glass tile holding matrix
       brackets, a grid of matrix cells and a glowing damped wave. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fd6"/>
      <stop offset="0.55" stop-color="#173c86"/>
      <stop offset="1" stop-color="#0b1d47"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe0ff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5d8fe0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#020814" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d5e4f7"/>
      <stop offset="1" stop-color="#8aa6cc"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.5" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#ff5a36"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#9fd1ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fd1ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="26" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="6" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="92" y="80" width="840" height="840" rx="190"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="92" y="80" width="840" height="840" rx="190" fill="url(#tile)"/>
    <rect x="92" y="80" width="840" height="840" rx="190" fill="url(#light)"/>
    <!-- bevel: light rim top-left, dark rim bottom-right -->
    <rect x="104" y="92" width="816" height="816" rx="180" fill="none" stroke="url(#rim)" stroke-width="22"/>
  </g>

  <g clip-path="url(#clip)">
    <!-- matrix cells -->
    <g fill="#7fb4ff" fill-opacity="0.22">
      <rect x="300" y="270" width="110" height="110" rx="22"/>
      <rect x="457" y="270" width="110" height="110" rx="22"/>
      <rect x="614" y="270" width="110" height="110" rx="22"/>
      <rect x="300" y="427" width="110" height="110" rx="22"/>
      <rect x="457" y="427" width="110" height="110" rx="22" fill-opacity="0.38"/>
      <rect x="614" y="427" width="110" height="110" rx="22"/>
      <rect x="300" y="584" width="110" height="110" rx="22"/>
      <rect x="457" y="584" width="110" height="110" rx="22"/>
      <rect x="614" y="584" width="110" height="110" rx="22"/>
    </g>
    <!-- matrix brackets -->
    <g filter="url(#drop)" fill="url(#bracket)">
      <path d="M262 214 h-78 a20 20 0 0 0 -20 20 v532 a20 20 0 0 0 20 20 h78 v-52 h-46 v-468 h46 z"/>
      <path d="M762 214 h78 a20 20 0 0 1 20 20 v532 a20 20 0 0 1 -20 20 h-78 v-52 h46 v-468 h-46 z"/>
    </g>
    <!-- damped wave -->
    <path d="M196 500 C 246 300, 296 300, 346 500 S 446 680, 496 500 S 586 380, 626 500 S 696 580, 726 500 S 786 450, 828 500"
          fill="none" stroke="url(#wave)" stroke-width="40" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M196 500 C 246 300, 296 300, 346 500 S 446 680, 496 500 S 586 380, 626 500 S 696 580, 726 500 S 786 450, 828 500"
          fill="none" stroke="#fff6d8" stroke-opacity="0.75" stroke-width="10" stroke-linecap="round" transform="translate(-3,-6)"/>
    <!-- sample points -->
    <g fill="#ffffff" stroke="#ff7a1f" stroke-width="10">
      <circle cx="346" cy="500" r="20"/>
      <circle cx="496" cy="500" r="20"/>
      <circle cx="626" cy="500" r="20"/>
    </g>
    <!-- gloss -->
    <path d="M92 80 h840 v330 c-200 90 -560 120 -840 40 z" fill="url(#gloss)"/>
  </g>
</svg>
