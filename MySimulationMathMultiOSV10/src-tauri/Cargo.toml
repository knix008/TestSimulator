[package]
name = "mysimulationmath"
version = "1.0.0"
description = "MySimulationMath"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"
rust-version = "1.83"

[lib]
name = "mysimulationmath_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tiny_http = "0.12"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = 2
strip = true
incremental = true
