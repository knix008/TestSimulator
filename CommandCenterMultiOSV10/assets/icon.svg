<?xml version="1.0" encoding="UTF-8"?>
<!-- Command Center application icon.
     A sci-fi command center building in the spirit of the classic RTS base
     (an original drawing): a wide armoured octagonal platform with hazard
     stripes, a raised command deck with a domed roof, lit windows, a radar
     dish and an antenna mast, standing on a dark planet ground under a night
     sky. Strong silhouette (wide base + dome) and warm amber lights so it
     still reads at 16–32 px. The same file drives the app, installer,
     uninstaller and shortcut icons on every platform, plus the web favicon
     (scripts/generate-icons.mjs). -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0b1633"/>
      <stop offset="0.6" stop-color="#101a3c"/>
      <stop offset="1"   stop-color="#1a1f3f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#4a3b33"/>
      <stop offset="1"   stop-color="#241b17"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <!-- armour plating -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#c3ccd9"/>
      <stop offset="1"   stop-color="#8e9aab"/>
    </linearGradient>
    <linearGradient id="steelSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#7c8797"/>
      <stop offset="1"   stop-color="#3f4753"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#5b6473"/>
      <stop offset="1"   stop-color="#2c313b"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#8fa3c2"/>
      <stop offset="0.5" stop-color="#5f6f8c"/>
      <stop offset="1"   stop-color="#3a455c"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.35" cy="0.25" r="0.85">
      <stop offset="0"   stop-color="#dbe6f5"/>
      <stop offset="0.45" stop-color="#8ea2c4"/>
      <stop offset="1"   stop-color="#3d4a66"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffd166"/>
      <stop offset="1"   stop-color="#ff7a00"/>
    </linearGradient>
    <linearGradient id="hazard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb703"/><stop offset="0.125" stop-color="#ffb703"/>
      <stop offset="0.125" stop-color="#1f232b"/><stop offset="0.25" stop-color="#1f232b"/>
      <stop offset="0.25" stop-color="#ffb703"/><stop offset="0.375" stop-color="#ffb703"/>
      <stop offset="0.375" stop-color="#1f232b"/><stop offset="0.5" stop-color="#1f232b"/>
      <stop offset="0.5" stop-color="#ffb703"/><stop offset="0.625" stop-color="#ffb703"/>
      <stop offset="0.625" stop-color="#1f232b"/><stop offset="0.75" stop-color="#1f232b"/>
      <stop offset="0.75" stop-color="#ffb703"/><stop offset="0.875" stop-color="#ffb703"/>
      <stop offset="0.875" stop-color="#1f232b"/><stop offset="1" stop-color="#1f232b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="tileClip"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <!-- light: a glossy glass sheen over the tile, specular highlights on the metal and the dome -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflMask"><rect x="64" y="872" width="896" height="120" fill="url(#reflFade)"/></mask>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- tile: night sky over planet ground -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sky)"/>
  <g clip-path="url(#tileClip)">
    <g fill="#ffffff">
      <circle cx="180" cy="170" r="5" opacity="0.8"/><circle cx="300" cy="120" r="3.5" opacity="0.6"/><circle cx="840" cy="150" r="5" opacity="0.9"/>
      <circle cx="700" cy="110" r="3" opacity="0.6"/><circle cx="900" cy="300" r="3.5" opacity="0.6"/><circle cx="130" cy="330" r="3" opacity="0.5"/>
      <circle cx="540" cy="140" r="3" opacity="0.7"/><circle cx="420" cy="190" r="2.5" opacity="0.5"/>
    </g>
    <!-- a distant planet -->
    <circle cx="800" cy="230" r="70" fill="#5f7fd0" opacity="0.55"/>
    <circle cx="785" cy="215" r="70" fill="#8fb0ff" opacity="0.25"/>
    <!-- ground -->
    <ellipse cx="512" cy="1010" rx="620" ry="230" fill="url(#ground)"/>
    <ellipse cx="512" cy="905" rx="410" ry="60" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  </g>

  <!-- ── building (scaled up so it fills the tile and stays readable when small) ── -->
  <g id="building" transform="translate(512 770) scale(1.22) translate(-512 -770)">
  <!-- octagonal armoured platform: side wall -->
  <path d="M196 700 L300 636 L724 636 L828 700 L828 790 L724 854 L300 854 L196 790 Z" fill="url(#steelSide)"/>
  <!-- hazard stripe band around the base -->
  <path d="M196 760 L828 760 L828 796 L724 854 L300 854 L196 796 Z" fill="url(#hazard)" opacity="0.95"/>
  <path d="M196 700 L828 700 L828 762 L196 762 Z" fill="url(#steelDark)"/>
  <!-- platform top -->
  <path d="M196 700 L300 636 L724 636 L828 700 L724 764 L300 764 Z" fill="url(#steelTop)"/>
  <path d="M300 636 L724 636 L828 700" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="8" stroke-linejoin="round"/>
  <!-- rivets on the platform edge -->
  <g fill="#2c313b" opacity="0.7">
    <circle cx="240" cy="725" r="7"/><circle cx="300" cy="750" r="7"/><circle cx="370" cy="752" r="7"/><circle cx="450" cy="752" r="7"/>
    <circle cx="574" cy="752" r="7"/><circle cx="654" cy="752" r="7"/><circle cx="724" cy="750" r="7"/><circle cx="784" cy="725" r="7"/>
  </g>
  <!-- landing pad on the left of the platform -->
  <ellipse cx="292" cy="720" rx="62" ry="24" fill="#3a4250"/>
  <ellipse cx="292" cy="714" rx="62" ry="24" fill="#6a7686"/>
  <ellipse cx="292" cy="714" rx="34" ry="13" fill="none" stroke="#ffb703" stroke-width="8"/>

  <!-- command deck (raised octagonal body) -->
  <path d="M356 530 L430 490 L594 490 L668 530 L668 660 L594 700 L430 700 L356 660 Z" fill="url(#deck)"/>
  <path d="M356 530 L430 490 L594 490 L668 530 L594 570 L430 570 Z" fill="url(#steelTop)"/>
  <path d="M430 490 L594 490 L668 530" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="7" stroke-linejoin="round"/>
  <!-- deck windows (amber, lit) -->
  <g fill="url(#amber)" filter="url(#glow)">
    <rect x="392" y="596" width="40" height="46" rx="6"/>
    <rect x="452" y="606" width="120" height="44" rx="6"/>
    <rect x="592" y="596" width="40" height="46" rx="6"/>
  </g>
  <g fill="#1a1f2b" opacity="0.5">
    <rect x="452" y="606" width="120" height="8"/>
  </g>

  <!-- dome -->
  <ellipse cx="512" cy="500" rx="122" ry="26" fill="#2c313b" opacity="0.6"/>
  <path d="M400 496 A112 112 0 0 1 624 496 Z" fill="url(#dome)"/>
  <path d="M400 496 A112 112 0 0 1 624 496" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
  <!-- dome seams -->
  <path d="M512 384 V496 M440 410 L512 496 L584 410" fill="none" stroke="#2c313b" stroke-opacity="0.35" stroke-width="5"/>
  <!-- dome light -->
  <circle cx="512" cy="392" r="16" fill="#ff7a00" filter="url(#glow)"/>
  <circle cx="512" cy="392" r="9" fill="#ffd166"/>

  <!-- specular: dome highlight and rim light, light sweep on the platform and the deck -->
  <ellipse cx="462" cy="418" rx="42" ry="26" fill="url(#spec)" transform="rotate(-30 462 418)"/>
  <path d="M600 420 A112 112 0 0 1 622 486" fill="none" stroke="#bfe9ff" stroke-opacity="0.7" stroke-width="7" stroke-linecap="round"/>
  <path d="M300 636 L724 636 L828 700 L724 764 L300 764 L196 700 Z" fill="url(#sweep)" opacity="0.5"/>
  <path d="M356 530 L430 490 L594 490 L668 530 L594 570 L430 570 Z" fill="url(#sweep)" opacity="0.6"/>
  <path d="M430 494 L446 494 L372 700 L356 700 Z" fill="#ffffff" opacity="0.14"/>
  <!-- antenna mast -->
  <rect x="504" y="286" width="16" height="106" rx="6" fill="#9aa5b5"/>
  <circle cx="512" cy="280" r="18" fill="#ff3b30" filter="url(#glow)"/>
  <circle cx="512" cy="280" r="9" fill="#ffd8d6"/>

  <!-- radar dish, top right of the deck -->
  <rect x="626" y="470" width="14" height="60" rx="5" fill="#9aa5b5"/>
  <path d="M604 470 A48 42 0 0 1 700 470 L652 482 Z" fill="url(#steelTop)" stroke="#3f4753" stroke-width="5" stroke-linejoin="round"/>
  <line x1="652" y1="482" x2="652" y2="440" stroke="#9aa5b5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="652" cy="436" r="8" fill="#4cc9f0" filter="url(#glow)"/>

  <!-- side pods with exhaust lights -->
  <path d="M232 690 L280 662 L280 742 L232 770 Z" fill="url(#steelDark)"/>
  <path d="M792 690 L744 662 L744 742 L792 770 Z" fill="url(#steelDark)"/>
  <g fill="#4cc9f0" filter="url(#glow)">
    <rect x="244" y="700" width="24" height="12" rx="4"/><rect x="244" y="726" width="24" height="12" rx="4"/>
    <rect x="756" y="700" width="24" height="12" rx="4"/><rect x="756" y="726" width="24" height="12" rx="4"/>
  </g>

  </g>

  <!-- the building mirrored in the polished ground -->
  <g clip-path="url(#tileClip)" mask="url(#reflMask)" filter="url(#blur6)">
    <use href="#building" transform="translate(0 1744) scale(1 -1)"/>
  </g>
  <!-- glass sheen over the whole tile -->
  <path d="M64 264 A200 200 0 0 1 264 64 H760 A200 200 0 0 1 960 264 V300 Q560 560 64 700 Z" fill="url(#gloss)" clip-path="url(#tileClip)"/>

  <!-- tile bevel on top of everything -->
  <rect x="76" y="76" width="872" height="872" rx="188" fill="none" stroke="url(#tileEdge)" stroke-width="24"/>
</svg>
