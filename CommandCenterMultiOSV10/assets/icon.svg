<?xml version="1.0" encoding="UTF-8"?>
<!-- Command Center application icon.
     A polished "control-room" tile: a deep indigo→violet slab with a metallic
     bevel ring, a faint grid, two frosted-glass file panels and a glowing
     amber double-arrow (transfer between the panels) in the middle. The same
     file drives the app, the installer and the uninstaller icons on every
     platform, plus the web favicon (see scripts/generate-icons.mjs). -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- body -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#3d4bff"/>
      <stop offset="0.45" stop-color="#2431b8"/>
      <stop offset="1"    stop-color="#12105a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.16" r="0.75">
      <stop offset="0"   stop-color="#9fb0ff" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#6d7cff" stop-opacity="0.25"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0"   stop-color="#a24cff" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#a24cff" stop-opacity="0"/>
    </radialGradient>
    <!-- metallic bevel ring -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#c9d2e6"/>
      <stop offset="0.5"  stop-color="#7d8aa8"/>
      <stop offset="0.75" stop-color="#d6deee"/>
      <stop offset="1"    stop-color="#5c6a8a"/>
    </linearGradient>
    <linearGradient id="ringInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1b1f4a"/>
      <stop offset="1"   stop-color="#05061a"/>
    </linearGradient>
    <!-- glass panels -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1"   stop-color="#dfe5ff" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="glassHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#8ea2ff"/>
      <stop offset="1"   stop-color="#4f63f2"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="rowA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6cf0"/>
      <stop offset="1" stop-color="#8b98ff"/>
    </linearGradient>
    <!-- amber arrow -->
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffe680"/>
      <stop offset="0.45" stop-color="#ffb020"/>
      <stop offset="1"    stop-color="#e55d00"/>
    </linearGradient>
    <linearGradient id="arrowEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffe08a"/>
      <stop offset="1"   stop-color="#f5a623"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#04051e" flood-opacity="0.6"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04051e" flood-opacity="0.5"/>
    </filter>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="tile">
      <rect x="84" y="84" width="856" height="856" rx="200"/>
    </clipPath>
    <clipPath id="inner">
      <rect x="126" y="126" width="772" height="772" rx="164"/>
    </clipPath>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- ── Slab with metallic bevel ── -->
  <g filter="url(#drop)">
    <rect x="84" y="84" width="856" height="856" rx="200" fill="url(#ring)"/>
  </g>
  <rect x="84" y="84" width="856" height="856" rx="200" fill="none" stroke="#0b0d2a" stroke-opacity="0.55" stroke-width="4"/>
  <rect x="112" y="112" width="800" height="800" rx="176" fill="url(#ringInner)"/>
  <rect x="126" y="126" width="772" height="772" rx="164" fill="url(#body)"/>
  <g clip-path="url(#inner)">
    <rect x="126" y="126" width="772" height="772" fill="url(#grid)"/>
    <rect x="126" y="126" width="772" height="772" fill="url(#violet)"/>
    <rect x="126" y="126" width="772" height="772" fill="url(#glow)"/>
    <!-- horizon sheen -->
    <path d="M126 126 H898 V430 Q 512 560 126 430 Z" fill="#ffffff" opacity="0.10"/>
  </g>
  <rect x="126" y="126" width="772" height="772" rx="164" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- ── Left glass panel ── -->
  <g filter="url(#soft)">
    <rect x="196" y="300" width="262" height="430" rx="30" fill="url(#glass)"/>
  </g>
  <path d="M196 330 a30 30 0 0 1 30 -30 h202 a30 30 0 0 1 30 30 v54 h-262 z" fill="url(#glassHead)"/>
  <rect x="196" y="300" width="262" height="430" rx="30" fill="none" stroke="url(#glassEdge)" stroke-width="3"/>
  <circle cx="226" cy="326" r="7" fill="#ff6b6b"/><circle cx="248" cy="326" r="7" fill="#ffd166"/><circle cx="270" cy="326" r="7" fill="#5cff9d"/>
  <path d="M222 372 h32 l12 12 h58 a7 7 0 0 1 7 7 v28 a7 7 0 0 1 -7 7 h-102 a7 7 0 0 1 -7 -7 v-40 a7 7 0 0 1 7 -7 z" fill="url(#folder)" opacity="0.001"/>
  <g>
    <rect x="224" y="404" width="26" height="22" rx="5" fill="url(#folder)"/><rect x="262" y="408" width="160" height="14" rx="7" fill="url(#rowA)"/>
    <rect x="224" y="450" width="26" height="22" rx="5" fill="url(#folder)"/><rect x="262" y="454" width="120" height="14" rx="7" fill="url(#rowA)" opacity="0.85"/>
    <rect x="224" y="496" width="26" height="22" rx="5" fill="#9fb3ff"/><rect x="262" y="500" width="148" height="14" rx="7" fill="url(#rowA)" opacity="0.7"/>
    <rect x="224" y="542" width="26" height="22" rx="5" fill="#9fb3ff"/><rect x="262" y="546" width="96" height="14" rx="7" fill="url(#rowA)" opacity="0.55"/>
    <rect x="224" y="588" width="26" height="22" rx="5" fill="#9fb3ff"/><rect x="262" y="592" width="134" height="14" rx="7" fill="url(#rowA)" opacity="0.45"/>
    <rect x="224" y="634" width="26" height="22" rx="5" fill="#9fb3ff"/><rect x="262" y="638" width="110" height="14" rx="7" fill="url(#rowA)" opacity="0.35"/>
  </g>
  <!-- highlighted (selected) row -->
  <rect x="210" y="444" width="234" height="34" rx="8" fill="#4f63f2" opacity="0.18"/>

  <!-- ── Right glass panel ── -->
  <g filter="url(#soft)">
    <rect x="566" y="300" width="262" height="430" rx="30" fill="url(#glass)"/>
  </g>
  <path d="M566 330 a30 30 0 0 1 30 -30 h202 a30 30 0 0 1 30 30 v54 h-262 z" fill="url(#glassHead)"/>
  <rect x="566" y="300" width="262" height="430" rx="30" fill="none" stroke="url(#glassEdge)" stroke-width="3"/>
  <circle cx="596" cy="326" r="7" fill="#ff6b6b"/><circle cx="618" cy="326" r="7" fill="#ffd166"/><circle cx="640" cy="326" r="7" fill="#5cff9d"/>
  <g>
    <rect x="594" y="404" width="26" height="22" rx="5" fill="url(#folder)"/><rect x="632" y="408" width="130" height="14" rx="7" fill="url(#rowA)"/>
    <rect x="594" y="450" width="26" height="22" rx="5" fill="#9fb3ff"/><rect x="632" y="454" width="164" height="14" rx="7" fill="url(#rowA)" opacity="0.85"/>
    <rect x="594" y="496" width="26" height="22" rx="5" fill="#9fb3ff"/><rect x="632" y="500" width="104" height="14" rx="7" fill="url(#rowA)" opacity="0.7"/>
    <rect x="594" y="542" width="26" height="22" rx="5" fill="#9fb3ff"/><rect x="632" y="546" width="150" height="14" rx="7" fill="url(#rowA)" opacity="0.55"/>
    <rect x="594" y="588" width="26" height="22" rx="5" fill="#9fb3ff"/><rect x="632" y="592" width="118" height="14" rx="7" fill="url(#rowA)" opacity="0.45"/>
    <rect x="594" y="634" width="26" height="22" rx="5" fill="#9fb3ff"/><rect x="632" y="638" width="140" height="14" rx="7" fill="url(#rowA)" opacity="0.35"/>
  </g>

  <!-- ── Glowing amber double arrow ── -->
  <path d="M412 512 L482 440 V480 H542 V440 L612 512 L542 584 V544 H482 V584 Z" fill="#ffb020" opacity="0.85" filter="url(#neon)"/>
  <g filter="url(#soft)">
    <path d="M412 512 L482 440 V480 H542 V440 L612 512 L542 584 V544 H482 V584 Z" fill="url(#arrow)"/>
  </g>
  <path d="M412 512 L482 440 V480 H542 V440 L612 512 L542 584 V544 H482 V584 Z" fill="none" stroke="url(#arrowEdge)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M484 484 H540" stroke="#ffffff" stroke-opacity="0.7" stroke-width="7" stroke-linecap="round"/>

  <!-- ── Bottom status strip ── -->
  <rect x="196" y="770" width="632" height="52" rx="26" fill="#000000" opacity="0.28"/>
  <rect x="196" y="770" width="632" height="52" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="234" cy="796" r="11" fill="#5cff9d"/>
  <circle cx="234" cy="796" r="11" fill="#5cff9d" opacity="0.6" filter="url(#blur10)"/>
  <rect x="262" y="787" width="220" height="18" rx="9" fill="#ffffff" opacity="0.55"/>
  <rect x="640" y="787" width="160" height="18" rx="9" fill="#ffffff" opacity="0.25"/>

  <!-- ── Specular highlight over everything (glass dome feel) ── -->
  <g clip-path="url(#tile)">
    <ellipse cx="330" cy="200" rx="260" ry="120" fill="#ffffff" opacity="0.22" filter="url(#blur10)" transform="rotate(-22 330 200)"/>
    <path d="M84 84 H940 V330 Q 512 470 84 330 Z" fill="#ffffff" opacity="0.06"/>
  </g>
</svg>
