<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:;" />
  <title>Play list — MyVideoPlayer</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="styles/themes.css" />
  <link rel="stylesheet" href="styles/history-window.css" />
</head>
<body class="history-window-body">
  <div class="history-window" id="historyWindow">
    <header class="history-titlebar" id="historyTitlebar">
      <div class="history-titlebar-titles">
        <span class="history-title" data-i18n="historyTitle">Play list</span>
        <span class="history-count" id="historyCount"></span>
      </div>
      <div class="history-titlebar-actions">
        <label class="history-opacity" for="historyOpacityBar">
          <svg class="history-opacity-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20V2Zm0 18a8 8 0 0 1 0-16v16Z"/></svg>
          <input type="range" class="history-opacity-bar" id="historyOpacityBar" min="20" max="100" step="1" value="100" style="--fill: 100%" />
          <span class="history-opacity-value" id="historyOpacityValue">100%</span>
        </label>
        <button type="button" class="history-win-btn" id="btnHistoryClear" data-i18n="recentClear">Clear</button>
        <button type="button" class="history-win-close" id="btnHistoryWinClose" aria-label="Close">✕</button>
      </div>
    </header>
    <div class="history-body">
      <ul class="history-list" id="historyList"></ul>
      <div class="history-empty" id="historyEmpty" data-i18n="historyEmpty">No played items yet</div>
    </div>
    <div
      class="history-resize-grip"
      id="historyResizeGrip"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize window"
      title="Resize"
    ></div>
  </div>
  <script type="module" src="js/history-window-app.js"></script>
</body>
</html>
