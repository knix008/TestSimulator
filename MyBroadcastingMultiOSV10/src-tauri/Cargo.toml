[package]
name = "mybroadcasting"
version = "1.0.0"
description = "Personal live streaming and recording studio"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "mybroadcasting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
arboard = { version = "3.6", default-features = false }
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "webview-data-url"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tungstenite = "0.26"
# Account connection: HTTPS to the streaming services' sign-in and API hosts (MIT / Apache-2.0).
ureq = "3"
# Virtual camera: the program's JPEG frames decoded for the camera DLL (MIT / Apache-2.0 / Zlib).
zune-jpeg = "0.4"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }

# Printing straight to a printer (the same versions as Tauri's own WebView2).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_System_LibraryLoader"] }

# Window edge resizing on macOS and Linux (ResizeDirection is not re-exported by tauri).
[target.'cfg(not(windows))'.dependencies]
tauri-runtime = "2"

[dev-dependencies]
tempfile = "3"


# Installed app: smaller and faster (whole-program optimisation, no debug symbols). Debug builds and tests are unaffected.
[profile.release]
lto = true
codegen-units = 1
strip = true
