<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- MyBroadcasting: a studio camera on air (red tally light, signal waves) on a glossy 3D tile -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a6b"/>
      <stop offset="0.45" stop-color="#d9364a"/>
      <stop offset="1" stop-color="#5a1236"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.3" cy="0.24" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4256"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="0.35" stop-color="#2f6fd6"/>
      <stop offset="1" stop-color="#0a1a3c"/>
    </radialGradient>
    <radialGradient id="tally" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff2f2"/>
      <stop offset="0.3" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#9b0d18"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="26" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="72" y="64" width="880" height="880" rx="196" fill="url(#body)"/>
    <rect x="72" y="64" width="880" height="880" rx="196" fill="url(#spec)"/>
    <rect x="72" y="64" width="880" height="880" rx="196" fill="none" stroke="url(#bevel)" stroke-width="18"/>
  </g>
  <!-- signal waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.92">
    <path d="M708 236 a120 120 0 0 1 0 170" stroke-width="34" opacity="0.95"/>
    <path d="M770 180 a200 200 0 0 1 0 282" stroke-width="34" opacity="0.7"/>
    <path d="M832 128 a280 280 0 0 1 0 386" stroke-width="30" opacity="0.45"/>
  </g>
  <!-- camera (raised so the stand clears the ON AIR plate) -->
  <g filter="url(#soft)" transform="translate(0 -70)">
    <rect x="200" y="360" width="440" height="300" rx="56" fill="url(#cam)"/>
    <path d="M640 440 L800 360 V660 L640 580 Z" fill="url(#cam)"/>
    <rect x="200" y="360" width="440" height="300" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8"/>
    <circle cx="420" cy="510" r="112" fill="#0d0f16"/>
    <circle cx="420" cy="510" r="92" fill="url(#lens)"/>
    <circle cx="390" cy="478" r="26" fill="#ffffff" opacity="0.75"/>
    <circle cx="262" cy="410" r="30" fill="url(#tally)"/>
    <!-- stand -->
    <path d="M380 660 L330 820 M460 660 L510 820 M420 660 V840" stroke="#1b1e2a" stroke-width="30" stroke-linecap="round"/>
  </g>
  <!-- ON AIR plate -->
  <g filter="url(#soft)">
    <rect x="512" y="700" width="392" height="120" rx="28" fill="#ffffff"/>
    <text x="708" y="784" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" text-anchor="middle" fill="#d9364a">ON AIR</text>
  </g>
  <rect x="72" y="64" width="880" height="440" rx="196" fill="url(#gloss)" opacity="0.6"/>
</svg>
