<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- .mybc scene collection: a page with a scene layout and the on-air camera badge -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ee"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a6b"/>
      <stop offset="1" stop-color="#8a1a3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="20"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M220 80 H640 L820 260 V920 a24 24 0 0 1 -24 24 H220 a24 24 0 0 1 -24 -24 V104 a24 24 0 0 1 24 -24z" fill="url(#paper)" stroke="#b9c1d1" stroke-width="10"/>
    <path d="M640 80 V236 a24 24 0 0 0 24 24 H820" fill="#cfd6e3" stroke="#b9c1d1" stroke-width="10"/>
  </g>
  <rect x="270" y="320" width="420" height="250" rx="22" fill="#20263a"/>
  <rect x="300" y="350" width="200" height="130" rx="12" fill="#3b6ff5"/>
  <rect x="520" y="420" width="140" height="120" rx="12" fill="#21c35a"/>
  <rect x="300" y="500" width="200" height="40" rx="10" fill="#e5484d"/>
  <rect x="270" y="620" width="420" height="34" rx="17" fill="#c3cad8"/>
  <rect x="270" y="690" width="300" height="34" rx="17" fill="#c3cad8"/>
  <g filter="url(#shadow)">
    <circle cx="700" cy="800" r="150" fill="url(#badge)"/>
    <rect x="610" y="750" width="130" height="100" rx="20" fill="#ffffff"/>
    <path d="M740 780 L800 750 V850 L740 820 Z" fill="#ffffff"/>
    <circle cx="660" cy="800" r="26" fill="#d9364a"/>
  </g>
</svg>
