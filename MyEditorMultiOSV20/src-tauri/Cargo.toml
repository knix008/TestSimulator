[package]
name = "myeditor"
version = "1.0.0"
description = "My Editor"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "myeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
