<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The icon of a saved project (.mdcv): a sheet of paper carrying the small
    conversion badge, so it is recognisably ours without being mistaken for the
    program itself. Rendered to file-icon.ico / file-icon.png by
    scripts/create-icons.cjs and registered by the installer.
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7f4"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8fa4c8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3d1ea"/>
      <stop offset="1" stop-color="#8ea6d0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fa3ff"/>
      <stop offset="1" stop-color="#0d2f7a"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrowA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f7931e"/>
    </linearGradient>
    <linearGradient id="arrowB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ef0c2"/>
      <stop offset="1" stop-color="#22b573"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sheet"><path d="M112 40 h190 l110 110 v312 a20 20 0 0 1 -20 20 h-280 a20 20 0 0 1 -20 -20 v-402 a20 20 0 0 1 20 -20 z"/></clipPath>
  </defs>
  <g filter="url(#drop)">
    <path d="M112 40 h190 l110 110 v312 a20 20 0 0 1 -20 20 h-280 a20 20 0 0 1 -20 -20 v-402 a20 20 0 0 1 20 -20 z" fill="url(#paper)" stroke="url(#edge)" stroke-width="4"/>
  </g>
  <path d="M302 40 v90 a20 20 0 0 0 20 20 h90 z" fill="url(#fold)"/>
  <g fill="#8aa0c8" opacity="0.9">
    <rect x="130" y="196" width="150" height="16" rx="8"/>
    <rect x="130" y="232" width="200" height="16" rx="8"/>
    <rect x="130" y="268" width="120" height="16" rx="8"/>
    <rect x="130" y="304" width="170" height="16" rx="8"/>
  </g>
  <g filter="url(#drop)">
    <circle cx="330" cy="392" r="86" fill="url(#badge)"/>
  </g>
  <circle cx="330" cy="392" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3"/>
  <path d="M348 350 a46 46 0 0 1 20 62 l12 10 l-40 8 l6 -40 l12 10 a30 30 0 0 0 -14 -40 z" fill="url(#arrowA)"/>
  <path d="M312 434 a46 46 0 0 1 -20 -62 l-12 -10 l40 -8 l-6 40 l-12 -10 a30 30 0 0 0 14 40 z" fill="url(#arrowB)"/>
  <g clip-path="url(#sheet)">
    <ellipse cx="150" cy="90" rx="200" ry="120" fill="url(#shine)"/>
  </g>
  <circle cx="300" cy="360" r="40" fill="url(#shine)"/>
</svg>
