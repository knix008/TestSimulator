<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The application icon: a glossy 3D tile carrying two documents — a source
    page marked "DOC" and a target page marked "PDF" — joined by a solid 3D
    arrow, so the picture reads as "document converter" at a glance. The
    corners outside the rounded tile are transparent and the light falls from
    the top left. Every icon in the build is rendered from this file by
    scripts/create-icons.cjs.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eb1ff"/>
      <stop offset="0.5" stop-color="#1e63d6"/>
      <stop offset="1" stop-color="#0b2b6e"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.14" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e1f3"/>
    </linearGradient>
    <linearGradient id="paperSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb3d6"/>
      <stop offset="1" stop-color="#6f88b8"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d4ec"/>
      <stop offset="1" stop-color="#8ea6d0"/>
    </linearGradient>
    <linearGradient id="arrowTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="0.5" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="arrowSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c25e00"/>
      <stop offset="1" stop-color="#7a3300"/>
    </linearGradient>
    <linearGradient id="docLabel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pdfLabel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="12" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="7" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip"><rect x="36" y="36" width="440" height="440" rx="96"/></clipPath>
  </defs>

  <!-- The tile: base colour, bevel and rim. -->
  <g filter="url(#drop)">
    <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#tile)"/>
  </g>
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#bevel)"/>
  <rect x="43" y="43" width="426" height="426" rx="89" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- The picture, at 80% of the tile, centred. -->
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
  <g transform="translate(0 -42)">
  <!-- Source document (left): a page with thickness and a folded corner, labelled DOC. -->
  <g filter="url(#soft)">
    <path d="M66 156 h120 l40 40 v170 a12 12 0 0 1 -12 12 h-148 a12 12 0 0 1 -12 -12 v-198 a12 12 0 0 1 12 -12 z" fill="url(#paperSide)" transform="translate(8 8)"/>
    <path d="M66 156 h120 l40 40 v170 a12 12 0 0 1 -12 12 h-148 a12 12 0 0 1 -12 -12 v-198 a12 12 0 0 1 12 -12 z" fill="url(#paper)"/>
    <path d="M186 156 v28 a12 12 0 0 0 12 12 h28 z" fill="url(#fold)"/>
  </g>
  <g fill="#8aa0c8" opacity="0.9">
    <rect x="76" y="216" width="80" height="9" rx="4"/>
    <rect x="76" y="236" width="110" height="9" rx="4"/>
    <rect x="76" y="256" width="70" height="9" rx="4"/>
  </g>
  <rect x="68" y="298" width="110" height="52" rx="10" fill="url(#docLabel)" filter="url(#soft)"/>
  <text x="123" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#ffffff">DOC</text>

  <!-- Target document (right), labelled PDF. -->
  <g filter="url(#soft)">
    <path d="M286 156 h120 l40 40 v170 a12 12 0 0 1 -12 12 h-148 a12 12 0 0 1 -12 -12 v-198 a12 12 0 0 1 12 -12 z" fill="url(#paperSide)" transform="translate(8 8)"/>
    <path d="M286 156 h120 l40 40 v170 a12 12 0 0 1 -12 12 h-148 a12 12 0 0 1 -12 -12 v-198 a12 12 0 0 1 12 -12 z" fill="url(#paper)"/>
    <path d="M406 156 v28 a12 12 0 0 0 12 12 h28 z" fill="url(#fold)"/>
  </g>
  <g fill="#8aa0c8" opacity="0.9">
    <rect x="296" y="216" width="80" height="9" rx="4"/>
    <rect x="296" y="236" width="110" height="9" rx="4"/>
    <rect x="296" y="256" width="70" height="9" rx="4"/>
  </g>
  <rect x="288" y="298" width="110" height="52" rx="10" fill="url(#pdfLabel)" filter="url(#soft)"/>
  <text x="343" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#ffffff">PDF</text>

  <!-- The 3D arrow from the source to the target, with a darker extruded side. -->
  <g filter="url(#drop)">
    <path d="M191 236 h64 v-30 l66 60 l-66 60 v-30 h-64 z" fill="url(#arrowSide)" transform="translate(0 14)"/>
    <path d="M191 236 h64 v-30 l66 60 l-66 60 v-30 h-64 z" fill="url(#arrowTop)"/>
    <path d="M195 240 h60 v-22 l56 48" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  </g>

  </g>

  <!-- Caption strip along the bottom of the tile. -->
  <text x="256" y="417" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="2" filter="url(#soft)">CONVERTER</text>

  </g>

  <!-- Light from the top left. -->
  <g clip-path="url(#tileClip)">
    <ellipse cx="150" cy="105" rx="230" ry="150" fill="url(#shine)"/>
    <path d="M36 132 a96 96 0 0 1 96 -96 h248 a96 96 0 0 1 60 22 c-120 30 -280 60 -404 140 z" fill="#ffffff" fill-opacity="0.16"/>
  </g>
</svg>
