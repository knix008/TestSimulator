[package]
name = "mykanban"
version = "1.0.2"
description = "Multi-platform Kanban Board"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "mykanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-runtime = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
