<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTerminal</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/popup.css" />
    <link rel="icon" href="../../assets/icons/icon.png" />
  </head>
  <body class="popup-body">
    <div id="popup-app" class="popup-app">
      <header class="popup-titlebar" data-drag>
        <span id="popup-title-icon" class="popup-title-icon" aria-hidden="true"></span>
        <h1 id="popup-title" class="popup-title">MyTerminal</h1>
        <button class="tb-btn popup-close" id="popup-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </header>
      <main id="popup-body" class="popup-body-content"></main>
      <footer id="popup-footer" class="popup-footer"></footer>
    </div>
    <script src="./js/popup.bundle.js"></script>
  </body>
</html>
