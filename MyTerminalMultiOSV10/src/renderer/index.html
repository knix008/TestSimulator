<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTerminal</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="icon" href="../../assets/icons/icon.png" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar" class="toolbar" role="toolbar">
        <div class="toolbar-brand" data-drag>
          <img class="brand-icon" src="../../assets/icons/icon.png" alt="" />
          <span class="brand-title" id="brand-title">MyTerminal V1.0.0</span>
        </div>

        <div class="toolbar-actions" id="toolbar-actions">
          <button class="tb-btn" id="btn-remote" data-i18n-title="toolbar.remote" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="6" cy="12" r="2.5"/>
              <circle cx="18" cy="12" r="2.5"/>
              <path d="M8.5 12h7"/>
              <path d="M12 5v2M12 17v2"/>
            </svg>
          </button>
          <button class="tb-btn" id="btn-prompt" data-i18n-title="toolbar.prompt" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8h10"/>
              <path d="M4 12h16"/>
              <path d="M4 16h8"/>
              <path d="M17 15l3 3-3 3"/>
            </svg>
          </button>
          <button class="tb-btn" id="btn-clear" data-i18n-title="toolbar.clear" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M6 7l1 12h10l1-12"/></svg>
          </button>
          <button class="tb-btn" id="btn-copy" data-i18n-title="toolbar.copy" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg>
          </button>
          <button class="tb-btn" id="btn-paste" data-i18n-title="toolbar.paste" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h8v3H8zM9 8h6v12H9z"/></svg>
          </button>
          <span class="tb-sep" aria-hidden="true"></span>
          <button class="tb-btn" id="btn-font-dec" data-i18n-title="toolbar.fontDecrease" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 18 L8 6 L12 18" />
              <path d="M5.5 14 h5" />
              <path d="M15 12 h6" />
            </svg>
          </button>
          <button class="tb-btn" id="btn-font-inc" data-i18n-title="toolbar.fontIncrease" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 18 L8 4 L13 18" />
              <path d="M5 13 h6" />
              <path d="M16 12 h6" />
              <path d="M19 9 v6" />
            </svg>
          </button>
          <div class="tb-menu-wrap">
            <button class="tb-btn" id="btn-font" data-i18n-title="toolbar.fontFamily" type="button" aria-haspopup="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 18 L7 5 L11 18" />
                <path d="M4.6 13 h4.8" />
                <path d="M13 18 L16 9 L19 18" />
                <path d="M14.1 15 h3.8" />
              </svg>
              <span class="tb-font-label" id="font-label"></span>
            </button>
            <div class="tb-menu tb-menu-fonts" id="font-menu" hidden></div>
          </div>
          <button
            class="tb-btn tb-btn-fg"
            id="btn-fg-color"
            data-i18n-title="toolbar.textColor"
            type="button"
            title="Text color"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <!-- Color palette -->
              <path d="M12 3.5c-4.7 0-8.5 3.4-8.5 7.6 0 4.2 3.8 7.6 8.5 7.6.9 0 1.4-.6 1.4-1.3 0-.4-.2-.8-.5-1.1-.4-.4-.6-.9-.6-1.5 0-1.1.9-2 2-2h1.5c2.6 0 4.7-1.9 4.7-4.3C20.5 5.8 16.8 3.5 12 3.5z" />
              <circle cx="8" cy="10" r="1.1" />
              <circle cx="11" cy="7.5" r="1.1" />
              <circle cx="15" cy="7.8" r="1.1" />
              <circle cx="16.8" cy="11.2" r="1.1" />
            </svg>
          </button>
          <input id="fg-color" class="tb-color-input-hidden" type="color" value="#d4d4d4" tabindex="-1" aria-hidden="true" />
          <span class="tb-sep" aria-hidden="true"></span>
          <div class="tb-menu-wrap">
            <button class="tb-btn" id="btn-theme" data-i18n-title="toolbar.theme" type="button" aria-haspopup="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <div class="tb-menu" id="theme-menu" hidden></div>
          </div>
          <div
            class="tb-opacity"
            id="bg-transparency-wrap"
            data-i18n-title="toolbar.transparency"
            title="Transparency"
          >
            <span class="tb-opacity-name" data-i18n="toolbar.transparency">Transparency</span>
            <span class="tb-opacity-bound">0%</span>
            <input
              id="bg-transparency"
              class="tb-opacity-slider"
              type="range"
              min="0"
              max="100"
              step="1"
              value="0"
              aria-valuemin="0"
              aria-valuemax="100"
            />
            <span class="tb-opacity-bound">100%</span>
            <span class="tb-opacity-value" id="bg-transparency-value">0%</span>
          </div>
          <div class="tb-menu-wrap">
            <button class="tb-btn" id="btn-bg-fit" data-i18n-title="toolbar.bgFit" type="button" aria-haspopup="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="4" width="16" height="16" rx="2"/>
                <path d="M4 14h16M10 4v16"/>
              </svg>
              <span class="tb-bg-fit-label" id="bg-fit-label"></span>
            </button>
            <div class="tb-menu" id="bg-fit-menu" hidden></div>
          </div>
          <div class="tb-menu-wrap">
            <button class="tb-btn" id="btn-lang" data-i18n-title="toolbar.language" type="button" aria-haspopup="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
              <span class="tb-lang-label" id="lang-label"></span>
            </button>
            <div class="tb-menu" id="lang-menu" hidden></div>
          </div>
          <button class="tb-btn" id="btn-settings" data-i18n-title="toolbar.settings" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>

        <div class="toolbar-spacer" aria-hidden="true"></div>

        <button class="tb-btn tb-about" id="btn-about" data-i18n-title="toolbar.about" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>
        </button>

        <div class="window-controls" id="window-controls">
          <button class="win-btn" id="btn-min" data-i18n-title="toolbar.minimize" type="button">
            <svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg>
          </button>
          <button class="win-btn" id="btn-max" data-i18n-title="toolbar.maximize" type="button">
            <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="0.5"/></svg>
          </button>
          <button class="win-btn win-close" id="btn-close" data-i18n-title="toolbar.close" type="button">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9"/></svg>
          </button>
        </div>
      </header>

      <div id="tab-bar" class="tab-bar" role="tablist" data-i18n-aria="tabs.session" aria-label="Sessions"></div>

      <main id="terminal-panes" class="terminal-panes" aria-label="Terminal"></main>

      <footer id="status-bar" class="status-bar" role="status" aria-live="polite">
        <span class="status-item" id="status-mode"></span>
        <span class="status-item" id="status-session"></span>
        <span class="status-spacer" aria-hidden="true"></span>
        <span class="status-item" id="status-font"></span>
        <span class="status-item" id="status-size"></span>
      </footer>
    </div>

    <div id="modal-root"></div>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

    <script src="./js/app.bundle.js"></script>
  </body>
</html>
