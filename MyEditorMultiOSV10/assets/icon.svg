<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- My Editor — a thick 3D squircle (extruded, lit from the top-left) with a
       recessed well. A small fan of documents (image · hex · code) and a pencil
       sit in the well. Rasterized by scripts/generate-icons.mjs (sharp). -->
  <defs>
    <linearGradient id="face" x1="0.08" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.22" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="0.82" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.18" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.22" cy="0.14" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sideB" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="well" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#0f172a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="pageSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="woodL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde7d0"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="tileSh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="cardSh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="3" dy="8" stdDeviation="5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="penSh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <clipPath id="faceClip"><rect x="46" y="30" width="396" height="396" rx="92"/></clipPath>
    <clipPath id="imgClip"><rect x="0" y="0" width="108" height="136" rx="12"/></clipPath>
  </defs>

  <!-- ground contact shadow: the tile is sitting in space -->
  <ellipse cx="268" cy="486" rx="176" ry="22" fill="#020617" fill-opacity="0.42" filter="url(#ground)"/>

  <!-- extruded body: darker copies offset down-right = thickness -->
  <rect x="78" y="78" width="396" height="396" rx="92" fill="#020617"/>
  <rect x="70" y="66" width="396" height="396" rx="92" fill="url(#sideB)"/>
  <rect x="58" y="50" width="396" height="396" rx="92" fill="url(#sideR)"/>
  <rect x="52" y="40" width="396" height="396" rx="92" fill="#1d4ed8"/>

  <!-- front face -->
  <g filter="url(#tileSh)">
    <rect x="46" y="30" width="396" height="396" rx="92" fill="url(#face)"/>
  </g>
  <g clip-path="url(#faceClip)">
    <rect x="46" y="30" width="396" height="150" fill="url(#faceTop)"/>
    <rect x="46" y="30" width="396" height="396" fill="url(#spec)"/>
    <ellipse cx="150" cy="70" rx="210" ry="88" fill="#ffffff" fill-opacity="0.22"/>
    <ellipse cx="390" cy="390" rx="200" ry="110" fill="#020617" fill-opacity="0.28"/>
    <!-- well: room for the larger document fan -->
    <rect x="88" y="88" width="312" height="280" rx="52" fill="url(#well)"/>
    <rect x="92" y="92" width="304" height="272" rx="48" fill="none" stroke="#020617" stroke-opacity="0.28" stroke-width="3"/>
    <rect x="90" y="90" width="304" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
  </g>
  <rect x="49" y="33" width="390" height="390" rx="89" fill="none" stroke="url(#bevel)" stroke-width="6"/>
  <rect x="46" y="30" width="396" height="396" rx="92" fill="none" stroke="#020617" stroke-opacity="0.28" stroke-width="2"/>

  <!-- documents: large enough to read as files, still inside the 3D tile -->
  <g transform="translate(256 232) scale(0.96) translate(-256 -232)">
    <!-- image card, back left -->
    <g transform="translate(118 102) rotate(-16)" filter="url(#cardSh)">
      <rect x="7" y="10" width="108" height="136" rx="12" fill="#075985"/>
      <g clip-path="url(#imgClip)">
        <rect x="0" y="0" width="108" height="136" fill="url(#sky)"/>
        <circle cx="78" cy="32" r="15" fill="#fbbf24"/>
        <path d="M0 104 L30 68 L54 94 L74 78 L108 112 L108 136 L0 136 Z" fill="#16a34a"/>
        <path d="M0 116 L22 92 L44 112 L68 96 L108 124 L108 136 L0 136 Z" fill="#15803d"/>
      </g>
      <rect x="0" y="0" width="108" height="136" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3.5"/>
    </g>

    <!-- hex card, back right -->
    <g transform="translate(286 92) rotate(14)" filter="url(#cardSh)">
      <rect x="6" y="10" width="108" height="136" rx="12" fill="#020617"/>
      <rect x="0" y="0" width="108" height="136" rx="12" fill="url(#hex)"/>
      <rect x="0" y="0" width="108" height="136" rx="12" fill="none" stroke="#94a3b8" stroke-opacity="0.7" stroke-width="3"/>
      <g font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#7dd3fc">
        <text x="10" y="34">4D 5A</text>
        <text x="10" y="56" fill="#a5f3fc">00 03</text>
        <text x="10" y="78">FF FE</text>
        <text x="10" y="100" fill="#a5f3fc">89 50</text>
        <text x="10" y="122">0A 1A</text>
      </g>
    </g>

    <!-- code sheet, front -->
    <g transform="translate(168 128)" filter="url(#cardSh)">
      <rect x="8" y="12" width="148" height="186" rx="12" fill="url(#pageSide)"/>
      <path d="M0 14 h98 l40 40 v132 a12 12 0 0 1-12 12 H12 a12 12 0 0 1-12-12 V26 a12 12 0 0 1 12-12z" fill="url(#page)"/>
      <path d="M98 14 v28 a12 12 0 0 0 12 12 h28z" fill="url(#fold)"/>
      <rect x="0" y="14" width="138" height="184" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2"/>
      <rect x="18" y="72" width="36" height="10" rx="5" fill="#7c3aed"/>
      <rect x="58" y="72" width="56" height="10" rx="5" fill="#94a3b8"/>
      <rect x="28" y="94" width="50" height="10" rx="5" fill="#15803d"/>
      <rect x="82" y="94" width="30" height="10" rx="5" fill="#94a3b8"/>
      <rect x="28" y="116" width="32" height="10" rx="5" fill="#c2410c"/>
      <rect x="64" y="116" width="52" height="10" rx="5" fill="#1d4ed8"/>
      <rect x="18" y="138" width="72" height="10" rx="5" fill="#94a3b8"/>
      <rect x="72" y="156" width="8" height="20" rx="2" fill="#0ea5e9"/>
    </g>
  </g>

  <!-- pencil: a short 3D cylinder (wood + highlight + dark side) -->
  <g transform="translate(322 292) rotate(42) scale(0.92)" filter="url(#penSh)">
    <rect x="-11" y="-6" width="26" height="96" rx="5" fill="#78350f"/>
    <rect x="-13" y="-8" width="26" height="96" rx="5" fill="url(#woodL)"/>
    <rect x="-13" y="-8" width="26" height="16" rx="5" fill="url(#eraser)"/>
    <rect x="-13" y="7" width="26" height="5" fill="url(#ferrule)"/>
    <rect x="-13" y="74" width="26" height="14" fill="url(#ferrule)"/>
    <path d="M-13 88h26l-13 26z" fill="url(#tip)"/>
    <path d="M-5 106h10l-5 10z" fill="#1f2937"/>
    <rect x="-9" y="14" width="5" height="58" rx="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="6" y="16" width="4" height="54" rx="2" fill="#000000" fill-opacity="0.18"/>
  </g>
</svg>
