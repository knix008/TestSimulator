<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- My Editor — a glossy 3D tile: lit from the top-left (radial highlight + bevel), a raised page with a folded
       corner and coloured code lines, a shaded pencil. Rasterized by scripts/generate-icons.mjs (sharp). -->
  <defs>
    <!-- tile: deep blue at the bottom-right, lighter where the light hits -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.45" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f2a6e"/>
    </linearGradient>
    <!-- the light source: a soft white glow in the top-left corner -->
    <radialGradient id="light" cx="0.22" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- glass reflection across the upper half of the tile -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- bevel: bright edge top-left, dark edge bottom-right -->
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#cfd8e3"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- the pencil is a cylinder: light on the left, dark on the right -->
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde7d0"/>
      <stop offset="1" stop-color="#d4a373"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="12" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="tileClip"><rect x="24" y="20" width="464" height="464" rx="100"/></clipPath>
  </defs>

  <!-- the tile, its depth and its lighting -->
  <rect x="24" y="20" width="464" height="464" rx="100" fill="url(#bg)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="24" y="20" width="464" height="464" fill="url(#light)"/>
    <!-- the reflection: a wide ellipse pushed to the top-left, cut by the tile -->
    <ellipse cx="180" cy="60" rx="300" ry="150" fill="url(#gloss)"/>
    <!-- a darker floor in the bottom-right for depth -->
    <ellipse cx="420" cy="470" rx="260" ry="120" fill="#000" fill-opacity="0.18"/>
  </g>
  <rect x="27" y="23" width="458" height="458" rx="97" fill="none" stroke="url(#bevel)" stroke-width="5"/>
  <rect x="24" y="20" width="464" height="464" rx="100" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="2"/>

  <!-- page with a folded corner, raised above the tile -->
  <g filter="url(#shadow)">
    <path d="M132 84h176l88 88v256a20 20 0 0 1-20 20H132a20 20 0 0 1-20-20V104a20 20 0 0 1 20-20z" fill="url(#page)"/>
    <path d="M308 84v68a20 20 0 0 0 20 20h68z" fill="url(#fold)"/>
    <path d="M308 84v68a20 20 0 0 0 20 20h68" fill="none" stroke="#64748b" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <path d="M132 84h176l88 88v256a20 20 0 0 1-20 20H132a20 20 0 0 1-20-20V104a20 20 0 0 1 20-20z" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>

  <!-- code / text lines -->
  <rect x="156" y="200" width="60" height="18" rx="9" fill="#7c3aed"/>
  <rect x="226" y="200" width="110" height="18" rx="9" fill="#94a3b8"/>
  <rect x="176" y="240" width="90" height="18" rx="9" fill="#15803d"/>
  <rect x="276" y="240" width="40" height="18" rx="9" fill="#94a3b8"/>
  <rect x="176" y="280" width="50" height="18" rx="9" fill="#c2410c"/>
  <rect x="236" y="280" width="120" height="18" rx="9" fill="#94a3b8"/>
  <rect x="156" y="320" width="130" height="18" rx="9" fill="#1d4ed8"/>
  <rect x="156" y="360" width="80" height="18" rx="9" fill="#94a3b8"/>

  <!-- text cursor -->
  <rect x="248" y="352" width="10" height="36" rx="3" fill="#0ea5e9"/>

  <!-- pencil: a shaded cylinder with its own shadow on the page -->
  <g transform="translate(300 300) rotate(45)" filter="url(#softShadow)">
    <rect x="-22" y="-10" width="44" height="150" rx="6" fill="url(#wood)"/>
    <rect x="-22" y="-10" width="44" height="26" rx="6" fill="url(#eraser)"/>
    <rect x="-22" y="14" width="44" height="8" fill="url(#ferrule)"/>
    <rect x="-22" y="118" width="44" height="22" fill="url(#ferrule)"/>
    <path d="M-22 140h44l-22 40z" fill="url(#tip)"/>
    <path d="M-8 166h16l-8 14z" fill="#1f2937"/>
    <!-- the highlight line along the pencil -->
    <rect x="-16" y="24" width="8" height="92" rx="4" fill="#ffffff" fill-opacity="0.45"/>
  </g>
</svg>
