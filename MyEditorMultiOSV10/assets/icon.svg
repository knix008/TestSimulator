<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- My Editor — a glossy 3D tile (lit from the top-left) holding a fan of documents: an image, a binary
       (hex) dump and, in front, a code / text sheet — everything the editor shows — with the pencil.
       Rasterized by scripts/generate-icons.mjs (sharp). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.45" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f2a6e"/>
    </linearGradient>
    <radialGradient id="light" cx="0.22" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#cfd8e3"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- the image card: a sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <!-- the binary card: dark, with a faint sheen -->
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde7d0"/>
      <stop offset="1" stop-color="#d4a373"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="12" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="tileClip"><rect x="24" y="20" width="464" height="464" rx="100"/></clipPath>
    <clipPath id="imgClip"><rect x="0" y="0" width="150" height="190" rx="14"/></clipPath>
  </defs>

  <!-- the tile, its depth and its lighting -->
  <rect x="24" y="20" width="464" height="464" rx="100" fill="url(#bg)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="24" y="20" width="464" height="464" fill="url(#light)"/>
    <ellipse cx="180" cy="60" rx="300" ry="150" fill="url(#gloss)"/>
    <ellipse cx="420" cy="470" rx="260" ry="120" fill="#000" fill-opacity="0.18"/>
  </g>
  <rect x="27" y="23" width="458" height="458" rx="97" fill="none" stroke="url(#bevel)" stroke-width="5"/>
  <rect x="24" y="20" width="464" height="464" rx="100" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="2"/>

  <!-- back left: an image (sky, sun, hills) — tilted a little -->
  <g transform="translate(84 104) rotate(-12)" filter="url(#shadow)">
    <g clip-path="url(#imgClip)">
      <rect x="0" y="0" width="150" height="190" fill="url(#sky)"/>
      <circle cx="108" cy="46" r="20" fill="#fbbf24"/>
      <path d="M0 150 L42 96 L78 138 L104 112 L150 160 L150 190 L0 190 Z" fill="#16a34a"/>
      <path d="M0 165 L30 132 L64 162 L94 140 L150 176 L150 190 L0 190 Z" fill="#15803d"/>
    </g>
    <rect x="0" y="0" width="150" height="190" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4"/>
  </g>

  <!-- back right: binary data (a hex dump) — tilted the other way -->
  <g transform="translate(292 92) rotate(11)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="190" rx="14" fill="url(#hex)"/>
    <rect x="0" y="0" width="150" height="190" rx="14" fill="none" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="3"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700" fill="#7dd3fc">
      <text x="14" y="42">4D 5A 90</text>
      <text x="14" y="72" fill="#a5f3fc">00 03 00</text>
      <text x="14" y="102">FF FE 0D</text>
      <text x="14" y="132" fill="#a5f3fc">0A 1A 0A</text>
      <text x="14" y="162">89 50 4E</text>
    </g>
  </g>

  <!-- front: the code / text sheet with a folded corner (scaled to 0.82, so the cards behind it show) -->
  <g transform="translate(58 78) scale(0.82)">
    <g filter="url(#shadow)">
      <path d="M144 150h150l74 74v200a20 20 0 0 1-20 20H144a20 20 0 0 1-20-20V170a20 20 0 0 1 20-20z" fill="url(#page)"/>
      <path d="M294 150v54a20 20 0 0 0 20 20h54z" fill="url(#fold)"/>
    </g>
    <path d="M144 150h150l74 74v200a20 20 0 0 1-20 20H144a20 20 0 0 1-20-20V170a20 20 0 0 1 20-20z" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.4"/>
    <!-- code lines: a keyword, a string, a tag … and an ordinary text line -->
    <rect x="160" y="248" width="52" height="16" rx="8" fill="#7c3aed"/>
    <rect x="220" y="248" width="86" height="16" rx="8" fill="#94a3b8"/>
    <rect x="178" y="282" width="78" height="16" rx="8" fill="#15803d"/>
    <rect x="264" y="282" width="44" height="16" rx="8" fill="#94a3b8"/>
    <rect x="178" y="316" width="48" height="16" rx="8" fill="#c2410c"/>
    <rect x="234" y="316" width="96" height="16" rx="8" fill="#1d4ed8"/>
    <rect x="160" y="350" width="112" height="16" rx="8" fill="#94a3b8"/>
    <rect x="160" y="384" width="70" height="16" rx="8" fill="#94a3b8"/>
    <!-- text cursor -->
    <rect x="240" y="378" width="9" height="30" rx="3" fill="#0ea5e9"/>
  </g>

  <!-- pencil: a shaded cylinder with its own shadow on the sheet -->
  <g transform="translate(318 292) rotate(45)" filter="url(#softShadow)">
    <rect x="-22" y="-10" width="44" height="150" rx="6" fill="url(#wood)"/>
    <rect x="-22" y="-10" width="44" height="26" rx="6" fill="url(#eraser)"/>
    <rect x="-22" y="14" width="44" height="8" fill="url(#ferrule)"/>
    <rect x="-22" y="118" width="44" height="22" fill="url(#ferrule)"/>
    <path d="M-22 140h44l-22 40z" fill="url(#tip)"/>
    <path d="M-8 166h16l-8 14z" fill="#1f2937"/>
    <rect x="-16" y="24" width="8" height="92" rx="4" fill="#ffffff" fill-opacity="0.45"/>
  </g>
</svg>
