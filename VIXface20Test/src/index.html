<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src *;" />
  <title>VixReader Test</title>
  <link rel="icon" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <img id="logo" class="logo" src="assets/icon.png" alt="logo" />
    <div class="brand">
      <h1 id="appTitle">VixReader Test</h1>
      <p id="appSubtitle" class="muted"></p>
    </div>
    <div class="conn-panel">
      <div class="conn-row">
        <label class="radio"><input type="radio" name="iface" value="ethernet" checked /> Ethernet (HTTPS)</label>
        <label class="radio"><input type="radio" name="iface" value="serial" disabled /> Serial</label>
        <label class="ip">IP 주소
          <input id="ip" type="text" value="192.168.0.2" />
        </label>
        <label class="ip">포트
          <input id="port" type="number" value="8443" class="port" />
        </label>
        <button id="connectBtn" class="btn connect">연결...</button>
      </div>
      <div class="conn-row">
        <label class="ip">장치 타입
          <select id="deviceType"></select>
        </label>
        <label class="ip">경로
          <input id="path" type="text" value="/at" class="path" />
        </label>
        <button id="reportBtn" class="btn ghost">보고서 생성</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="commands">
      <div id="groups"></div>

      <fieldset class="group ledcolor" id="ledColorGroup">
        <legend id="ledColorTitle">LED 색상 테스트</legend>
        <div id="ledChannels" class="led-channels"></div>
        <button id="ledColorSet" class="btn led-set">설정</button>
      </fieldset>
    </section>

    <aside class="status">
      <div id="resultBox" class="result ready">
        <span id="resultText">준비</span>
      </div>
      <div class="status-meta">
        <div>대상: <code id="metaTarget">-</code></div>
        <div>세션: <code id="metaSession">-</code></div>
      </div>
    </aside>
  </main>

  <section class="logwrap">
    <div class="logbar">
      <strong>로그</strong>
      <button id="clearLog" class="btn tiny ghost">지우기</button>
    </div>
    <pre id="log" class="log"></pre>
  </section>

  <!-- Report date-range modal -->
  <div id="reportModal" class="modal hidden">
    <div class="modal-card">
      <h2>보고서(CSV) 생성</h2>
      <p class="muted">날짜 범위를 지정하세요. 비워두면 전체가 내보내집니다.</p>
      <label>시작일 <input id="startDate" type="date" /></label>
      <label>종료일 <input id="endDate" type="date" /></label>
      <div class="modal-actions">
        <button id="reportCancel" class="btn ghost">취소</button>
        <button id="reportConfirm" class="btn connect">내보내기</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
