<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyMerge 10.0</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="style/styles.css">
</head>
<body>
  <div id="shell">
    <div id="bgLayer"></div>
    <div id="app">
      <nav id="menubar" class="menubar"></nav>
      <div id="toolbar" class="toolbar" role="toolbar"></div>
      <div class="body">
        <aside id="leftPanel" class="panel left"></aside>
        <div class="splitter v" id="splitLeft" role="separator" aria-orientation="vertical" tabindex="-1"></div>
        <div class="center">
          <div class="tabbar">
            <button id="tabPrev" class="tabnav" type="button">&lt;</button>
            <div id="tabstrip" class="tabstrip"></div>
            <button id="tabNext" class="tabnav" type="button">&gt;</button>
          </div>
          <div class="sources">
            <section class="pane base" id="paneBase"><div class="pane-head"></div><div class="code-view"><div class="code-lines"></div></div></section>
            <div class="splitter v" id="splitPaneA" role="separator" aria-orientation="vertical" tabindex="-1"></div>
            <section class="pane local" id="paneLocal"><div class="pane-head"></div><div class="code-view"><div class="code-lines"></div></div></section>
            <div class="splitter v" id="splitPaneB" role="separator" aria-orientation="vertical" tabindex="-1"></div>
            <section class="pane remote" id="paneRemote"><div class="pane-head"></div><div class="code-view"><div class="code-lines"></div></div></section>
          </div>
          <div class="splitter h" id="splitResult" role="separator" aria-orientation="horizontal" tabindex="-1"></div>
          <section class="result-wrap">
            <div class="pane-head" id="resultHead"></div>
            <div class="result-body">
              <div class="result-gutter" id="resultGutter" aria-hidden="true"></div>
              <div class="result-canvas">
                <div class="result-stripes" id="resultStripes" aria-hidden="true"></div>
                <textarea id="resultText" spellcheck="false"></textarea>
              </div>
            </div>
          </section>
        </div>
        <div class="splitter v" id="splitRight" role="separator" aria-orientation="vertical" tabindex="-1"></div>
        <aside id="rightPanel" class="panel right"></aside>
      </div>
      <footer id="statusbar" class="statusbar"></footer>
      <div id="resizeGrip" title="창 크기 변경" role="separator">
        <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
          <path d="M10 2 L2 10 M10 6 L6 10 M10 9.5 L9.5 10" />
        </svg>
      </div>
    </div>
  </div>
  <div id="menuLayer"></div>
  <div id="popupLayer"></div>
  <input id="fileOpen" type="file" multiple hidden>
  <input id="bgOpen" type="file" accept="image/*" hidden>
  <iframe id="printFrame" title="print"></iframe>
  <script src="src/build-info.js"></script>
  <script src="src/metrics.js"></script>
  <script src="src/merge.js"></script>
  <script src="src/session.js"></script>
  <script src="src/fonts.js"></script>
  <script src="src/gitplan.js"></script>
  <script src="src/print.js"></script>
  <script src="src/themes.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/icons.js"></script>
  <script src="src/store.js"></script>
  <script src="src/sample.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
