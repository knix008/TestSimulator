<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>

  <!-- server rack (left) -->
  <g filter="url(#shadow)">
    <rect x="64" y="120" width="150" height="272" rx="22" fill="#0f172a" fill-opacity="0.85"/>
    <rect x="84" y="146" width="110" height="60" rx="10" fill="#e2e8f0"/>
    <rect x="84" y="226" width="110" height="60" rx="10" fill="#e2e8f0"/>
    <rect x="84" y="306" width="110" height="60" rx="10" fill="#e2e8f0"/>
    <circle cx="106" cy="176" r="9" fill="#22c55e"/>
    <circle cx="106" cy="256" r="9" fill="#22c55e"/>
    <circle cx="106" cy="336" r="9" fill="#f59e0b"/>
    <rect x="126" y="170" width="52" height="12" rx="6" fill="#94a3b8"/>
    <rect x="126" y="250" width="52" height="12" rx="6" fill="#94a3b8"/>
    <rect x="126" y="330" width="52" height="12" rx="6" fill="#94a3b8"/>
  </g>

  <!-- transfer arrows (right) -->
  <g filter="url(#shadow)">
    <!-- upload: left → right (local to server) drawn as an up arrow -->
    <path d="M330 118 L412 200 L366 200 L366 262 L294 262 L294 200 L248 200 Z" fill="url(#up)"/>
    <!-- download: down arrow -->
    <path d="M330 394 L248 312 L294 312 L294 250 L366 250 L366 312 L412 312 Z" fill="url(#down)" transform="translate(0 30)"/>
  </g>
</svg>
