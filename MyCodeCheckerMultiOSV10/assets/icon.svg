<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- background tile: depth, body, gloss, bevel -->
    <linearGradient id="bgBody" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2f6fd0"/>
      <stop offset="0.55" stop-color="#1c3f86"/>
      <stop offset="1" stop-color="#0c1d45"/>
    </linearGradient>
    <linearGradient id="bgSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1736"/>
      <stop offset="1" stop-color="#050b1c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc7ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5b8fe0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#7fb6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fb6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="26" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="10" dy="18" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- code sheet -->
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e1f0"/>
    </linearGradient>
    <linearGradient id="paperEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb2cc"/>
      <stop offset="1" stop-color="#5d6f8a"/>
    </linearGradient>

    <!-- magnifier -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.35" stop-color="#b7c4d6"/>
      <stop offset="0.6" stop-color="#6c7d96"/>
      <stop offset="0.85" stop-color="#d9e3f0"/>
      <stop offset="1" stop-color="#8496b0"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e6f6ff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#7cc4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2a7fd4" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4b63"/>
      <stop offset="0.45" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <linearGradient id="handleHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="598" cy="598" r="148"/></clipPath>

    <!-- check badge -->
    <radialGradient id="okBall" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#9df5b8"/>
      <stop offset="0.45" stop-color="#2fc46a"/>
      <stop offset="1" stop-color="#127a3d"/>
    </radialGradient>
    <radialGradient id="bugBall" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb3a8"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#8f1717"/>
    </radialGradient>
  </defs>

  <!-- tile with thickness -->
  <g filter="url(#drop)">
    <rect x="72" y="92" width="880" height="880" rx="210" fill="url(#bgSide)"/>
    <rect x="72" y="60" width="880" height="880" rx="210" fill="url(#bgBody)"/>
    <rect x="72" y="60" width="880" height="880" rx="210" fill="url(#glow)"/>
    <rect x="86" y="74" width="852" height="852" rx="198" fill="none" stroke="url(#bevel)" stroke-width="14"/>
    <path d="M150 260 C150 160 210 112 330 112 H694 C814 112 874 160 874 260 V330 C700 270 380 270 150 380 Z" fill="url(#gloss)" opacity="0.55"/>
  </g>

  <!-- code sheet: edge, face, lines -->
  <g filter="url(#soft)">
    <rect x="236" y="214" width="430" height="560" rx="44" fill="url(#paperEdge)"/>
    <rect x="216" y="194" width="430" height="560" rx="44" fill="url(#paper)"/>
    <rect x="216" y="194" width="430" height="74" rx="44" fill="#e4ecf7"/>
    <rect x="216" y="240" width="430" height="28" fill="#e4ecf7"/>
    <circle cx="262" cy="232" r="11" fill="#ff6b6b"/>
    <circle cx="296" cy="232" r="11" fill="#ffc94d"/>
    <circle cx="330" cy="232" r="11" fill="#4cd07d"/>
  </g>
  <g stroke-linecap="round" stroke-width="22">
    <path d="M262 316 H352" stroke="#3b82f6"/>
    <path d="M376 316 H520" stroke="#94a3b8"/>
    <path d="M298 370 H404" stroke="#a855f7"/>
    <path d="M428 370 H580" stroke="#22a06b"/>
    <path d="M298 424 H470" stroke="#94a3b8"/>
    <path d="M262 586 H330" stroke="#3b82f6"/>
    <path d="M298 640 H420" stroke="#94a3b8"/>
    <path d="M262 694 H360" stroke="#94a3b8"/>
  </g>
  <!-- the faulty line -->
  <rect x="236" y="452" width="390" height="72" rx="18" fill="#ef4444" opacity="0.16"/>
  <path d="M298 488 H452" stroke="#ef4444" stroke-width="22" stroke-linecap="round"/>
  <path d="M296 520 q12 -12 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>

  <!-- magnifier: magnified code inside the lens -->
  <g clip-path="url(#lensClip)">
    <rect x="440" y="440" width="320" height="320" fill="#f3f7fd"/>
    <rect x="440" y="510" width="320" height="110" fill="#ef4444" opacity="0.18"/>
    <path d="M470 566 H700" stroke="#ef4444" stroke-width="34" stroke-linecap="round"/>
    <path d="M470 612 q18 -18 36 0 t36 0 t36 0 t36 0 t36 0 t36 0" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
    <path d="M470 478 H600" stroke="#22a06b" stroke-width="34" stroke-linecap="round"/>
    <path d="M520 690 H690" stroke="#94a3b8" stroke-width="34" stroke-linecap="round"/>
    <!-- bug -->
    <g transform="translate(660 520)">
      <ellipse cx="0" cy="18" rx="30" ry="38" fill="url(#bugBall)"/>
      <circle cx="0" cy="-22" r="18" fill="#7f1d1d"/>
      <path d="M-30 4 h-22 M30 4 h22 M-28 30 l-22 12 M28 30 l22 12 M-24 -6 l-20 -16 M24 -6 l20 -16" stroke="#7f1d1d" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 -14 V54" stroke="#7f1d1d" stroke-width="5"/>
      <ellipse cx="-10" cy="4" rx="9" ry="14" fill="#ffffff" opacity="0.45"/>
    </g>
  </g>
  <g filter="url(#soft)">
    <!-- handle -->
    <g transform="rotate(45 598 598)">
      <rect x="566" y="770" width="64" height="40" rx="10" fill="url(#metal)"/>
      <rect x="560" y="804" width="76" height="190" rx="36" fill="url(#handle)"/>
      <rect x="560" y="804" width="76" height="190" rx="36" fill="url(#handleHi)"/>
    </g>
    <!-- ring -->
    <circle cx="598" cy="598" r="148" fill="url(#lens)"/>
    <circle cx="598" cy="598" r="170" fill="none" stroke="url(#metal)" stroke-width="44"/>
    <circle cx="598" cy="598" r="192" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
    <circle cx="598" cy="598" r="149" fill="none" stroke="#1d3150" stroke-opacity="0.5" stroke-width="6"/>
  </g>
  <path d="M500 520 A120 120 0 0 1 600 470" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="18" stroke-linecap="round"/>
  <path d="M488 572 A118 118 0 0 1 494 552" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="14" stroke-linecap="round"/>

  <!-- check badge -->
  <g filter="url(#soft)">
    <circle cx="688" cy="248" r="92" fill="url(#okBall)"/>
    <circle cx="688" cy="248" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6"/>
    <path d="M640 252 l32 32 l62 -70" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="660" cy="200" rx="40" ry="20" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
