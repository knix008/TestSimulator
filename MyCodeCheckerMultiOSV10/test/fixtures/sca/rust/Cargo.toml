[package]
name = "crawler"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
regex = "1.5.4"
serde = { version = "1.0", features = ["derive"] }
smallvec = "=1.6.0"
local-helper = { path = "../helper" }

[dev-dependencies]
tempdir = "0.3"

[target.'cfg(windows)'.dependencies]
winapi = "*"
