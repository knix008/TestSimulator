appId: com.mydiff.multi
productName: MyDiff
copyright: Copyright © 2026 Suho Kwon

directories:
  output: release
  buildResources: build

# The packaged app is the built UI, the bundled server and the Electron shell —
# node_modules is bundled into dist-server/ by scripts/bundle-server.mjs.
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - package.json
  # express and React are already inside dist-server/ and dist/, so the dependency
  # tree would only be dead weight in the installer.
  - "!node_modules/**/*"

extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png

asar: true
npmRebuild: false

win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MyDiff
  runAfterFinish: true
  # User data is removed only when the user says so — build/installer.nsh asks.
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages:
    - ko_KR
    - en_US
  multiLanguageInstaller: true
  displayLanguageSelector: true

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  title: ${productName} ${version}

linux:
  icon: build/icons
  category: Development
  synopsis: Two-way file, directory and git diff viewer
  description: |
    MyDiff compares two files or directories side by side, highlights added,
    removed and modified lines, and can browse a git repository's changes.
    It can also be registered as a git difftool.
  maintainer: Suho Kwon <suho.kwon@gmail.com>
  desktop:
    entry:
      Name: MyDiff
      Comment: Two-way file, directory and git diff viewer
      Categories: Development;Utility;
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64, arm64]
