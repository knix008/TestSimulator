appId: com.aveditor.app
productName: AV Editor
copyright: Copyright © 2024 AV Editor

directories:
  output: dist
  buildResources: assets

files:
  - src/**/*
  - assets/**/*
  - package.json

# WASM cannot run reliably from inside asar
asarUnpack:
  - "**/vendor/transformers/**/*.wasm"

# Default icon stem (platform-specific overrides below)
icon: assets/icons/icon

# Avoid winCodeSign (symlink privilege errors on Windows without Developer Mode)
afterPack: scripts/after-pack.js

# ── Windows ──────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/icon.ico
  publisherName: AV Editor
  signAndEditExecutable: false


nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AV Editor
  runAfterFinish: true
  deleteAppDataOnUninstall: true
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  include: build/installer.nsh

# ── macOS ─────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icons/icon.icns
  category: public.app-category.video
  darkModeSupport: true
  hardenedRuntime: false

dmg:
  title: AV Editor ${version}
  iconSize: 80
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Linux ─────────────────────────────────────────────────
# Icon dir must contain 16x16.png, 32x32.png, ... (not a single icon.png),
# otherwise AppImage may resolve size as 0x0 and fail symlink creation.
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  icon: assets/icons/linux
  category: AudioVideo
  description: Professional Audio & Video Editor
  synopsis: Professional Audio & Video Editor
  maintainer: SHKWON <knix008@naver.com>

appImage:
  artifactName: ${productName}-${version}.${ext}

deb:
  artifactName: ${productName}-${version}.${ext}
