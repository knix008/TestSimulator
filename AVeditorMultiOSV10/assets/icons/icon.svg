<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Blue background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="45%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Top-left gloss effect (elliptical highlight) -->
    <radialGradient id="glossGrad" cx="32%" cy="22%" r="52%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="white" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="white" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Circle fill gradient -->
    <radialGradient id="circleGrad" cx="38%" cy="32%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>

    <!-- Subtle inner shadow / depth on circle -->
    <radialGradient id="circleShadow" cx="60%" cy="68%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0C1A4A" flood-opacity="0.45"/>
    </filter>

    <!-- Soft inner glow on gloss -->
    <filter id="blurGloss" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Clip path for rounded rect -->
    <clipPath id="bgClip">
      <rect width="256" height="256" rx="52" ry="52"/>
    </clipPath>
  </defs>

  <!-- ── Background ───────────────────────────────────────── -->
  <rect width="256" height="256" rx="52" ry="52" fill="url(#bgGrad)"/>

  <!-- ── Gloss overlay (top-left, elliptical) ─────────────── -->
  <!-- Outer glow layer (blurred) -->
  <ellipse cx="88" cy="72" rx="105" ry="70" fill="white" opacity="0.12" clip-path="url(#bgClip)" filter="url(#blurGloss)"/>
  <!-- Sharp highlight -->
  <ellipse cx="82" cy="66" rx="86" ry="58" fill="url(#glossGrad)" clip-path="url(#bgClip)"/>

  <!-- ── Film strip top ─────────────────────────────────────── -->
  <rect x="0" y="18" width="256" height="40" fill="rgba(0,0,0,0.30)" clip-path="url(#bgClip)"/>
  <rect x="12"  y="24" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="46"  y="24" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="80"  y="24" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="152" y="24" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="186" y="24" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="220" y="24" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>

  <!-- ── Film strip bottom ──────────────────────────────────── -->
  <rect x="0" y="198" width="256" height="40" fill="rgba(0,0,0,0.30)" clip-path="url(#bgClip)"/>
  <rect x="12"  y="204" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="46"  y="204" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="80"  y="204" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="152" y="204" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="186" y="204" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <rect x="220" y="204" width="22" height="22" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>

  <!-- ── Center circle (play button) ───────────────────────── -->
  <circle cx="128" cy="116" r="60" fill="url(#circleGrad)" filter="url(#shadow)"/>
  <circle cx="128" cy="116" r="60" fill="url(#circleShadow)"/>
  <!-- Circle rim highlight -->
  <circle cx="128" cy="116" r="58" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
  <!-- Inner circle gloss (top-left of circle) -->
  <ellipse cx="111" cy="99" rx="28" ry="18" fill="white" opacity="0.22" transform="rotate(-20,111,99)"/>

  <!-- Play triangle (visually centered inside circle) -->
  <polygon points="117,93 117,139 161,116" fill="white" opacity="0.97"/>
  <!-- Slight shadow on triangle -->
  <polygon points="117,93 117,139 161,116" fill="rgba(30,58,138,0.18)"/>
  <polygon points="117,93 117,139 161,116" fill="white" opacity="0.97"/>

  <!-- ── Audio waveform (bottom strip area) ─────────────────── -->
  <g fill="rgba(255,255,255,0.70)">
    <rect x="30"  y="207" width="8" height="14" rx="4"/>
    <rect x="46"  y="203" width="8" height="22" rx="4"/>
    <rect x="62"  y="207" width="8" height="14" rx="4"/>
    <rect x="78"  y="204" width="8" height="18" rx="4"/>
    <rect x="94"  y="208" width="8" height="10" rx="4"/>
    <rect x="154" y="205" width="8" height="16" rx="4"/>
    <rect x="170" y="202" width="8" height="22" rx="4"/>
    <rect x="186" y="205" width="8" height="18" rx="4"/>
    <rect x="202" y="207" width="8" height="14" rx="4"/>
    <rect x="218" y="203" width="8" height="20" rx="4"/>
  </g>

  <!-- ── "AV" label (subtle, below circle) ─────────────────── -->
  <text x="128" y="182" font-family="-apple-system, 'Segoe UI', sans-serif"
        font-size="13" font-weight="800" text-anchor="middle"
        fill="rgba(255,255,255,0.38)" letter-spacing="5">AV</text>

  <!-- ── Overall rounded rect border for polish ─────────────── -->
  <rect width="256" height="256" rx="52" ry="52"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
</svg>
