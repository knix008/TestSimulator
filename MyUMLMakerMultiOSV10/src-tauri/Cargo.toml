[package]
name = "myumlmaker"
version = "1.0.0"
description = "Cross-platform UML modelling (StarUML style)"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "myumlmaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
arboard = { version = "3.6", default-features = false }
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Projects in a database (Settings › Database): SQLite, MariaDB/MySQL, PostgreSQL through sqlx;
# Microsoft SQL Server through tiberius (sqlx 0.8 has no MSSQL driver) on a tokio TCP stream.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "mysql", "postgres", "sqlite"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio = { version = "1", features = ["net"] }

[dev-dependencies]
tempfile = "3"
# Starts a throw-away PostgreSQL server for the database tests (downloaded once, then cached).
postgresql_embedded = { version = "0.21", features = ["tokio"] }

[[test]]
name = "db_integration"
path = "../test/db_integration.rs"

# Installed app: smaller and faster (whole-program optimisation, no debug symbols). Debug builds and tests are unaffected.
[profile.release]
lto = true
codegen-units = 1
strip = true
