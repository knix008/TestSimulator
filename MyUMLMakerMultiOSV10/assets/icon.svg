<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MyUMLMaker app icon: a raised 3D tile with a UML class diagram — a
       superclass, two subclasses joined to it by generalization arrows.
       The tile sits in the exact centre (112…912 both ways); the border is
       transparent; the top-left corner glows. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0d0"/>
      <stop offset="0.5" stop-color="#1f9e9a"/>
      <stop offset="1" stop-color="#0d4f6b"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3f55"/>
      <stop offset="1" stop-color="#062634"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#022630" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#eafff9" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f4a21a"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6f1ff"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fa3"/><stop offset="1" stop-color="#ef476f"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe9ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="barShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#032a33" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ffffff"/>
    </marker>
    <clipPath id="faceClip"><rect x="112" y="112" width="800" height="760" rx="170"/></clipPath>
  </defs>

  <!-- soft shadow on the ground (inside the transparent border) -->
  <ellipse cx="512" cy="948" rx="370" ry="32" fill="#03222b" opacity="0.45" filter="url(#shadow)"/>
  <!-- extruded side: the tile's thickness (tile spans y 112…912, centred) -->
  <rect x="112" y="152" width="800" height="760" rx="170" fill="url(#side)"/>
  <!-- face -->
  <rect x="112" y="112" width="800" height="760" rx="170" fill="url(#face)"/>
  <g clip-path="url(#faceClip)">
    <!-- drawing sheet with a faint grid -->
    <rect x="190" y="200" width="644" height="600" rx="44" fill="url(#sheet)"/>
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="4">
      <path d="M318 200v600M446 200v600M574 200v600M702 200v600M190 320h644M190 440h644M190 560h644M190 680h644"/>
    </g>
    <!-- generalization lines and the hollow triangle -->
    <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M326 600v-74h372v74M512 526v-44"/>
    </g>
    <path d="M512 418l-44 66h88z" fill="#1f9e9a" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    <g filter="url(#barShadow)">
      <!-- superclass: name, attributes, operations -->
      <rect x="372" y="210" width="280" height="208" rx="16" fill="url(#barB)"/>
      <!-- subclasses -->
      <rect x="216" y="600" width="220" height="150" rx="16" fill="url(#barA)"/>
      <rect x="588" y="600" width="220" height="150" rx="16" fill="url(#barC)"/>
    </g>
    <g fill="none" stroke="#0d4f6b" stroke-width="8" opacity="0.7">
      <path d="M372 282h280M372 350h280M216 662h220M588 662h220"/>
    </g>
    <g fill="#0d4f6b" opacity="0.6">
      <rect x="452" y="232" width="120" height="26" rx="13"/>
      <rect x="400" y="300" width="150" height="16" rx="8"/><rect x="400" y="370" width="190" height="16" rx="8"/><rect x="400" y="392" width="120" height="14" rx="7"/>
      <rect x="266" y="620" width="120" height="22" rx="11"/><rect x="244" y="684" width="130" height="14" rx="7"/><rect x="244" y="708" width="96" height="14" rx="7"/>
    </g>
    <g fill="#ffffff" opacity="0.92"><rect x="638" y="620" width="120" height="22" rx="11"/><rect x="616" y="684" width="130" height="14" rx="7"/><rect x="616" y="708" width="96" height="14" rx="7"/></g>
    <!-- glossy top half and the top-left glow -->
    <path d="M112 112h800v300C700 345 400 345 112 455z" fill="url(#gloss)" opacity="0.6"/>
    <rect x="112" y="112" width="800" height="760" fill="url(#glow)"/>
  </g>
  <!-- bevel rim: light top-left, dark bottom-right -->
  <rect x="120" y="120" width="784" height="744" rx="163" fill="none" stroke="url(#bevel)" stroke-width="16"/>
  <!-- sparkle at the top-left corner -->
  <circle cx="232" cy="214" r="70" fill="url(#spark)" opacity="0.9"/>
  <path d="M232 142l12 60 60 12-60 12-12 60-12-60-60-12 60-12z" fill="#ffffff"/>
</svg>
