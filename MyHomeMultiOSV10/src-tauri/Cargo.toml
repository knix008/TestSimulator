[package]
name = "myhomemaker"
version = "1.0.0"
description = "Graphical website builder"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "myhomemaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
arboard = { version = "3.6", default-features = false }
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Bulletin boards in a database (Settings › Database): SQLite, MariaDB/MySQL, PostgreSQL through sqlx;
# Microsoft SQL Server through tiberius (sqlx 0.8 has no MSSQL driver) on a tokio TCP stream.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "mysql", "postgres", "sqlite"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio = { version = "1", features = ["net", "time"] }

# Printing straight to a printer (the same versions as Tauri's own WebView2).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

# Installed app: smaller and faster (whole-program optimisation, no debug symbols). Debug builds and tests are unaffected.
[profile.release]
lto = true
codegen-units = 1
strip = true
