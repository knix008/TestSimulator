[package]
name = "myimageviewer"
version = "1.0.2"
description = "MyImageViewer"
authors = ["SHKWON"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Win32 handle of the menu overlay: it is shown without activation (SW_SHOWNOACTIVATE)
raw-window-handle = "0.6"
# Native drag-out: thumbnails dragged past the window edge become an OS file drag (DoDragDrop)
drag = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
