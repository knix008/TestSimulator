[package]
name = "myimageviewer"
version = "1.0.3"
description = "MyImageViewer"
authors = ["SHKWON"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Win32 handle of the menu overlay: it is shown without activation (SW_SHOWNOACTIVATE)
raw-window-handle = "0.6"
# Native drag-out: thumbnails dragged past the window edge become an OS file drag (DoDragDrop)
drag = "2"
# ── The desktop host (src/host/): what the Node host/service.js used to do ──
# Open / save / folder dialogs
tauri-plugin-dialog = "2"
# Links, "show in folder"
tauri-plugin-opener = "2"
# Thumbnails, TIFF → PNG, image header facts (no AVIF / SVG: the webview decodes those)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp", "ico", "tga", "hdr", "exr", "pnm", "qoi", "ff"] }
# More picture formats, all pure Rust (host/formats.rs): JPEG XL, JPEG 2000, Photoshop, PCX, Apple icons
jxl-oxide = "0.12"
hayro-jpeg2000 = "0.5"
psd = "0.3"
pcx = "0.2"
icns = "0.5"
# DirectDraw textures (uncompressed and BC1–BC7), decode only (image 0.25 has no DDS decoder)
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
# Folder / file change notifications
notify = "8"
base64 = "0.22"
# Cache keys (same sha1 names as the Node host, so its thumbnail cache stays valid) and
# the rembg model checksums
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
# rembg: Python installer and model downloads
ureq = "2"
# Super-resolution: the engine release zips; AVIF files (WebView2 cannot write AVIF)
zip = { version = "2", default-features = false, features = ["deflate"] }
ravif = { version = "0.13", default-features = false, features = ["threading"] }
# Explorer › Favorites: favorites.db (SQLite compiled in, nothing to install)
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# Default image viewer: per-user file associations
winreg = "0.55"
# Installed font families for the font lists (GDI EnumFontFamiliesExW). The page's own
# queryLocalFonts() made WebView2 ask "use your computer's fonts?" on every start.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
# Printing straight to a printer (no system dialog): WebView2 Print / PrintToPdf and the printer
# list. Same versions as Tauri's own webview2-com / windows (Cargo.lock), so the types match.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security"] }

# The AV1 encoder is unusably slow unoptimised (seconds become minutes): optimised in dev too
[profile.dev.package.rav1e]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Tests only: a JPEG XL file to decode (host/formats.rs tests)
[dev-dependencies]
zune-jpegxl = "0.5"
zune-core = "0.5"
