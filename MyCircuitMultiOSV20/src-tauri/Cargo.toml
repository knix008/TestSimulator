[package]
name = "mycircuit"
version = "1.0.0"
description = "MyCircuit — schematic, PCB, 3D and simulation electronics design"
authors = ["SHKWON <knix008@naver.com>"]
license = "Freeware"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mycircuit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Binary exports (zip, png, glb) arrive from the page as base64.
base64 = "0.22"
raw-window-handle = "0.6"

# Save as PDF: WebView2's own PrintToPdf (the versions wry itself uses).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
