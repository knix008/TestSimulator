<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P 시그널 서버 관리</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <h1>시그널 서버 관리</h1>
      <p class="note">
        채팅 내용은 저장되지 않습니다. 방 메타데이터·접속 수만 표시합니다. WebSocket 클라이언트는 기존과 같이
        <code>ws://호스트:포트</code> 로 연결합니다.
      </p>
    </header>

    <section class="toolbar">
      <button type="button" id="btnRefresh">새로고침</button>
      <span class="meta" id="statsLine"></span>
    </section>

    <section class="create">
      <h2>새 방</h2>
      <div class="row">
        <input id="newName" type="text" maxlength="64" placeholder="방 이름 (선택)" />
        <button type="button" id="btnCreate">생성</button>
      </div>
      <p class="msg" id="createMsg"></p>
    </section>

    <section class="list">
      <h2>방 목록</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>ID</th>
              <th>접속</th>
              <th>생성 시각</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <p class="empty hidden" id="empty">등록된 방이 없습니다.</p>
      </div>
      <p class="msg" id="listMsg"></p>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
