<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P Chat (client-only history)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>P2P Chat</h1>
        <p class="hint">
          서버는 <strong>방 목록·이름</strong>만 관리하며 채팅 내용은 저장하지 않습니다. 대화 기록은 이
          브라우저에만 저장됩니다. 같은 포트에서 <strong>http://…/</strong> 로 관리 화면을 열 수 있습니다.
        </p>
      </header>

      <section class="panel lobby" id="lobby">
        <div class="server-block">
          <label class="field">
            <span>시그널 서버 (호스트 또는 IP, 도메인)</span>
            <input
              id="serverHost"
              type="text"
              placeholder="예: localhost, 192.168.0.10, chat.example.com"
              autocomplete="off"
            />
          </label>
          <div class="server-row">
            <label class="field field-port">
              <span>포트</span>
              <input id="serverPort" type="text" inputmode="numeric" placeholder="8787" maxlength="6" autocomplete="off" />
            </label>
            <label class="field field-tls">
              <span>TLS (wss://)</span>
              <input id="serverTls" type="checkbox" />
            </label>
          </div>
          <p class="field-hint">
            연결에는 <strong>ws://</strong> 또는 <strong>wss://</strong> 만 사용됩니다. 전체 주소를 넣으려면 호스트 칸에
            <code>ws://서버:포트</code> 형태로 입력하면 포트·TLS 설정은 무시됩니다.
          </p>
        </div>
        <div class="actions">
          <button type="button" id="btnServerConnect">서버 연결</button>
          <button type="button" id="btnServerDisconnect" class="ghost" disabled>연결 끊기</button>
          <button type="button" id="btnRefreshRooms" class="ghost" disabled>목록 새로고침</button>
        </div>

        <div class="create-block">
          <h2 class="subheading">새 채팅방</h2>
          <div class="create-row">
            <input
              id="newRoomName"
              type="text"
              placeholder="방 이름 (비우면 자동)"
              maxlength="64"
              autocomplete="off"
              disabled
            />
            <button type="button" id="btnCreateRoom" disabled>방 만들기</button>
          </div>
        </div>

        <div class="rooms-block">
          <h2 class="subheading">채팅방 목록</h2>
          <div class="room-table-wrap">
            <table class="room-table" id="roomTable" aria-label="채팅방 목록">
              <thead>
                <tr>
                  <th>이름</th>
                  <th>접속</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="roomTableBody"></tbody>
            </table>
            <p class="empty-rooms hidden" id="emptyRooms">생성된 방이 없습니다. 위에서 새 방을 만드세요.</p>
          </div>
        </div>

        <p class="status" id="lobbyStatus"></p>
      </section>

      <section class="panel chat hidden" id="chat">
        <div class="chat-toolbar">
          <span id="roomLabel"></span>
          <span class="badge" id="connBadge">연결 중…</span>
          <button type="button" id="btnLeaveRoom" class="ghost">로비로 나가기</button>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <form class="composer" id="composer">
          <input id="messageInput" type="text" placeholder="메시지 입력…" maxlength="4000" autocomplete="off" disabled />
          <button type="submit">보내기</button>
        </form>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
