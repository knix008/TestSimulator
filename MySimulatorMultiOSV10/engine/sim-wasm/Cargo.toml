[package]
name = "sim-wasm"
version = "0.1.0"
edition = "2021"
description = "MySimulator engine as a plain wasm32 module (no wasm-bindgen)"
license = "MIT"

[lib]
name = "sim_wasm"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
sim-core = { path = "../sim-core", default-features = false }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
