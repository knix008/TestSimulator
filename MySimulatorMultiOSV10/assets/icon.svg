<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Tile: a bevelled slab lit from the top left (the My* family look) -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34507a"/>
      <stop offset="0.55" stop-color="#1c2a40"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c121c"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="tileGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bevelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Node headers: the category colours of the app -->
    <linearGradient id="nodeA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#3a9ae8"/></linearGradient>
    <linearGradient id="nodeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ee9f2e"/></linearGradient>
    <linearGradient id="nodeC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9adff"/><stop offset="1" stop-color="#a86ef0"/></linearGradient>
    <linearGradient id="nodeD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ef0e2"/><stop offset="1" stop-color="#2fbfab"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a52"/><stop offset="1" stop-color="#1a2638"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <!-- Tile -->
  <rect x="64" y="84" width="896" height="896" rx="190" fill="url(#tileEdge)"/>
  <rect x="64" y="64" width="896" height="896" rx="190" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="190" fill="none" stroke="url(#bevelLight)" stroke-width="10"/>
  <path d="M254 64 H770 A190 190 0 0 1 960 254 V420 C 760 470 300 470 64 420 V254 A190 190 0 0 1 254 64 Z" fill="url(#tileGloss)"/>
  <!-- Links -->
  <g fill="none" stroke-width="22" stroke-linecap="round">
    <path d="M396 300 C 500 300 470 470 560 470" stroke="#5cb4f4"/>
    <path d="M396 300 C 500 300 470 690 560 690" stroke="#5cb4f4"/>
    <path d="M776 470 C 830 470 800 560 820 580" stroke="#f0ad45"/>
    <path d="M776 690 C 830 690 800 600 820 580" stroke="#b884f5"/>
  </g>
  <!-- Source node: a sine wave -->
  <g filter="url(#shadow)">
    <rect x="160" y="210" width="236" height="180" rx="30" fill="url(#body)" stroke="#6d8bb3" stroke-width="6"/>
    <path d="M160 240 a30 30 0 0 1 30 -30 H366 a30 30 0 0 1 30 30 V262 H160 Z" fill="url(#nodeA)"/>
    <path d="M190 330 C 215 280 240 280 262 330 S 310 380 334 330 S 360 290 372 305" fill="none" stroke="#7cc8ff" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- Analysis node: a spectrum -->
  <g filter="url(#shadow)">
    <rect x="560" y="380" width="216" height="180" rx="30" fill="url(#body)" stroke="#c89a52" stroke-width="6"/>
    <path d="M560 410 a30 30 0 0 1 30 -30 H746 a30 30 0 0 1 30 30 V432 H560 Z" fill="url(#nodeB)"/>
    <g fill="#ffcf6e"><rect x="592" y="500" width="22" height="34" rx="4"/><rect x="626" y="462" width="22" height="72" rx="4"/><rect x="660" y="482" width="22" height="52" rx="4"/><rect x="694" y="508" width="22" height="26" rx="4"/><rect x="728" y="516" width="22" height="18" rx="4"/></g>
  </g>
  <!-- ML node: a little network -->
  <g filter="url(#shadow)">
    <rect x="560" y="600" width="216" height="180" rx="30" fill="url(#body)" stroke="#9c76d0" stroke-width="6"/>
    <path d="M560 630 a30 30 0 0 1 30 -30 H746 a30 30 0 0 1 30 30 V652 H560 Z" fill="url(#nodeC)"/>
    <g stroke="#cfa6ff" stroke-width="6" opacity="0.8"><path d="M606 690 L668 676 M606 690 L668 736 M606 744 L668 676 M606 744 L668 736 M668 676 L730 712 M668 736 L730 712"/></g>
    <g fill="#e2c6ff"><circle cx="606" cy="690" r="14"/><circle cx="606" cy="744" r="14"/><circle cx="668" cy="676" r="14"/><circle cx="668" cy="736" r="14"/><circle cx="730" cy="712" r="16"/></g>
  </g>
  <!-- Output: a KPI / play mark -->
  <g filter="url(#shadow)">
    <circle cx="840" cy="580" r="62" fill="url(#nodeD)" stroke="#bff7ee" stroke-width="6"/>
    <path d="M820 548 L870 580 L820 612 Z" fill="#0f2a33"/>
  </g>
  <!-- Ports -->
  <g fill="#ffffff" stroke="#1a2638" stroke-width="6">
    <circle cx="396" cy="300" r="16"/><circle cx="560" cy="470" r="16"/><circle cx="560" cy="690" r="16"/><circle cx="776" cy="470" r="16"/><circle cx="776" cy="690" r="16"/>
  </g>
</svg>
