      <rect x="188" y="88" width="36" height="176" rx="18" />
      <rect x="240" y="62" width="36" height="202" rx="18" />
      <rect x="292" y="108" width="36" height="156" rx="18" />
      <rect x="344" y="142" width="36" height="122" rx="18" />
    </g>
  </g>
  <text x="258" y="412" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="1.2" fill="#00695C" fill-opacity="0.38">AAC</text>
  <text x="256" y="402" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="1.2" fill="#ffffff">AAC</text>
