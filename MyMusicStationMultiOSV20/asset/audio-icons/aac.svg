    <filter id="lift-aac" x="-18%" y="-8%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a0628" flood-opacity="0.4" />
    </filter>
    <filter id="markShadow-aac" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0860" flood-opacity="0.32" />
    </filter>
  </defs>
  <g filter="url(#lift-aac)">
    <rect x="48" y="36" width="416" height="416" rx="114" fill="url(#body-aac)" />
  </g>
  <g clip-path="url(#tile-aac)">
    <rect x="48" y="36" width="416" height="416" fill="url(#shade-aac)" />
    <rect x="48" y="36" width="416" height="416" fill="url(#gloss-aac)" />
    <ellipse cx="196" cy="84" rx="130" ry="44" fill="#ffffff" fill-opacity="0.26" />
    <rect x="70" y="58" width="372" height="372" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" />
  </g>
  <g filter="url(#markShadow-aac)">
