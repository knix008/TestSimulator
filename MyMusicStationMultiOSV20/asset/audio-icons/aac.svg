<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AAC file mark. 3D squircle, unique glyph, large type. -->
  <defs>
    <linearGradient id="body-aac" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#9EFFF3" />
      <stop offset="0.45" stop-color="#00BFA5" />
      <stop offset="1" stop-color="#00695C" />
    </linearGradient>
    <radialGradient id="shade-aac" cx="0.78" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0.42" />
      <stop offset="1" stop-color="#1a0628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gloss-aac" cx="0.28" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark-aac" x1="150" y1="70" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#E8EEFF" />
    </linearGradient>
    <clipPath id="tile-aac">
      <rect x="48" y="36" width="416" height="416" rx="114" />
