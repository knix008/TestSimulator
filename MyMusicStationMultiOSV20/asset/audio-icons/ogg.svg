<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- OGG file mark. 3D squircle, unique glyph, large type. -->
  <defs>
    <linearGradient id="body-ogg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FFC2B6" />
      <stop offset="0.45" stop-color="#FF3B2E" />
      <stop offset="1" stop-color="#B71C1C" />
    </linearGradient>
    <radialGradient id="shade-ogg" cx="0.78" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0.42" />
      <stop offset="1" stop-color="#1a0628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gloss-ogg" cx="0.28" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark-ogg" x1="150" y1="70" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#E8EEFF" />
    </linearGradient>
    <clipPath id="tile-ogg">
      <rect x="48" y="36" width="416" height="416" rx="114" />
    </clipPath>
    <filter id="lift-ogg" x="-18%" y="-8%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a0628" flood-opacity="0.4" />
    </filter>
    <filter id="markShadow-ogg" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0860" flood-opacity="0.32" />
    </filter>
  </defs>
  <g filter="url(#lift-ogg)">
    <rect x="48" y="36" width="416" height="416" rx="114" fill="url(#body-ogg)" />
  </g>
  <g clip-path="url(#tile-ogg)">
    <rect x="48" y="36" width="416" height="416" fill="url(#shade-ogg)" />
    <rect x="48" y="36" width="416" height="416" fill="url(#gloss-ogg)" />
    <ellipse cx="196" cy="84" rx="130" ry="44" fill="#ffffff" fill-opacity="0.26" />
    <rect x="70" y="58" width="372" height="372" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" />
  </g>
  <g filter="url(#markShadow-ogg)">
    <g fill="none" stroke="url(#mark-ogg)" stroke-linecap="round">
      <circle cx="256" cy="168" r="28" stroke-width="22" />
      <circle cx="256" cy="168" r="70" stroke-width="18" />
      <circle cx="256" cy="168" r="112" stroke-width="16" />
    </g>
  </g>
  <text x="258" y="412" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="1.2" fill="#B71C1C" fill-opacity="0.38">OGG</text>
  <text x="256" y="402" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="1.2" fill="#ffffff">OGG</text>
</svg>
