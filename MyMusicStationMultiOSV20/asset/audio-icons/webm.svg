<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- WEBM file mark. 3D squircle, unique glyph, large type. -->
  <defs>
    <linearGradient id="body-webm" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FFD0B0" />
      <stop offset="0.45" stop-color="#FF5722" />
      <stop offset="1" stop-color="#BF360C" />
    </linearGradient>
    <radialGradient id="shade-webm" cx="0.78" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0.42" />
      <stop offset="1" stop-color="#1a0628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gloss-webm" cx="0.28" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark-webm" x1="150" y1="70" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#E8EEFF" />
    </linearGradient>
    <clipPath id="tile-webm">
      <rect x="48" y="36" width="416" height="416" rx="114" />
    </clipPath>
    <filter id="lift-webm" x="-18%" y="-8%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a0628" flood-opacity="0.4" />
    </filter>
    <filter id="markShadow-webm" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0860" flood-opacity="0.32" />
    </filter>
  </defs>
  <g filter="url(#lift-webm)">
    <rect x="48" y="36" width="416" height="416" rx="114" fill="url(#body-webm)" />
  </g>
  <g clip-path="url(#tile-webm)">
    <rect x="48" y="36" width="416" height="416" fill="url(#shade-webm)" />
    <rect x="48" y="36" width="416" height="416" fill="url(#gloss-webm)" />
    <ellipse cx="196" cy="84" rx="130" ry="44" fill="#ffffff" fill-opacity="0.26" />
    <rect x="70" y="58" width="372" height="372" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" />
  </g>
  <g filter="url(#markShadow-webm)">
    <g fill="url(#mark-webm)">
      <circle cx="256" cy="168" r="118" fill-opacity="0.28" />
      <path d="M214 96l132 72-132 72z" />
    </g>
  </g>
  <text x="258" y="412" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.5" fill="#BF360C" fill-opacity="0.38">WEBM</text>
  <text x="256" y="402" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.5" fill="#ffffff">WEBM</text>
