<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- OPUS file mark. 3D squircle, unique glyph, large type. -->
  <defs>
    <linearGradient id="body-opus" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#B8F0FF" />
      <stop offset="0.45" stop-color="#00B0F0" />
      <stop offset="1" stop-color="#01579B" />
    </linearGradient>
    <radialGradient id="shade-opus" cx="0.78" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0.42" />
      <stop offset="1" stop-color="#1a0628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gloss-opus" cx="0.28" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark-opus" x1="150" y1="70" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#E8EEFF" />
    </linearGradient>
    <clipPath id="tile-opus">
      <rect x="48" y="36" width="416" height="416" rx="114" />
    </clipPath>
    <filter id="lift-opus" x="-18%" y="-8%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a0628" flood-opacity="0.4" />
    </filter>
    <filter id="markShadow-opus" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0860" flood-opacity="0.32" />
    </filter>
  </defs>
  <g filter="url(#lift-opus)">
    <rect x="48" y="36" width="416" height="416" rx="114" fill="url(#body-opus)" />
  </g>
  <g clip-path="url(#tile-opus)">
    <rect x="48" y="36" width="416" height="416" fill="url(#shade-opus)" />
    <rect x="48" y="36" width="416" height="416" fill="url(#gloss-opus)" />
    <ellipse cx="196" cy="84" rx="130" ry="44" fill="#ffffff" fill-opacity="0.26" />
    <rect x="70" y="58" width="372" height="372" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" />
  </g>
  <g filter="url(#markShadow-opus)">
    <g fill="none" stroke="url(#mark-opus)" stroke-linecap="round">
      <path d="M168 220c36-86 140-86 176 0" stroke-width="22" />
      <path d="M140 248c52-128 180-128 232 0" stroke-width="18" />
      <path d="M114 276c66-168 218-168 284 0" stroke-width="16" />
      <circle cx="256" cy="236" r="16" fill="url(#mark-opus)" stroke="none" />
    </g>
  </g>
  <text x="258" y="412" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.5" fill="#01579B" fill-opacity="0.38">OPUS</text>
  <text x="256" y="402" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.5" fill="#ffffff">OPUS</text>
</svg>
