<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MP3 file mark. 3D squircle, unique glyph, large type. -->
  <defs>
    <linearGradient id="body-mp3" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FFE08A" />
      <stop offset="0.45" stop-color="#FF6A00" />
      <stop offset="1" stop-color="#B33A00" />
    </linearGradient>
    <radialGradient id="shade-mp3" cx="0.78" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0.42" />
      <stop offset="1" stop-color="#1a0628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gloss-mp3" cx="0.28" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark-mp3" x1="150" y1="70" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#E8EEFF" />
    </linearGradient>
    <clipPath id="tile-mp3">
      <rect x="48" y="36" width="416" height="416" rx="114" />
    </clipPath>
    <filter id="lift-mp3" x="-18%" y="-8%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a0628" flood-opacity="0.4" />
    </filter>
    <filter id="markShadow-mp3" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0860" flood-opacity="0.32" />
    </filter>
  </defs>
  <g filter="url(#lift-mp3)">
    <rect x="48" y="36" width="416" height="416" rx="114" fill="url(#body-mp3)" />
  </g>
  <g clip-path="url(#tile-mp3)">
    <rect x="48" y="36" width="416" height="416" fill="url(#shade-mp3)" />
    <rect x="48" y="36" width="416" height="416" fill="url(#gloss-mp3)" />
    <ellipse cx="196" cy="84" rx="130" ry="44" fill="#ffffff" fill-opacity="0.26" />
    <rect x="70" y="58" width="372" height="372" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" />
  </g>
  <g filter="url(#markShadow-mp3)">
    <g fill="url(#mark-mp3)">
      <ellipse cx="176" cy="236" rx="52" ry="38" transform="rotate(-18 176 236)" />
      <rect x="212" y="96" width="26" height="148" rx="13" />
      <ellipse cx="292" cy="214" rx="52" ry="38" transform="rotate(-18 292 214)" />
      <rect x="328" y="74" width="26" height="148" rx="13" />
      <path d="M225 74h129c8 0 12 10 8 16L346 132H237c-8 0-13-8-10-16z" />
    </g>
  </g>
  <text x="258" y="412" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="1.2" fill="#B33A00" fill-opacity="0.38">MP3</text>
  <text x="256" y="402" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="1.2" fill="#ffffff">MP3</text>
</svg>
