<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- WMA file mark. 3D squircle, unique glyph, large type. -->
  <defs>
    <linearGradient id="body-wma" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#D4D8FF" />
      <stop offset="0.45" stop-color="#5C6CFF" />
      <stop offset="1" stop-color="#283593" />
    </linearGradient>
    <radialGradient id="shade-wma" cx="0.78" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0.42" />
      <stop offset="1" stop-color="#1a0628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gloss-wma" cx="0.28" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark-wma" x1="150" y1="70" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#E8EEFF" />
    </linearGradient>
    <clipPath id="tile-wma">
      <rect x="48" y="36" width="416" height="416" rx="114" />
    </clipPath>
    <filter id="lift-wma" x="-18%" y="-8%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a0628" flood-opacity="0.4" />
    </filter>
    <filter id="markShadow-wma" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0860" flood-opacity="0.32" />
    </filter>
  </defs>
  <g filter="url(#lift-wma)">
    <rect x="48" y="36" width="416" height="416" rx="114" fill="url(#body-wma)" />
  </g>
  <g clip-path="url(#tile-wma)">
    <rect x="48" y="36" width="416" height="416" fill="url(#shade-wma)" />
    <rect x="48" y="36" width="416" height="416" fill="url(#gloss-wma)" />
    <ellipse cx="196" cy="84" rx="130" ry="44" fill="#ffffff" fill-opacity="0.26" />
    <rect x="70" y="58" width="372" height="372" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" />
  </g>
  <g filter="url(#markShadow-wma)">
    <g fill="url(#mark-wma)">
      <rect x="148" y="70" width="88" height="88" rx="26" />
      <rect x="276" y="70" width="88" height="88" rx="26" />
      <rect x="148" y="178" width="88" height="88" rx="26" fill-opacity="0.72" />
      <rect x="276" y="178" width="88" height="88" rx="26" fill-opacity="0.72" />
    </g>
  </g>
  <text x="258" y="412" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="1.2" fill="#283593" fill-opacity="0.38">WMA</text>
  <text x="256" y="402" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="1.2" fill="#ffffff">WMA</text>
</svg>
