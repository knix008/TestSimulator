<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AIFF file mark. 3D squircle, unique glyph, large type. -->
  <defs>
    <linearGradient id="body-aiff" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FFE9A0" />
      <stop offset="0.45" stop-color="#F5C400" />
      <stop offset="1" stop-color="#C67A00" />
    </linearGradient>
    <radialGradient id="shade-aiff" cx="0.78" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0.42" />
      <stop offset="1" stop-color="#1a0628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gloss-aiff" cx="0.28" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark-aiff" x1="150" y1="70" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#E8EEFF" />
    </linearGradient>
    <clipPath id="tile-aiff">
      <rect x="48" y="36" width="416" height="416" rx="114" />
    </clipPath>
    <filter id="lift-aiff" x="-18%" y="-8%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a0628" flood-opacity="0.4" />
    </filter>
    <filter id="markShadow-aiff" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0860" flood-opacity="0.32" />
    </filter>
  </defs>
  <g filter="url(#lift-aiff)">
    <rect x="48" y="36" width="416" height="416" rx="114" fill="url(#body-aiff)" />
  </g>
  <g clip-path="url(#tile-aiff)">
    <rect x="48" y="36" width="416" height="416" fill="url(#shade-aiff)" />
    <rect x="48" y="36" width="416" height="416" fill="url(#gloss-aiff)" />
    <ellipse cx="196" cy="84" rx="130" ry="44" fill="#ffffff" fill-opacity="0.26" />
    <rect x="70" y="58" width="372" height="372" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" />
  </g>
  <g filter="url(#markShadow-aiff)">
    <path fill="none" stroke="url(#mark-aiff)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
          d="M118 176c28-88 56-88 84 0s56 88 84 0 56-88 84 0 56 88 84 0" />
  </g>
  <text x="258" y="412" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.5" fill="#C67A00" fill-opacity="0.38">AIFF</text>
  <text x="256" y="402" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.5" fill="#2C2200">AIFF</text>
</svg>
