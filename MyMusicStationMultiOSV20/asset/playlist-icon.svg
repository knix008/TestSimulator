<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Playlist (.mplist): 3D squircle whose face reads as a track list. -->
  <defs>
    <linearGradient id="body-pl" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#D6F4FF" />
      <stop offset="0.42" stop-color="#3E92F0" />
      <stop offset="1" stop-color="#1558C0" />
    </linearGradient>
    <radialGradient id="shade-pl" cx="0.78" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0.4" />
      <stop offset="1" stop-color="#1a0628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gloss-pl" cx="0.28" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark-pl" x1="120" y1="120" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#E8EEFF" />
    </linearGradient>
    <clipPath id="tile-pl">
      <rect x="48" y="36" width="416" height="416" rx="114" />
    </clipPath>
    <filter id="lift-pl" x="-18%" y="-8%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a0628" flood-opacity="0.4" />
    </filter>
    <filter id="markShadow-pl" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0860" flood-opacity="0.35" />
    </filter>
  </defs>
  <g filter="url(#lift-pl)">
    <rect x="48" y="36" width="416" height="416" rx="114" fill="url(#body-pl)" />
  </g>
  <g clip-path="url(#tile-pl)">
    <rect x="48" y="36" width="416" height="416" fill="url(#shade-pl)" />
    <rect x="48" y="36" width="416" height="416" fill="url(#gloss-pl)" />
    <ellipse cx="196" cy="84" rx="130" ry="44" fill="#ffffff" fill-opacity="0.28" />
  </g>
  <g filter="url(#markShadow-pl)" fill="url(#mark-pl)">
    <ellipse cx="156" cy="176" rx="22" ry="16" transform="rotate(-18 156 176)" />
    <rect x="168" y="124" width="12" height="56" rx="6" />
    <rect x="214" y="162" width="176" height="22" rx="11" />
    <ellipse cx="156" cy="256" rx="22" ry="16" transform="rotate(-18 156 256)" />
    <rect x="168" y="204" width="12" height="56" rx="6" />
    <rect x="214" y="242" width="146" height="22" rx="11" />
    <ellipse cx="156" cy="336" rx="22" ry="16" transform="rotate(-18 156 336)" />
    <rect x="168" y="284" width="12" height="56" rx="6" />
    <rect x="214" y="322" width="162" height="22" rx="11" />
  </g>
</svg>
