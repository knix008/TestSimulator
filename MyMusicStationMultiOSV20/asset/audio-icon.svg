<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Audio file mark. 3D squircle, unique glyph, large type. -->
  <defs>
    <linearGradient id="body-audio" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#9AFFFF" />
      <stop offset="0.45" stop-color="#6A62FF" />
      <stop offset="1" stop-color="#5B1FA8" />
    </linearGradient>
    <radialGradient id="shade-audio" cx="0.78" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#1a0628" stop-opacity="0.42" />
      <stop offset="1" stop-color="#1a0628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gloss-audio" cx="0.28" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark-audio" x1="150" y1="70" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#E8EEFF" />
    </linearGradient>
    <clipPath id="tile-audio">
      <rect x="48" y="36" width="416" height="416" rx="114" />
    </clipPath>
    <filter id="lift-audio" x="-18%" y="-8%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a0628" flood-opacity="0.4" />
    </filter>
    <filter id="markShadow-audio" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0860" flood-opacity="0.32" />
    </filter>
  </defs>
  <g filter="url(#lift-audio)">
    <rect x="48" y="36" width="416" height="416" rx="114" fill="url(#body-audio)" />
  </g>
  <g clip-path="url(#tile-audio)">
    <rect x="48" y="36" width="416" height="416" fill="url(#shade-audio)" />
    <rect x="48" y="36" width="416" height="416" fill="url(#gloss-audio)" />
    <ellipse cx="196" cy="84" rx="130" ry="44" fill="#ffffff" fill-opacity="0.26" />
    <rect x="70" y="58" width="372" height="372" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" />
  </g>
  <g filter="url(#markShadow-audio)">
    <g fill="url(#mark-audio)">
      <path d="M281 96 C361 96 412 140 400 208 C395 239 378 262 355 275
               C376 241 372 206 353 181 C338 160 311 148 281 145 Z" />
      <rect x="281" y="96" width="32" height="188" rx="16" />
      <ellipse cx="220" cy="276" rx="70" ry="54" transform="rotate(-18 220 276)" />
    </g>
  </g>
</svg>
