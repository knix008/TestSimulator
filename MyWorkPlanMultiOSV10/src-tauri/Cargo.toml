[package]
name = "myworkplan"
version = "1.0.0"
description = "Cross-platform project planning and scheduling"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "myworkplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
arboard = { version = "3.6", default-features = false }
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plans in a database (Settings › Database): SQLite, MariaDB/MySQL, PostgreSQL.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "mysql", "postgres", "sqlite"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# The "already running" message, shown before the app (and its event loop) starts.
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }

# Printing straight to a chosen printer (WebView2 silent print) and the printer list.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
# Starts a throw-away PostgreSQL server for the database tests (downloaded once, then cached).
postgresql_embedded = { version = "0.21", features = ["tokio"] }

[[test]]
name = "db_integration"
path = "../test/db_integration.rs"

# Installed app: smaller and faster (whole-program optimisation, no debug symbols). Debug builds and tests are unaffected.
[profile.release]
lto = true
codegen-units = 1
strip = true
