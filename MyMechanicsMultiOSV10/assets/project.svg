<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- .mymech project icon: a raised page with a folded corner, a blueprint grid and a small flange. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e8f1fd"/>
      <stop offset="1" stop-color="#a9c6ec"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d5ea3"/><stop offset="1" stop-color="#173561"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5e5fb"/><stop offset="1" stop-color="#6f9bd6"/>
    </linearGradient>
    <linearGradient id="steelTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9eacbb"/>
    </linearGradient>
    <linearGradient id="steelSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7f92"/><stop offset="0.4" stop-color="#c9d3de"/><stop offset="1" stop-color="#4f5d6e"/>
    </linearGradient>
  </defs>
  <path d="M220 120 h420 l184 184 v600 a40 40 0 0 1 -40 40 h-564 a40 40 0 0 1 -40 -40 v-744 a40 40 0 0 1 40 -40 z" fill="url(#side)" transform="translate(0 22)"/>
  <path d="M220 120 h420 l184 184 v600 a40 40 0 0 1 -40 40 h-564 a40 40 0 0 1 -40 -40 v-744 a40 40 0 0 1 40 -40 z" fill="url(#face)" stroke="#2d5ea3" stroke-width="10"/>
  <path d="M640 120 v144 a40 40 0 0 0 40 40 h144 z" fill="url(#fold)" stroke="#2d5ea3" stroke-width="10" stroke-linejoin="round"/>
  <g stroke="#7fa6d8" stroke-width="3" opacity="0.5">
    <path d="M200 400h600M200 500h600M200 600h600M200 700h600M200 800h600"/>
    <path d="M300 330v560M400 330v560M500 330v560M600 330v560M700 330v560"/>
  </g>
  <path d="M312 650 v50 a200 100 0 0 0 400 0 v-50 z" fill="url(#steelSide)"/>
  <ellipse cx="512" cy="650" rx="200" ry="100" fill="url(#steelTop)" stroke="#5a6878" stroke-width="5"/>
  <g fill="#3c4856"><ellipse cx="356" cy="650" rx="22" ry="11"/><ellipse cx="668" cy="650" rx="22" ry="11"/><ellipse cx="434" cy="588" rx="22" ry="11"/><ellipse cx="590" cy="588" rx="22" ry="11"/><ellipse cx="434" cy="712" rx="22" ry="11"/><ellipse cx="590" cy="712" rx="22" ry="11"/></g>
  <path d="M432 540 v110 a80 40 0 0 0 160 0 v-110 z" fill="url(#steelSide)"/>
  <ellipse cx="512" cy="540" rx="80" ry="40" fill="url(#steelTop)" stroke="#5a6878" stroke-width="5"/>
