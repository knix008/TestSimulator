<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MyMechanics app icon: a machined flange (hub, bore and bolt holes) in isometric view with a
       dimension line, over a blueprint grid on a raised steel-blue tile. The tile sits in the exact
       centre (112…912 both ways); the border is transparent. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e9ff"/>
      <stop offset="0.5" stop-color="#5b8fd6"/>
      <stop offset="1" stop-color="#1f4c8f"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3d70"/>
      <stop offset="1" stop-color="#0d2346"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#06183a" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#eef6ff" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steelTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d9e1ea"/>
      <stop offset="1" stop-color="#9eacbb"/>
    </linearGradient>
    <linearGradient id="steelSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7f92"/>
      <stop offset="0.35" stop-color="#c9d3de"/>
      <stop offset="0.7" stop-color="#8d9cad"/>
      <stop offset="1" stop-color="#4f5d6e"/>
    </linearGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3644"/>
      <stop offset="1" stop-color="#5d6c7e"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="112" y="112" width="800" height="800" rx="176"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <!-- the tile -->
  <rect x="112" y="136" width="800" height="776" rx="176" fill="url(#side)"/>
  <rect x="112" y="112" width="800" height="776" rx="176" fill="url(#face)"/>
  <g clip-path="url(#tileClip)" opacity="0.35" stroke="#e9f3ff" stroke-width="3">
    <path d="M112 212h800M112 312h800M112 412h800M112 512h800M112 612h800M112 712h800M112 812h800"/>
    <path d="M212 112v800M312 112v800M412 112v800M512 112v800M612 112v800M712 112v800M812 112v800"/>
  </g>
  <rect x="112" y="112" width="800" height="776" rx="176" fill="url(#glow)"/>
  <rect x="120" y="120" width="784" height="760" rx="170" fill="none" stroke="url(#bevel)" stroke-width="14"/>
  <!-- the flange: a disc with a hub, isometric ellipses -->
  <g filter="url(#shadow)">
    <!-- disc side -->
    <path d="M232 560 v70 a280 140 0 0 0 560 0 v-70 z" fill="url(#steelSide)"/>
    <ellipse cx="512" cy="560" rx="280" ry="140" fill="url(#steelTop)" stroke="#5a6878" stroke-width="5"/>
    <!-- bolt holes -->
    <g fill="url(#bore)" stroke="#3c4856" stroke-width="3">
      <ellipse cx="292" cy="560" rx="30" ry="15"/>
      <ellipse cx="732" cy="560" rx="30" ry="15"/>
      <ellipse cx="402" cy="474" rx="30" ry="15"/>
      <ellipse cx="622" cy="474" rx="30" ry="15"/>
      <ellipse cx="402" cy="646" rx="30" ry="15"/>
      <ellipse cx="622" cy="646" rx="30" ry="15"/>
    </g>
    <!-- hub -->
    <path d="M392 412 v148 a120 60 0 0 0 240 0 v-148 z" fill="url(#steelSide)"/>
    <ellipse cx="512" cy="412" rx="120" ry="60" fill="url(#steelTop)" stroke="#5a6878" stroke-width="5"/>
    <ellipse cx="512" cy="412" rx="64" ry="32" fill="url(#bore)" stroke="#3c4856" stroke-width="4"/>
  </g>
  <!-- a dimension line over the disc (blueprint orange) -->
  <g stroke="#ffb547" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M232 790 h560"/>
    <path d="M232 760 v60M792 760 v60"/>
    <path d="M232 790 l34 -18M232 790 l34 18M792 790 l-34 -18M792 790 l-34 18"/>
  </g>
  <!-- a centre mark -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M512 228 v80M472 268 h80"/>
  </g>
</svg>
