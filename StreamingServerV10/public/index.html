<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스트리밍 시청</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f13; color: #e0e0e0; }

    header {
      background: #1a1a2e; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2px solid #2a2a4a;
    }
    header h1 { font-size: 1.2rem; color: #a0a0ff; }
    header a { color: #6060cc; text-decoration: none; font-size: 0.9rem; }
    header a:hover { color: #a0a0ff; }

    .layout { display: flex; height: calc(100vh - 53px); }

    /* Sidebar: channel list */
    .sidebar {
      width: 300px; min-width: 260px; background: #13131f;
      border-right: 1px solid #2a2a3a; overflow-y: auto; padding: 12px;
    }
    .sidebar h2 { font-size: 0.85rem; text-transform: uppercase;
      color: #666; letter-spacing: 1px; padding: 4px 0 10px; }

    .channel-card {
      background: #1c1c2e; border: 1px solid #2a2a3a; border-radius: 8px;
      padding: 12px; margin-bottom: 10px; transition: border-color .2s;
    }
    .channel-card:hover { border-color: #4a4aaa; }
    .ch-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .ch-desc { font-size: 0.8rem; color: #888; margin-bottom: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch-meta { display: flex; justify-content: space-between;
      font-size: 0.78rem; color: #777; margin-bottom: 10px; }
    .live { color: #ff4444; font-weight: 700; }
    .offline { color: #555; }
    .btn-join {
      width: 100%; padding: 7px; background: #2a2a6e; color: #a0a0ff;
      border: 1px solid #3a3a8e; border-radius: 5px; cursor: pointer;
      font-size: 0.85rem; transition: background .2s;
    }
    .btn-join:hover { background: #3a3aae; }
    .empty { color: #555; font-size: 0.85rem; text-align: center; padding: 20px 0; }

    /* Main: player */
    .main { flex: 1; display: flex; flex-direction: column; }

    .player-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #000; position: relative;
    }
    #player {
      width: 100%; height: 100%; max-height: 100%;
      object-fit: contain; background: #000;
    }
    .overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .overlay-text { color: #333; font-size: 1.1rem; }

    .controls {
      background: #1a1a2e; padding: 10px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    #status { font-size: 0.85rem; }
    #status.live { color: #ff4444; font-weight: 700; }
    #status.ok { color: #44cc44; }
    #status.error { color: #ff6666; }
    #status.waiting { color: #ffaa44; }
    #viewerCount { font-size: 0.8rem; color: #888; margin-left: auto; }

    .btn {
      padding: 7px 16px; border-radius: 5px; border: none;
      cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
    .btn-red { background: #aa2222; color: #fff; }
    .btn-red:hover { background: #cc3333; }
    .btn-red:disabled { background: #333; color: #666; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>스트리밍 서버</h1>
    <a href="/broadcast.html">📡 방송하기</a>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>채널 목록</h2>
      <div id="channelList"><p class="empty">로딩 중...</p></div>
    </aside>

    <div class="main">
      <div class="player-area">
        <video id="player" autoplay playsinline></video>
        <div class="overlay">
          <span class="overlay-text" id="overlayText">채널을 선택하세요</span>
        </div>
      </div>
      <div class="controls">
        <span id="status"></span>
        <button class="btn btn-red" id="btnLeave" disabled>나가기</button>
        <span id="viewerCount"></span>
      </div>
    </div>
  </div>

  <script>
    // Hide overlay when video plays
    document.getElementById('player').addEventListener('play', () => {
      document.getElementById('overlayText').style.display = 'none';
    });
  </script>
  <script src="/bundle/viewer.bundle.js"></script>
</body>
</html>
