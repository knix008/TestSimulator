[package]
name = "myftpserver"
version = "1.0.1"
description = "My FTP Server — FTP / FTPS / SFTP server (Tauri shell around the Node host)"
authors = ["SHKWON <knix008@naver.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "myftpserver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
