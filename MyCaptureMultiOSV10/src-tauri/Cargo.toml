[package]
name = "mycapture"
version = "1.0.0"
description = "Cross-platform screen capture and recording"
authors = ["shkwon"]
edition = "2021"

[lib]
name = "mycapture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "capture_integration"
path = "../test/capture_integration.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "tiff", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
xcap = "0.7"

[target.'cfg(windows)'.dependencies]
# Same version Tauri's WebView2 runtime uses; only for granting microphone access.
webview2-com = "0.39"

[dev-dependencies]
tempfile = "3"

# Pixel loops (BGRA→RGBA, cropping, JPEG/PNG encoding) are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.mycapture]
opt-level = 1
