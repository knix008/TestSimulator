<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MyCapture: capture-frame corners around a camera lens with a record light, drawn with depth. -->
  <defs>
    <!-- tile: lit from the top, darker toward the bottom -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc2ff"/>
      <stop offset="0.45" stop-color="#1a86e0"/>
      <stop offset="1" stop-color="#0749a0"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9adcff"/>
      <stop offset="0.5" stop-color="#2a8ee6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#03306e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#7fd0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fd0ff" stop-opacity="0"/>
    </radialGradient>
    <!-- raised white brackets -->
    <linearGradient id="bracket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe3f7"/>
    </linearGradient>
    <!-- metal lens ring -->
    <linearGradient id="metal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d9e1ea"/>
      <stop offset="0.55" stop-color="#8f9cab"/>
      <stop offset="0.8" stop-color="#e3e9f0"/>
      <stop offset="1" stop-color="#7d8a99"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d131c"/>
      <stop offset="1" stop-color="#2e3a4a"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#5a7cc4"/>
      <stop offset="0.35" stop-color="#253a78"/>
      <stop offset="0.7" stop-color="#0e1430"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#0a0f22" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- record light: a small red sphere -->
    <radialGradient id="ruby" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffb3b3"/>
      <stop offset="0.3" stop-color="#ff4545"/>
      <stop offset="0.75" stop-color="#c8101a"/>
      <stop offset="1" stop-color="#6e0610"/>
    </radialGradient>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#021a3d" flood-opacity="0.45"/>
    </filter>
    <filter id="raise" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#032a5e" flood-opacity="0.55"/>
    </filter>
    <filter id="lensShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#021733" flood-opacity="0.6"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="tileClip"><rect x="72" y="56" width="880" height="880" rx="200"/></clipPath>
  </defs>

  <!-- tile with drop shadow, bevelled rim, inner glow and top gloss -->
  <g filter="url(#tileShadow)">
    <rect x="72" y="56" width="880" height="880" rx="200" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect x="72" y="56" width="880" height="880" fill="url(#tileGlow)"/>
    <ellipse cx="512" cy="140" rx="520" ry="300" fill="url(#gloss)"/>
    <rect x="72" y="840" width="880" height="120" fill="#021e4a" opacity="0.25" filter="url(#soft)"/>
  </g>
  <rect x="80" y="64" width="864" height="864" rx="192" fill="none" stroke="url(#tileEdge)" stroke-width="16"/>

  <!-- capture-frame corners, raised off the tile -->
  <g filter="url(#raise)" fill="none" stroke="url(#bracket)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 372V250a36 36 0 0 1 36-36h122"/>
    <path d="M644 214h122a36 36 0 0 1 36 36v122"/>
    <path d="M802 620v122a36 36 0 0 1-36 36H644"/>
    <path d="M380 778H258a36 36 0 0 1-36-36V620"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.8">
    <path d="M206 360V252a52 52 0 0 1 52-52h110"/>
    <path d="M656 200h110a52 52 0 0 1 52 52v108"/>
  </g>

  <!-- lens: metal ring, dark barrel, glass with iris and reflections -->
  <g filter="url(#lensShadow)">
    <circle cx="512" cy="496" r="206" fill="url(#metal)"/>
  </g>
  <circle cx="512" cy="496" r="200" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
  <circle cx="512" cy="496" r="172" fill="url(#barrel)"/>
  <circle cx="512" cy="496" r="172" fill="none" stroke="#56677c" stroke-width="5"/>
  <circle cx="512" cy="496" r="146" fill="url(#glass)"/>
  <circle cx="512" cy="496" r="112" fill="none" stroke="#3a4f86" stroke-width="5" opacity="0.8"/>
  <circle cx="512" cy="496" r="76" fill="url(#iris)"/>
  <circle cx="512" cy="496" r="40" fill="#03050c"/>
  <!-- glass reflections -->
  <path d="M410 430a118 118 0 0 1 112-68 118 118 0 0 1 22 2 100 100 0 0 0-26-2 100 100 0 0 0-94 58z" fill="url(#reflection)"/>
  <ellipse cx="452" cy="436" rx="44" ry="26" transform="rotate(-35 452 436)" fill="#ffffff" opacity="0.75"/>
  <circle cx="584" cy="560" r="14" fill="#ffffff" opacity="0.45"/>
  <path d="M600 600a120 120 0 0 1-60 38" fill="none" stroke="#9fb6ff" stroke-width="8" stroke-linecap="round" opacity="0.45"/>

  <!-- record light -->
  <g filter="url(#raise)">
    <circle cx="742" cy="282" r="62" fill="#ffffff"/>
  </g>
  <circle cx="742" cy="282" r="50" fill="url(#ruby)"/>
  <ellipse cx="726" cy="262" rx="20" ry="13" transform="rotate(-30 726 262)" fill="#ffffff" opacity="0.8"/>
</svg>
