<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyCalendar</title>
  <link rel="icon" href="/assets/icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <div class="app-body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <img src="/assets/icon.png" alt="" class="brand-logo" />
        <span data-i18n="appName">MyCalendar</span>
      </div>

      <button id="btnNewEvent" class="btn btn-primary btn-new" data-i18n="newEvent">+ 새 일정</button>

      <div class="mini-cal" id="miniCal"></div>

      <div class="cal-list">
        <div class="cal-list-head">
          <span data-i18n="myCalendars">내 캘린더</span>
          <button id="btnAddCal" class="icon-btn" data-i18n-title="addCalendar" title="캘린더 추가">+</button>
        </div>
        <ul id="calList"></ul>
      </div>

      <div class="sidebar-footer">
        <button id="btnGoogle" class="btn btn-ghost" data-i18n="googleConnect">🔗 Google 연동</button>
        <button id="btnSettings" class="btn btn-ghost" data-i18n="settings">⚙️ 설정</button>
        <button id="btnAbout" class="btn btn-ghost" data-i18n="menu_about">ℹ️ 정보</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="toolbar">
        <div class="toolbar-left">
          <button id="btnToggleSidebar" class="btn btn-outline tb" data-i18n-title="toggleSidebar" title="패널 접기/펼치기">
            <span class="ico">&#9776;</span><span class="lbl" data-i18n="tb_panel">패널</span></button>
          <button id="btnToday" class="btn btn-outline tb" data-i18n-title="tt_today" title="오늘로 이동">
            <span class="ico">&#128197;</span><span class="lbl" data-i18n="today">오늘</span></button>
          <button id="btnPrev" class="btn btn-outline tb" data-i18n-title="tt_prev" title="이전 기간">
            <span class="ico">&#8249;</span><span class="lbl" data-i18n="tb_prev">이전</span></button>
          <button id="btnNext" class="btn btn-outline tb" data-i18n-title="tt_next" title="다음 기간">
            <span class="ico">&#8250;</span><span class="lbl" data-i18n="tb_next">다음</span></button>
          <h2 id="periodLabel" class="period-label"></h2>
        </div>
        <div class="toolbar-right">
          <div class="view-switch" id="viewSwitch">
            <button data-view="month" class="active" data-i18n-title="tt_month" title="월 보기"><span class="ico">&#9638;</span><span class="lbl" data-i18n="view_month">월</span></button>
            <button data-view="week" data-i18n-title="tt_week" title="주 보기"><span class="ico">&#9636;</span><span class="lbl" data-i18n="view_week">주</span></button>
            <button data-view="day" data-i18n-title="tt_day" title="일 보기"><span class="ico">&#9637;</span><span class="lbl" data-i18n="view_day">일</span></button>
            <button data-view="agenda" data-i18n-title="tt_agenda" title="목록 보기"><span class="ico">&#8803;</span><span class="lbl" data-i18n="view_agenda">목록</span></button>
          </div>
          <button id="btnSync" class="btn btn-outline tb" data-i18n-title="tt_sync" title="Google 동기화">
            <span class="ico">&#10227;</span><span class="lbl" data-i18n="sync_label">동기화</span></button>
          <button id="btnLang" class="btn btn-outline tb" data-i18n-title="tt_lang" title="언어 전환">
            <span class="ico">&#127760;</span><span class="lbl" id="langLabel">한국어</span></button>
          <button id="btnTheme" class="btn btn-outline tb" data-i18n-title="tt_theme" title="테마 전환">
            <span class="ico" id="themeIco">&#127769;</span><span class="lbl" id="themeLabel">다크</span></button>
          <div class="win-controls" id="winControls" style="display:none">
            <button id="winMin" class="win-btn" data-i18n-title="tt_min" title="최소화">&#x2500;</button>
            <button id="winMax" class="win-btn" data-i18n-title="tt_max" title="최대화">&#x25A1;</button>
            <button id="winClose" class="win-btn win-close" data-i18n-title="tt_close" title="닫기">&#x2715;</button>
          </div>
        </div>
      </header>

      <div id="calendarView" class="calendar-view"></div>
    </main>
    </div><!-- /app-body -->

    <!-- Status bar -->
    <footer class="statusbar">
      <div class="sb-left">
        <span class="sb-seg" id="sbView"></span>
        <span class="sb-sep">·</span>
        <span class="sb-seg" id="sbCount"></span>
      </div>
      <div class="sb-center">
        <span class="sb-seg" id="sbSelected"></span>
      </div>
      <div class="sb-right">
        <span class="sb-seg sb-clickable" id="sbGoogle" title="Google"></span>
        <span class="sb-sep">·</span>
        <span class="sb-seg" id="sbVersion"></span>
      </div>
    </footer>
  </div>

  <!-- Event editor modal -->
  <div id="eventModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="eventModalTitle" data-i18n="title_new">새 일정</h3>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="evTitle" class="input" data-i18n-ph="f_title" placeholder="제목" />
        <div class="row">
          <label class="check"><input type="checkbox" id="evAllDay" /> <span data-i18n="f_allday">하루 종일</span></label>
        </div>
        <div class="row two">
          <div>
            <label data-i18n="f_start">시작</label>
            <div class="dt-field">
              <input type="date" class="input dt-date" id="evStartDate" />
              <div class="dt-time" id="evStartTime">
                <button type="button" class="dt-btn" data-inp="evStartHour" data-part="h" data-dir="-1" tabindex="-1">‹</button>
                <input class="dt-num" id="evStartHour" list="dlHours" inputmode="numeric" maxlength="2" />
                <button type="button" class="dt-btn" data-inp="evStartHour" data-part="h" data-dir="1" tabindex="-1">›</button>
                <span class="dt-colon">:</span>
                <button type="button" class="dt-btn" data-inp="evStartMin" data-part="m" data-dir="-1" tabindex="-1">‹</button>
                <input class="dt-num" id="evStartMin" list="dlMins" inputmode="numeric" maxlength="2" />
                <button type="button" class="dt-btn" data-inp="evStartMin" data-part="m" data-dir="1" tabindex="-1">›</button>
              </div>
            </div>
          </div>
          <div>
            <label data-i18n="f_end">종료</label>
            <div class="dt-field">
              <input type="date" class="input dt-date" id="evEndDate" />
              <div class="dt-time" id="evEndTime">
                <button type="button" class="dt-btn" data-inp="evEndHour" data-part="h" data-dir="-1" tabindex="-1">‹</button>
                <input class="dt-num" id="evEndHour" list="dlHours" inputmode="numeric" maxlength="2" />
                <button type="button" class="dt-btn" data-inp="evEndHour" data-part="h" data-dir="1" tabindex="-1">›</button>
                <span class="dt-colon">:</span>
                <button type="button" class="dt-btn" data-inp="evEndMin" data-part="m" data-dir="-1" tabindex="-1">‹</button>
                <input class="dt-num" id="evEndMin" list="dlMins" inputmode="numeric" maxlength="2" />
                <button type="button" class="dt-btn" data-inp="evEndMin" data-part="m" data-dir="1" tabindex="-1">›</button>
              </div>
            </div>
          </div>
        </div>
        <datalist id="dlHours"></datalist>
        <datalist id="dlMins"></datalist>
        <div class="row two">
          <div>
            <label data-i18n="f_calendar">캘린더</label>
            <select id="evCalendar" class="input"></select>
          </div>
          <div>
            <label data-i18n="f_reminder">알림</label>
            <select id="evReminder" class="input">
              <option value="" data-i18n="rem_none">없음</option>
              <option value="0" data-i18n="rem_0">시작 시각</option>
              <option value="5" data-i18n="rem_5">5분 전</option>
              <option value="10" data-i18n="rem_10">10분 전</option>
              <option value="30" data-i18n="rem_30">30분 전</option>
              <option value="60" data-i18n="rem_60">1시간 전</option>
              <option value="1440" data-i18n="rem_1440">1일 전</option>
            </select>
          </div>
        </div>
        <input type="text" id="evLocation" class="input" data-i18n-ph="f_location" placeholder="장소" />
        <textarea id="evDescription" class="input" rows="3" data-i18n-ph="f_description" placeholder="설명"></textarea>
        <div class="row">
          <label data-i18n="f_color">색상</label>
          <div class="ev-color-picker" id="evColorSwatches"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button id="btnDeleteEvent" class="btn btn-danger" style="margin-right:auto" data-i18n="btn_delete">삭제</button>
        <button class="btn btn-ghost" data-close data-i18n="btn_cancel">취소</button>
        <button id="btnSaveEvent" class="btn btn-primary" data-i18n="btn_save">저장</button>
      </div>
    </div>
  </div>

  <!-- Google modal -->
  <div id="googleModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 data-i18n="g_title">Google Calendar 연동</h3>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <div class="modal-body" id="googleBody"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close data-i18n="btn_close">닫기</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 data-i18n="set_title">설정</h3>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <div class="modal-body">
        <div class="row two">
          <div><label data-i18n="set_weekStart">주 시작 요일</label>
            <select id="setWeekStart" class="input">
              <option value="0" data-i18n="sun">일요일</option>
              <option value="1" data-i18n="mon">월요일</option>
            </select>
          </div>
          <div><label data-i18n="set_defaultView">기본 보기</label>
            <select id="setDefaultView" class="input">
              <option value="month" data-i18n="view_month">월</option>
              <option value="week" data-i18n="view_week">주</option>
              <option value="day" data-i18n="view_day">일</option>
              <option value="agenda" data-i18n="view_agenda">목록</option>
            </select>
          </div>
        </div>
        <div class="row two">
          <div><label data-i18n="set_language">언어</label>
            <select id="setLanguage" class="input">
              <option value="ko">한국어</option>
              <option value="en">English</option>
            </select>
          </div>
          <div><label data-i18n="set_theme">테마</label>
            <select id="setTheme" class="input">
              <option value="dark" data-i18n="theme_dark">다크</option>
              <option value="light" data-i18n="theme_light">라이트</option>
            </select>
          </div>
        </div>
        <div class="row">
          <label><span data-i18n="set_bgOpacity">배경 투명도</span> — <span id="bgOpacityVal">100%</span></label>
          <input type="range" id="setBgOpacity" min="40" max="100" step="1" value="100" class="range" />
        </div>
        <div class="row two" style="margin-top:12px">
          <button id="btnImportIcs" class="btn btn-outline" data-i18n="importIcs">📥 .ics 가져오기</button>
          <button id="btnExportIcs" class="btn btn-outline" data-i18n="exportIcs">📤 .ics 로 내보내기</button>
        </div>
        <input type="file" id="icsFileInput" accept=".ics,text/calendar" style="display:none" />

        <div class="sub-section">
          <label data-i18n="sub_title">캘린더 구독 (ICS URL)</label>
          <div class="sub-add">
            <input type="text" id="subUrl" class="input" data-i18n-ph="sub_urlPh" placeholder="ICS URL" />
            <input type="text" id="subName" class="input" data-i18n-ph="sub_namePh" placeholder="이름(선택)" />
            <button id="btnAddSub" class="btn btn-outline" data-i18n="sub_add">추가</button>
          </div>
          <ul id="subList" class="sub-list"></ul>
        </div>

        <p class="muted" id="aboutLine" style="margin-top:16px"></p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close data-i18n="btn_cancel">취소</button>
        <button id="btnSaveSettings" class="btn btn-primary" data-i18n="btn_save">저장</button>
      </div>
    </div>
  </div>

  <!-- Add / edit calendar modal -->
  <div id="calendarModal" class="modal hidden">
    <div class="modal-card" style="width:min(400px,92vw)">
      <div class="modal-head">
        <h3 id="calendarModalTitle" data-i18n="addCalendar">캘린더 추가</h3>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label data-i18n="cal_name">이름</label>
          <input type="text" id="calName" class="input" data-i18n-ph="cal_namePh" placeholder="캘린더 이름" />
        </div>
        <div>
          <label data-i18n="cal_color">색상</label>
          <div class="color-swatches" id="calSwatches"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button id="btnDeleteCalendar" class="btn btn-danger" style="margin-right:auto" data-i18n="btn_delete">삭제</button>
        <button class="btn btn-ghost" data-close data-i18n="btn_cancel">취소</button>
        <button id="btnSaveCalendar" class="btn btn-primary" data-i18n="btn_save">저장</button>
      </div>
    </div>
  </div>

  <!-- About modal -->
  <div id="aboutModal" class="modal hidden">
    <div class="modal-card" style="width:min(420px,92vw)">
      <div class="modal-head">
        <h3 data-i18n="about_title">정보</h3>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <div class="modal-body" style="text-align:center; align-items:center">
        <img src="/assets/icon.png" alt="" style="width:80px;height:80px" />
        <h2 id="aboutName" style="margin:6px 0 0">MyCalendar</h2>
        <p class="muted" id="aboutVersion" style="margin:2px 0"></p>
        <p class="muted" id="aboutDesc" style="margin:8px 0"></p>
        <p class="muted" id="aboutCopyright" style="margin-top:14px"></p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" data-close data-i18n="btn_close">닫기</button>
      </div>
    </div>
  </div>

  <div id="contextMenu" class="context-menu hidden"></div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
