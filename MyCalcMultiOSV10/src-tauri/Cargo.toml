[package]
name = "mycalc"
version = "10.0.0"
description = "MyCalc 10.0"
authors = ["MyCalc"]
edition = "2021"

[lib]
name = "mycalc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The calculator window is created by these crates. Left unoptimized, a debug
# launch spends a few seconds before anything is on screen. The app crate
# itself stays unoptimized, so changes here still rebuild quickly.
[profile.dev.package."*"]
opt-level = 1
debug-assertions = false

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
muda = "0.20"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Graphics_Printing"] }
