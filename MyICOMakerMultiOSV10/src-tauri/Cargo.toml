[package]
name = "myicomaker"
version = "1.0.1"
description = "MyICOMaker — icon designer (ico / icns / png / svg)"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "myicomaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

# Printing straight to a chosen printer (the same versions as Tauri's own WebView2).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

# Installed app: smaller and faster. Debug builds and tests are unaffected.
[profile.release]
lto = true
codegen-units = 1
strip = true
