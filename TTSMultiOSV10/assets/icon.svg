<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="128" y1="16" x2="128" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F9FF"/>
      <stop offset="1" stop-color="#B8DFFE"/>
    </linearGradient>
    <linearGradient id="gloss" x1="128" y1="16" x2="128" y2="136" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.90"/>
      <stop offset="1" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="txt" x1="72" y1="80" x2="200" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B3E70"/>
      <stop offset="1" stop-color="#1A6DB5"/>
    </linearGradient>
    <linearGradient id="wave" x1="76" y1="190" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A6DB5"/>
      <stop offset="1" stop-color="#3A9ED8"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="16" y="16" width="224" height="224" rx="52"/>
    </clipPath>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4A9CCE" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Soft drop shadow -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="#7AC4E8" opacity="0.22" filter="url(#shadow)"/>

  <!-- Main background -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>

  <!-- Glossy sheen — top ellipse clipped to shape -->
  <g clip-path="url(#clip)">
    <ellipse cx="128" cy="52" rx="148" ry="90" fill="url(#gloss)"/>
  </g>

  <!-- Inner glass border -->
  <rect x="19" y="19" width="218" height="218" rx="49" fill="none"
        stroke="white" stroke-width="3" stroke-opacity="0.88"/>

  <!-- TTS lettering -->
  <text x="128" y="154"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="98"
        text-anchor="middle"
        fill="url(#txt)"
        letter-spacing="-2">TTS</text>

  <!-- Sound wave arc -->
  <path d="M76 188 Q102 172 128 188 Q154 204 180 188"
        stroke="url(#wave)" stroke-width="7.5" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
