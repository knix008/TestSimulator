<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2ac8b4"/>
      <stop offset="1" stop-color="#0b5048"/>
    </linearGradient>
    <linearGradient id="gloss" x1="14" y1="14" x2="140" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="14" y="14" width="228" height="228" rx="52"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="14" y="14" width="228" height="228" rx="52" fill="url(#bg)"/>

  <!-- Upper-left gloss -->
  <g clip-path="url(#clip)">
    <ellipse cx="60" cy="60" rx="160" ry="120" fill="url(#gloss)"/>
  </g>

  <!-- Inner border -->
  <rect x="17" y="17" width="222" height="222" rx="50" fill="none"
        stroke="white" stroke-width="2" stroke-opacity="0.30"/>

  <!-- TTS text -->
  <text x="128" y="155"
        font-family="'Arial Black', 'Impact', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="100"
        text-anchor="middle"
        fill="white"
        fill-opacity="0.95"
        letter-spacing="-2">TTS</text>

  <!-- Sound wave arc -->
  <path d="M62 195 Q95 178 128 195 Q161 212 194 195"
        stroke="white" stroke-width="6.5" stroke-linecap="round"
        fill="none" opacity="0.55"/>
</svg>
