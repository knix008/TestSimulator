<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- MyMeeting .mtg document icon: a minutes sheet with a folded corner,
       an indigo header, a checklist and a small participants accent. -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3cbf8"/>
      <stop offset="1" stop-color="#a3aeee"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5468e6"/>
      <stop offset="1" stop-color="#232a63"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#161c47" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Page body with a folded top-right corner -->
  <g filter="url(#ds)">
    <path d="M232 96
             h404 l156 156 v676 a40 40 0 0 1 -40 40 H232 a40 40 0 0 1 -40 -40
             V136 a40 40 0 0 1 40 -40 z" fill="url(#sheet)"/>
    <!-- folded corner -->
    <path d="M636 96 l156 156 H676 a40 40 0 0 1 -40 -40 z" fill="url(#fold)"/>
  </g>

  <!-- Header bar (meeting title) -->
  <rect x="286" y="300" width="300" height="40" rx="20" fill="url(#hdr)"/>
  <rect x="286" y="360" width="452" height="20" rx="10" fill="#c0c8ee"/>

  <!-- Checklist rows -->
  <g>
    <circle cx="308" cy="452" r="24" fill="#5468e6"/>
    <path d="M295 452 l10 10 l16 -18" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="348" y="440" width="390" height="24" rx="12" fill="#d3daf9"/>

    <circle cx="308" cy="532" r="24" fill="#5468e6"/>
    <path d="M295 532 l10 10 l16 -18" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="348" y="520" width="330" height="24" rx="12" fill="#d3daf9"/>

    <circle cx="308" cy="612" r="24" fill="#9aa6ea"/>
    <rect x="348" y="600" width="360" height="24" rx="12" fill="#e2e7ff"/>
  </g>

  <!-- Small participants accent (a meeting) -->
  <g transform="translate(0 40)">
    <circle cx="360" cy="720" r="40" fill="#e7ebff"/>
    <circle cx="360" cy="706" r="17" fill="#5468e6"/>
    <path d="M334 742 a26 22 0 0 1 52 0 z" fill="#5468e6"/>

    <circle cx="470" cy="736" r="48" fill="#ffffff" stroke="#e7ebff" stroke-width="6"/>
    <circle cx="470" cy="720" r="20" fill="#232a63"/>
    <path d="M439 758 a31 26 0 0 1 62 0 z" fill="#232a63"/>

    <circle cx="580" cy="720" r="40" fill="#e7ebff"/>
    <circle cx="580" cy="706" r="17" fill="#5468e6"/>
    <path d="M554 742 a26 22 0 0 1 52 0 z" fill="#5468e6"/>
  </g>
</svg>
