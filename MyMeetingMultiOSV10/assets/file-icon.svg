<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- MyMeeting .mtg document icon.
       The page is filled with the app's indigo so the file reads as "ours" even
       at 16px in a file list — a mostly white sheet there is indistinguishable
       from an unregistered file type. The marks inside are white and few, so
       they survive being scaled down to a handful of pixels. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7ef0"/>
      <stop offset="0.55" stop-color="#4557d8"/>
      <stop offset="1" stop-color="#28306e"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#b9c2f6"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#161c47" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Page body with a folded top-right corner -->
  <g filter="url(#ds)">
    <path d="M232 96
             h404 l156 156 v676 a40 40 0 0 1 -40 40 H232 a40 40 0 0 1 -40 -40
             V136 a40 40 0 0 1 40 -40 z" fill="url(#page)"/>
    <!-- folded corner: light, so the page silhouette still reads as a document -->
    <path d="M636 96 l156 156 H676 a40 40 0 0 1 -40 -40 z" fill="url(#fold)"/>
  </g>

  <!-- Title bar of the minutes -->
  <rect x="286" y="330" width="286" height="46" rx="23" fill="#ffffff"/>

  <!-- Checklist: two ticked rows and one open row. Chunky on purpose. -->
  <g>
    <circle cx="312" cy="474" r="30" fill="#ffffff"/>
    <path d="M297 474 l11 12 l19 -22" fill="none" stroke="#3543b8" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="362" y="458" width="376" height="32" rx="16" fill="#ffffff" fill-opacity="0.92"/>

    <circle cx="312" cy="580" r="30" fill="#ffffff"/>
    <path d="M297 580 l11 12 l19 -22" fill="none" stroke="#3543b8" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="362" y="564" width="306" height="32" rx="16" fill="#ffffff" fill-opacity="0.92"/>

    <circle cx="312" cy="686" r="30" fill="none" stroke="#ffffff" stroke-width="11" stroke-opacity="0.75"/>
    <rect x="362" y="670" width="340" height="32" rx="16" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- Participants accent: the same three heads as the app icon, in white -->
  <g transform="translate(0 66)">
    <circle cx="380" cy="762" r="34" fill="#ffffff" fill-opacity="0.55"/>
    <circle cx="380" cy="751" r="14" fill="#2b3382"/>
    <path d="M358 781 a22 19 0 0 1 44 0 z" fill="#2b3382"/>

    <circle cx="492" cy="774" r="42" fill="#ffffff"/>
    <circle cx="492" cy="761" r="17" fill="#2b3382"/>
    <path d="M465 806 a27 23 0 0 1 54 0 z" fill="#2b3382"/>

    <circle cx="604" cy="762" r="34" fill="#ffffff" fill-opacity="0.55"/>
    <circle cx="604" cy="751" r="14" fill="#2b3382"/>
    <path d="M582 781 a22 19 0 0 1 44 0 z" fill="#2b3382"/>
  </g>
</svg>
