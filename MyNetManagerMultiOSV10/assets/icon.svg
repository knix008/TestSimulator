<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Tile: a deep blue-violet gradient face over a darker extruded side. -->
    <linearGradient id="face" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4fb3ff"/>
      <stop offset="0.45" stop-color="#2b6cf6"/>
      <stop offset="1" stop-color="#3a2bb8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2c8f"/>
      <stop offset="1" stop-color="#120f52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Glass panel. -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Shaded spheres (nodes). -->
    <radialGradient id="sphereA" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#9ff3ff"/>
      <stop offset="0.7" stop-color="#18b6e8"/>
      <stop offset="1" stop-color="#0a5f9c"/>
    </radialGradient>
    <radialGradient id="sphereB" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ffe3a3"/>
      <stop offset="0.7" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#b85a00"/>
    </radialGradient>
    <radialGradient id="sphereC" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#c8ffd9"/>
      <stop offset="0.7" stop-color="#2fd17a"/>
      <stop offset="1" stop-color="#127a45"/>
    </radialGradient>
    <radialGradient id="sphereD" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ffc4e6"/>
      <stop offset="0.7" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#a3125a"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f6ff"/>
      <stop offset="0.5" stop-color="#9cc8ff"/>
      <stop offset="1" stop-color="#5a7fe0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ef2c4"/>
      <stop offset="0.5" stop-color="#8af7ff"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1e5e"/>
      <stop offset="1" stop-color="#071238"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#0b0b3a" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#06103a" flood-opacity="0.45"/>
    </filter>
    <filter id="neon" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip"><rect x="72" y="56" width="880" height="880" rx="210"/></clipPath>
  </defs>

  <!-- Extruded tile: side, face, top light, rim. -->
  <g filter="url(#drop)">
    <rect x="72" y="92" width="880" height="880" rx="210" fill="url(#side)"/>
    <rect x="72" y="56" width="880" height="880" rx="210" fill="url(#face)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect x="72" y="56" width="880" height="880" fill="url(#glow)"/>
    <circle cx="840" cy="880" r="300" fill="#7a3cff" opacity="0.28"/>
    <circle cx="160" cy="820" r="220" fill="#00d4ff" opacity="0.14"/>
  </g>
  <rect x="74" y="58" width="876" height="876" rx="208" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Network: shaded tubes, then spheres. -->
  <g filter="url(#soft)" stroke-linecap="round">
    <g stroke="url(#tube)" stroke-width="26">
      <line x1="300" y1="300" x2="512" y2="430"/>
      <line x1="724" y1="300" x2="512" y2="430"/>
      <line x1="300" y1="300" x2="724" y2="300"/>
      <line x1="512" y1="430" x2="512" y2="560"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="7">
      <line x1="300" y1="294" x2="512" y2="424"/>
      <line x1="724" y1="294" x2="512" y2="424"/>
      <line x1="300" y1="294" x2="724" y2="294"/>
    </g>
  </g>
  <g filter="url(#soft)">
    <circle cx="300" cy="300" r="74" fill="url(#sphereA)"/>
    <circle cx="724" cy="300" r="74" fill="url(#sphereB)"/>
    <circle cx="512" cy="430" r="92" fill="url(#sphereC)"/>
    <circle cx="512" cy="560" r="34" fill="url(#sphereD)"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="276" cy="270" rx="26" ry="15" transform="rotate(-30 276 270)"/>
    <ellipse cx="700" cy="270" rx="26" ry="15" transform="rotate(-30 700 270)"/>
    <ellipse cx="482" cy="392" rx="32" ry="18" transform="rotate(-30 482 392)"/>
  </g>

  <!-- Floating glass panel with a glowing packet waveform. -->
  <g filter="url(#drop)">
    <rect x="168" y="600" width="688" height="268" rx="64" fill="url(#screen)" opacity="0.92"/>
  </g>
  <rect x="168" y="600" width="688" height="268" rx="64" fill="url(#glass)"/>
  <rect x="170" y="602" width="684" height="264" rx="62" fill="none" stroke="url(#glassEdge)" stroke-width="4"/>
  <g filter="url(#neon)">
    <polyline points="214,740 300,740 340,668 392,812 446,700 498,772 546,650 600,808 652,716 700,740 810,740" fill="none" stroke="url(#wave)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <polyline points="214,736 300,736 340,664 392,808 446,696 498,768 546,646 600,804 652,712 700,736 810,736" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M206 616 h612 a46 46 0 0 1 22 6 c-160 40 -420 46 -650 20 a46 46 0 0 1 16 -26z" fill="#ffffff" opacity="0.16"/>
</svg>
