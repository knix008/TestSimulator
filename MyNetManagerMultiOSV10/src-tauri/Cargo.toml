[package]
name = "mynetmanager"
version = "1.0.0"
description = "Cross-platform network protocol analyzer (Wireshark style)"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "mynetmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
arboard = { version = "3.6", default-features = false }
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Live capture: libpcap / Npcap loaded at run time (src/capture.rs), no SDK at build time.
libloading = "0.8"
# AVIF pictures (the web view has no AV1 encoder): pure Rust, no assembler needed.
ravif = { version = "0.13", default-features = false, features = ["threading"] }

# Printing straight to a printer (the same versions as Tauri's own WebView2).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"

# Installed app: smaller and faster (whole-program optimisation, no debug symbols). Debug builds and tests are unaffected.
[profile.release]
lto = true
codegen-units = 1
strip = true
