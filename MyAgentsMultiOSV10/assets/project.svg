  <circle cx="515" cy="632" r="11" fill="#fff"/><circle cx="555" cy="632" r="11" fill="#fff"/>
  <rect x="680" y="470" width="90" height="100" rx="24" fill="#2f9e44"/>
  <text x="500" y="830" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="700" fill="#6741d9" text-anchor="middle">AGENT</text>
