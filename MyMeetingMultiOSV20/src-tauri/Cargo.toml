[package]
name = "mymeeting"
version = "2.0.0"
description = "MyMeeting - Tauri shell"
authors = ["SHKWON <knix008@naver.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# The installed font families for the editor's font list: WebKit has no queryLocalFonts.
fontdb = "0.23"
# Pictures the WebView cannot show (TIFF, TGA, PNM, QOI …) become PNG when they are put in the minutes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "tga", "pnm", "qoi", "webp", "dds", "hdr"] }
base64 = "0.22"
# Saving minutes to a database: MySQL/MariaDB, PostgreSQL and SQLite through sqlx, MSSQL through tiberius.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "mysql", "postgres", "sqlite"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "1", features = ["net"] }
tokio-util = { version = "0.7", features = ["compat"] }

# The system's print dialog: WebView2's default is its own preview inside the window.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Security"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
