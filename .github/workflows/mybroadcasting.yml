# MyBroadcasting: builds on Windows, macOS and Linux (what cannot be checked from one Windows PC).
# Runs when MyBroadcastingMultiOSV10/ changes, or by hand (Actions › MyBroadcasting builds › Run workflow).
# Each job: the web build, the Rust unit tests and a desktop build of the app (no installer).
name: MyBroadcasting builds

on:
  workflow_dispatch:
  push:
    paths: ['MyBroadcastingMultiOSV10/**', '.github/workflows/mybroadcasting.yml']
  pull_request:
    paths: ['MyBroadcastingMultiOSV10/**', '.github/workflows/mybroadcasting.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: MyBroadcastingMultiOSV10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MyBroadcastingMultiOSV10/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries (WebKitGTK, GTK, D-Bus)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - run: npm ci
      - name: Web build
        run: npm run build:web
      - name: Virtual camera device (Windows)
        if: runner.os == 'Windows'
        run: npm run build:vcam
      - name: Rust unit tests
        run: cargo test --lib --locked --manifest-path src-tauri/Cargo.toml
      - name: Desktop app build (no installer)
        run: npx tauri build --no-bundle
