<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- TTS Multi OS: a speech bubble that speaks — 3D: an extruded, lit tile with a bevelled rim,
       an extruded bubble and cylinder-shaded sound bars casting soft shadows. -->
  <defs>
    <!-- tile: lit from the top left -->
    <linearGradient id="tileFace" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7b6cff"/>
      <stop offset="0.45" stop-color="#4a6df5"/>
      <stop offset="1" stop-color="#11a8c4"/>
    </linearGradient>
    <linearGradient id="tileSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f9c"/>
      <stop offset="1" stop-color="#0b5f78"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="0.28" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#001030" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- bubble -->
    <linearGradient id="bubbleFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#d9e2fb"/>
    </linearGradient>
    <linearGradient id="bubbleSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b6e6"/>
      <stop offset="1" stop-color="#7f8fcf"/>
    </linearGradient>
    <!-- cylinder shading for the bars: dark edges, a bright stripe left of the middle -->
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="ground" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="tileClip"><rect x="56" y="40" width="912" height="900" rx="210"/></clipPath>
  </defs>

  <!-- ground shadow and the extruded tile -->
  <ellipse cx="512" cy="968" rx="390" ry="34" fill="#0a1035" opacity="0.45" filter="url(#ground)"/>
  <rect x="56" y="78" width="912" height="900" rx="210" fill="url(#tileSide)"/>
  <rect x="56" y="40" width="912" height="900" rx="210" fill="url(#tileFace)"/>
  <rect x="56" y="40" width="912" height="900" rx="210" fill="url(#tileLight)"/>
  <g clip-path="url(#tileClip)">
    <path d="M56 40h912v330c-200 70-560 90-912 10z" fill="url(#gloss)"/>
  </g>
  <rect x="64" y="48" width="896" height="884" rx="202" fill="none" stroke="url(#rim)" stroke-width="16"/>

  <!-- bubble: shadow, side (extrusion), face -->
  <path filter="url(#soft)" fill="#0b1550" opacity="0.38" transform="translate(14 46)"
        d="M262 200h500a110 110 0 0 1 110 110v290a110 110 0 0 1-110 110H500L338 834a14 14 0 0 1-22-13l12-111h-66a110 110 0 0 1-110-110V310a110 110 0 0 1 110-110z"/>
  <path fill="url(#bubbleSide)" transform="translate(0 30)"
        d="M262 200h500a110 110 0 0 1 110 110v290a110 110 0 0 1-110 110H500L338 834a14 14 0 0 1-22-13l12-111h-66a110 110 0 0 1-110-110V310a110 110 0 0 1 110-110z"/>
  <path fill="url(#bubbleFace)"
        d="M262 200h500a110 110 0 0 1 110 110v290a110 110 0 0 1-110 110H500L338 834a14 14 0 0 1-22-13l12-111h-66a110 110 0 0 1-110-110V310a110 110 0 0 1 110-110z"/>
  <path fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.9" stroke-linecap="round"
        d="M210 300a64 64 0 0 1 60-62h480"/>

  <!-- sound bars: shadow on the bubble, colour, cylinder shading, highlight -->
  <g>
    <g fill="#24306e" opacity="0.22" filter="url(#soft)" transform="translate(10 16)">
      <rect x="258" y="398" width="64" height="104" rx="32"/>
      <rect x="366" y="322" width="64" height="256" rx="32"/>
      <rect x="474" y="268" width="64" height="364" rx="32"/>
      <rect x="582" y="340" width="64" height="220" rx="32"/>
      <rect x="690" y="392" width="64" height="116" rx="32"/>
    </g>
    <rect x="258" y="398" width="64" height="104" rx="32" fill="#14b8c8"/>
    <rect x="366" y="322" width="64" height="256" rx="32" fill="#3a6cf0"/>
    <rect x="474" y="268" width="64" height="364" rx="32" fill="#7c4dff"/>
    <rect x="582" y="340" width="64" height="220" rx="32" fill="#e8458b"/>
    <rect x="690" y="392" width="64" height="116" rx="32" fill="#ff8a3d"/>
    <g fill="url(#cyl)">
      <rect x="258" y="398" width="64" height="104" rx="32"/>
      <rect x="366" y="322" width="64" height="256" rx="32"/>
      <rect x="474" y="268" width="64" height="364" rx="32"/>
      <rect x="582" y="340" width="64" height="220" rx="32"/>
      <rect x="690" y="392" width="64" height="116" rx="32"/>
    </g>
    <g fill="#ffffff" opacity="0.7">
      <rect x="273" y="414" width="10" height="34" rx="5"/>
      <rect x="381" y="340" width="10" height="70" rx="5"/>
      <rect x="489" y="286" width="10" height="96" rx="5"/>
      <rect x="597" y="358" width="10" height="62" rx="5"/>
      <rect x="705" y="408" width="10" height="34" rx="5"/>
    </g>
  </g>
</svg>
