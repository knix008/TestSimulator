<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <!-- Image2Text — thick 3D squircle, lit from the top-left, same construction
       as the other MultiOS app icons. A photo card and a text card sit in the well. -->
  <defs>
    <linearGradient id="face" x1="0.08" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.2" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#0891b2"/>
      <stop offset="0.78" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="0.2" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.22" cy="0.14" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="sideB" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#115e59"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="well" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#042f2e" stop-opacity="0.05"/>
      <stop offset="0.55" stop-color="#022c22" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="tileSh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#022c22" flood-opacity="0.5"/>
    </filter>
    <filter id="cardSh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="3" dy="8" stdDeviation="5" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>
    <clipPath id="faceClip"><rect x="46" y="30" width="396" height="396" rx="92"/></clipPath>
    <clipPath id="imgClip"><rect x="0" y="0" width="132" height="168" rx="14"/></clipPath>
  </defs>

  <ellipse cx="268" cy="486" rx="176" ry="22" fill="#022c22" fill-opacity="0.42" filter="url(#ground)"/>

  <rect x="78" y="78" width="396" height="396" rx="92" fill="#022c22"/>
  <rect x="70" y="66" width="396" height="396" rx="92" fill="url(#sideB)"/>
  <rect x="58" y="50" width="396" height="396" rx="92" fill="url(#sideR)"/>
  <rect x="52" y="40" width="396" height="396" rx="92" fill="#0e7490"/>

  <g filter="url(#tileSh)">
    <rect x="46" y="30" width="396" height="396" rx="92" fill="url(#face)"/>
  </g>
  <g clip-path="url(#faceClip)">
    <rect x="46" y="30" width="396" height="150" fill="url(#faceTop)"/>
    <rect x="46" y="30" width="396" height="396" fill="url(#spec)"/>
    <ellipse cx="148" cy="72" rx="200" ry="84" fill="#ffffff" fill-opacity="0.24"/>
    <ellipse cx="392" cy="392" rx="200" ry="110" fill="#022c22" fill-opacity="0.28"/>
    <rect x="86" y="86" width="316" height="284" rx="52" fill="url(#well)"/>
    <rect x="90" y="90" width="308" height="276" rx="48" fill="none" stroke="#022c22" stroke-opacity="0.28" stroke-width="3"/>
    <rect x="88" y="88" width="308" height="42" rx="20" fill="#ffffff" fill-opacity="0.12"/>
  </g>
  <rect x="49" y="33" width="390" height="390" rx="89" fill="none" stroke="url(#bevel)" stroke-width="6"/>
  <rect x="46" y="30" width="396" height="396" rx="92" fill="none" stroke="#022c22" stroke-opacity="0.28" stroke-width="2"/>

  <g transform="translate(118 108) rotate(-12)" filter="url(#cardSh)">
    <rect x="8" y="10" width="132" height="168" rx="14" fill="#155e75"/>
    <g clip-path="url(#imgClip)">
      <rect width="132" height="168" fill="url(#sky)"/>
      <circle cx="100" cy="36" r="16" fill="#fde68a"/>
      <circle cx="100" cy="36" r="10" fill="#fbbf24"/>
      <path d="M0 118 L36 78 L62 104 L88 82 L132 124 L132 168 L0 168 Z" fill="#16a34a"/>
      <path d="M0 136 L28 108 L58 132 L86 112 L132 146 L132 168 L0 168 Z" fill="#15803d"/>
    </g>
    <rect width="132" height="168" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="4"/>
  </g>

  <g transform="translate(214 118) rotate(8)" filter="url(#cardSh)">
    <rect x="8" y="12" width="168" height="188" rx="14" fill="#334155"/>
    <rect width="168" height="188" rx="14" fill="url(#page)"/>
    <rect x="16" y="22" width="136" height="14" rx="4" fill="#0f172a"/>
    <rect x="16" y="44" width="104" height="14" rx="4" fill="#155e75"/>
    <rect x="16" y="66" width="128" height="14" rx="4" fill="#0f172a"/>
    <rect x="16" y="88" width="84" height="14" rx="4" fill="#0e7490"/>
    <rect x="16" y="110" width="120" height="14" rx="4" fill="#0f172a"/>
    <rect x="16" y="132" width="96" height="14" rx="4" fill="#155e75"/>
    <rect x="16" y="154" width="132" height="14" rx="4" fill="#0f172a"/>
    <rect width="168" height="188" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
  </g>
</svg>
