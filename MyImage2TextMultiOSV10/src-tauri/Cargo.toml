[package]
name = "image2text"
version = "2.0.0"
authors = ["SHKWON <knix008@naver.com>"]
description = "이미지를 원본과 같은 비율의 텍스트로 변환합니다"
edition = "2021"
rust-version = "1.77"

[lib]
name = "image2text_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
