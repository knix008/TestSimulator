<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- background: light from the top-left, dark towards the bottom-right -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6fd6"/>
      <stop offset="0.45" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0a1230"/>
    </linearGradient>
    <!-- bevel: bright edge on the top-left, dark edge on the bottom-right -->
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <!-- glossy reflection over the upper part -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- the slice: a lit sphere with the highlight up-left -->
    <radialGradient id="scan" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#bae6fd"/>
      <stop offset="0.6" stop-color="#38bdf8"/>
      <stop offset="0.85" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#083752"/>
    </radialGradient>
    <radialGradient id="inner" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#041e2c"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5d8f3"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="10" y="10" width="236" height="236" rx="54"/></clipPath>
  </defs>

  <!-- body -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bg)"/>
  <!-- inner shading at the bottom-right (depth) -->
  <g clip-path="url(#clip)">
    <ellipse cx="200" cy="230" rx="180" ry="120" fill="#000" opacity="0.28"/>
    <!-- top-left reflection -->
    <path d="M10 10h236v70c-60 30-140 40-236 20z" fill="url(#gloss)"/>
    <ellipse cx="64" cy="48" rx="60" ry="28" fill="#fff" opacity="0.18"/>
  </g>
  <!-- bevelled edge -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="none" stroke="url(#bevel)" stroke-width="4"/>
  <rect x="10" y="10" width="236" height="236" rx="54" fill="none" stroke="#0b1024" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- axial "slice" sphere -->
  <g filter="url(#shadow)">
    <ellipse cx="128" cy="116" rx="76" ry="64" fill="url(#scan)"/>
  </g>
  <ellipse cx="128" cy="116" rx="76" ry="64" fill="none" stroke="url(#chrome)" stroke-width="4"/>
  <ellipse cx="128" cy="119" rx="50" ry="40" fill="url(#inner)"/>
  <ellipse cx="110" cy="114" rx="11" ry="15" fill="url(#eye)"/>
  <ellipse cx="146" cy="114" rx="11" ry="15" fill="url(#eye)"/>
  <!-- specular glint on the sphere -->
  <ellipse cx="98" cy="78" rx="26" ry="12" fill="#fff" opacity="0.55" transform="rotate(-20 98 78)"/>

  <!-- crosshair ticks (gold, with a soft shadow) -->
  <g filter="url(#softShadow)" stroke="url(#gold)" stroke-width="6" stroke-linecap="round">
    <path d="M128 36v20M128 176v20M36 116h20M200 116h20"/>
  </g>

  <!-- label -->
  <text x="128" y="234" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#000" fill-opacity="0.45" letter-spacing="2" transform="translate(0 2)">DCM</text>
  <text x="128" y="234" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="url(#chrome)" letter-spacing="2">DCM</text>
</svg>
