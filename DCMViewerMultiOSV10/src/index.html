      <span class="tb-mini-sep"></span>
      <button class="tb-btn toggle" data-action="toggle" data-key="ruler" data-i18n-title="view.ruler"><svg viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="6" rx="1"/><path d="M6 9v3M10 9v2M14 9v3M18 9v2"/></svg></button>
      <button class="tb-btn toggle" data-action="toggle" data-key="grid" data-i18n-title="view.grid"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
      <button class="tb-btn" data-action="rotate-left" data-i18n-title="view.rotateLeft"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button class="tb-btn" data-action="rotate-right" data-i18n-title="view.rotateRight"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
      <button class="tb-btn" data-action="flip-h" data-i18n-title="view.flipH"><svg viewBox="0 0 24 24"><path d="M12 3v18M4 8l5 4-5 4zM20 8l-5 4 5 4z"/></svg></button>
      <button class="tb-btn" data-action="flip-v" data-i18n-title="view.flipV"><svg viewBox="0 0 24 24"><path d="M3 12h18M8 4l4 5 4-5zM8 20l4-5 4 5z"/></svg></button>
      <button class="tb-btn toggle" data-action="toggle" data-key="invert" data-i18n-title="view.invert"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 4l16 16" /><path d="M20 4v16H4z" fill="currentColor"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn" data-action="mpr" data-i18n-title="tools.mpr"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><path d="M13 17h8M17 13v8"/></svg></button>
      <button class="tb-btn" data-action="anonymize" data-i18n-title="tools.anonymize"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/><path d="M3 3l18 18" stroke-opacity="0.6"/></svg></button>
      <button class="tb-btn" data-action="export-webm" data-i18n-title="file.exportWebm"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group dicom-only">
      <label class="tb-field" data-i18n-title="tb.preset"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/></svg><select id="presetSelect"></select></label>
      <label class="tb-field" data-i18n-title="tb.colormap"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M8 8v8M13 8v8M18 8v8" stroke-opacity="0.5"/></svg><select id="colormapSelect"></select></label>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-group export-group">
      <div class="menu tb-menu" id="exportMenu">
        <button class="menu-title tb-btn accent" data-i18n-title="file.export"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span class="caret">▾</span></button>
        <div class="menu-panel right">
          <button data-action="export" data-format="png" data-icon="image">PNG</button>
          <button data-action="export" data-format="jpeg" data-icon="image">JPEG</button>
          <button data-action="export" data-format="webp" data-icon="image">WebP</button>
          <button data-action="export" data-format="bmp" data-icon="image">BMP</button>
          <button data-action="export" data-format="tiff" data-icon="image">TIFF</button>
          <button data-action="export" data-format="gif" data-icon="image">GIF</button>
          <div class="menu-sep"></div>
          <button data-action="export-tiff16" data-icon="tiff" data-i18n="file.exportTiff16">16-bit TIFF (raw pixel values)</button>
          <button data-action="export-frames" data-icon="zip" data-i18n="file.exportAllFrames">All frames as PNG (ZIP)…</button>
          <button data-action="export-gif-anim" data-icon="gif" data-i18n="file.exportGifAnimated">Animated GIF (all frames)…</button>
          <button data-action="export-webm" data-icon="video" data-i18n="file.exportWebm">Cine video (WebM)…</button>
          <div class="menu-sep"></div>
          <button data-action="export-tags" data-format="txt" data-icon="tags" data-i18n="file.exportTags">Export DICOM Tags</button>
          <button data-action="copy-image" data-icon="copy" data-i18n="file.copyImage">Copy Image</button>
        </div>
      </div>
      <button class="tb-btn" data-action="batch" data-i18n-title="file.batch"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="12" height="12" rx="2"/><path d="M8 19h9a2 2 0 0 0 2-2V9"/><path d="M6 11l2 2 4-4"/></svg></button>
    </div>
  </div>

  <!-- ── Workspace ── -->
  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <section class="side-section tree-section" id="treeSection">
        <header class="side-header">
          <span data-i18n="sidebar.folder">Folder</span>
          <span class="drive-bar" id="driveBar" data-i18n-title="sidebar.drives"></span>
          <span class="side-actions">
            <button class="icon-btn" data-action="tree-up" data-i18n-title="sidebar.up">↑</button>
            <button class="icon-btn" data-action="tree-refresh" data-i18n-title="sidebar.refresh">⟳</button>
            <button class="icon-btn" data-action="open-folder" data-i18n-title="sidebar.choose">…</button>
          </span>
        </header>
        <div class="tree-path" id="treePath" title=""><bdi id="treePathText"></bdi></div>
        <div class="tree" id="fileTree" tabindex="0"></div>
      </section>
      <div class="side-splitter" id="sideSplitter"></div>
      <section class="side-section info-section" id="infoSection">
        <header class="side-header tabs">
          <button class="tab active" data-tab="info" data-i18n="sidebar.info">Info</button>
          <button class="tab" data-tab="tags" data-i18n="sidebar.tags">Tags</button>
          <button class="tab" data-tab="histogram" data-i18n="sidebar.histogram">Histogram</button>
          <button class="tab" data-tab="series" data-i18n="sidebar.series">Series</button>
        </header>
        <div class="tab-panel active" id="panel-info"><div class="info-empty" data-i18n="sidebar.noFile">No file opened</div></div>
        <div class="tab-panel" id="panel-tags">
          <div class="tags-toolbar">
            <input id="tagSearch" type="search" data-i18n-placeholder="sidebar.search" placeholder="Search tags…">
            <button class="icon-btn" data-action="copy-tags" data-i18n-title="tags.copy">⧉</button>
          </div>
          <div class="tags-list" id="tagsList"></div>
        </div>
        <div class="tab-panel" id="panel-histogram">
          <canvas id="histCanvas" width="280" height="160"></canvas>
          <div class="hist-info" id="histInfo"></div>
        </div>
        <div class="tab-panel" id="panel-series">
          <div class="series-toolbar"><button class="tb-btn text" data-action="series-scan" data-i18n="series.load">Sort folder as DICOM series</button></div>
          <div class="series-list" id="seriesList"></div>
        </div>
      </section>
    </aside>
    <div class="sidebar-resizer" id="sidebarResizer"></div>

    <main class="viewer-area" id="viewerArea">
      <div class="tab-bar" id="tabBar">
        <div class="tab-scroll" id="tabScroll"></div>
        <div class="tab-nav" id="tabNav">
          <button class="icon-btn" data-action="tabs-scroll" data-dir="-1" data-i18n-title="tabs.scrollLeft">◀</button>
          <button class="icon-btn" data-action="tabs-scroll" data-dir="1" data-i18n-title="tabs.scrollRight">▶</button>
        </div>
      </div>
      <div class="viewport" id="viewport" tabindex="0">
        <canvas id="imageCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <div class="corner tl" id="cornerTL"></div>
        <div class="corner tr" id="cornerTR"></div>
        <div class="corner bl" id="cornerBL"></div>
        <div class="corner br" id="cornerBR"></div>
        <div class="marker top" id="markerTop"></div>
        <div class="marker bottom" id="markerBottom"></div>
        <div class="marker left" id="markerLeft"></div>
        <div class="marker right" id="markerRight"></div>
        <div class="zoom-badge" id="zoomBadge">100%</div>
        <div class="drop-hint" id="dropHint">
          <div class="drop-hint-box">
            <img src="assets/icon.png" alt="">
            <h2 data-i18n="msg.dropTitle">Open a DICOM file</h2>
            <p data-i18n="msg.dropHint">Drop a .dcm file or folder here, or use File → Open.</p>
            <div class="drop-actions">
              <button class="btn primary" data-action="open-file" data-i18n="file.open">Open File…</button>
              <button class="btn" data-action="open-folder" data-i18n="file.openFolder">Open Folder…</button>
            </div>
          </div>
        </div>
        <div class="loading" id="loading"><div class="spinner"></div><span id="loadingText" data-i18n="status.loading">Loading…</span></div>
      </div>
      <div class="frame-bar" id="frameBar">
        <button class="icon-btn" data-action="frame-first" title="Home">⏮</button>
        <button class="icon-btn" data-action="frame-prev" title="↑">◀</button>
        <button class="icon-btn play" id="playBtn" data-action="cine-toggle" title="Space">▶</button>
        <button class="icon-btn" data-action="frame-next" title="↓">▶</button>
        <button class="icon-btn" data-action="frame-last" title="End">⏭</button>
        <input type="range" id="frameSlider" min="0" max="0" value="0">
        <span class="frame-label" id="frameLabel">1 / 1</span>
        <label class="fps"><span data-i18n="cine.fps">fps</span><input id="fpsInput" type="number" min="1" max="120" step="1" value="10"></label>
        <label class="loop"><input type="checkbox" id="loopCheck" checked><span data-i18n="cine.loop">Loop</span></label>
      </div>
      <div class="series-bar" id="seriesBar">
        <button class="icon-btn" data-action="series-prev" title="PgUp">◀</button>
        <input type="range" id="seriesSlider" min="0" max="0" value="0">
        <span class="frame-label" id="seriesLabel"></span>
        <button class="icon-btn" data-action="series-next" title="PgDn">▶</button>
      </div>
    </main>
  </div>

  <!-- ── Status bar ── -->
  <footer class="statusbar">
    <span class="status-path" id="statusPath" data-i18n="status.ready">Ready</span>
    <span class="status-item" id="statusPatient"></span>
    <span class="status-item" id="statusSize"></span>
    <span class="status-item" id="statusWL"></span>
    <span class="status-item" id="statusProbe"></span>
    <span class="status-item" id="statusZoom"></span>
  </footer>
</div>

<!-- ── Context menus ── -->
<div class="ctx-menu" id="ctxViewer">
  <button data-action="open-file" data-icon="open" data-i18n="file.open">Open File…</button>
  <div class="menu-sep"></div>
  <button data-action="fit" data-icon="fit" data-i18n="view.fit">Fit to Window</button>
  <button data-action="actual" data-icon="actual" data-i18n="view.actual">Actual Size (100%)</button>
  <button data-action="reset-view" data-icon="reset" data-i18n="view.resetView">Reset View</button>
  <div class="menu-sep"></div>
  <button data-action="copy-image" data-icon="copy" data-i18n="file.copyImage">Copy Image</button>
  <div class="menu-sub"><button class="menu-sub-title" data-icon="export"><span data-i18n="file.export">Export Image</span><span class="chev">▸</span></button>
    <div class="menu-panel">
      <button data-action="export" data-format="png" data-icon="image">PNG</button>
      <button data-action="export" data-format="jpeg" data-icon="image">JPEG</button>
      <button data-action="export" data-format="webp" data-icon="image">WebP</button>
      <button data-action="export" data-format="bmp" data-icon="image">BMP</button>
      <button data-action="export" data-format="tiff" data-icon="image">TIFF</button>
      <button data-action="export" data-format="gif" data-icon="image">GIF</button>
    </div>
  </div>
  <div class="menu-sep"></div>
  <button data-action="delete-last" data-icon="undo" data-i18n="tools.deleteLast">Delete last measurement</button>
  <button data-action="clear-measurements" data-icon="trash" data-i18n="tools.clear">Clear measurements</button>
  <button data-action="calibrate" data-icon="ruler" data-i18n="tools.calibrate">Calibrate length…</button>
  <button data-action="clear-calibration" data-icon="reset" data-i18n="tools.clearCalibration">Clear calibration</button>
</div>
<div class="ctx-menu" id="ctxTree">
  <button data-action="tree-open" data-icon="open" data-i18n="ctx.open">Open</button>
  <button data-action="tree-show" data-icon="show-folder" class="electron-only" data-i18n="ctx.showInFolder">Show in file manager</button>
  <div class="menu-sep"></div>
  <button data-action="tree-copy" data-icon="copy" class="electron-only"><span data-i18n="ctx.copy">Copy</span><kbd>Ctrl+C</kbd></button>
  <button data-action="tree-cut" data-icon="cut" class="electron-only"><span data-i18n="ctx.cut">Cut</span><kbd>Ctrl+X</kbd></button>
  <button data-action="tree-paste" data-icon="paste" class="electron-only"><span data-i18n="ctx.paste">Paste</span><kbd>Ctrl+V</kbd></button>
  <button data-action="tree-delete" data-icon="trash" class="electron-only"><span data-i18n="ctx.delete">Delete</span><kbd>Del</kbd></button>
  <button data-action="tree-copy-path" data-icon="path" data-i18n="ctx.copyPath">Copy path</button>
  <div class="menu-sep"></div>
  <button data-action="open-folder" data-icon="folder-open" data-i18n="ctx.chooseFolder">Choose folder…</button>
  <button data-action="tree-refresh" data-icon="refresh" data-i18n="sidebar.refresh">Refresh</button>
</div>

<!-- ── Dialog host (browser mode: dialogs render here; Electron opens separate popup windows) ── -->
<div class="modal" id="modalHost"><div class="modal-box" id="modalBox"></div></div>
<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script src="js/dicomDecoder.js"></script>
<script src="js/imageFormats.js"></script>
<script src="js/encoders.js"></script>
<script src="js/platform.js"></script>
<script src="js/themes.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/ko.js"></script>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/fileTree.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
