<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Document sheet with a folded top-right corner -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#ds)">
    <path d="M112 40 h224 l64 64 v304 a24 24 0 0 1 -24 24 H112 a24 24 0 0 1 -24 -24 V64 a24 24 0 0 1 24 -24 z"
          fill="url(#sheet)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- folded corner -->
    <path d="M336 40 l64 64 h-48 a16 16 0 0 1 -16 -16 z" fill="#cbd5e1"/>
  </g>

  <!-- App icon composited onto the lower part of the document -->
  <image href="icons/256x256.png" x="136" y="196" width="240" height="240"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Extension badge -->
  <g>
    <rect x="150" y="120" width="150" height="52" rx="12" fill="#2563eb"/>
    <text x="225" y="156" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif"
          font-size="30" font-weight="700" fill="#ffffff">.mmap</text>
  </g>
</svg>
