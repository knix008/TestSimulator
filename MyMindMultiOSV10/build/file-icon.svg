<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Document sheet with a folded top-right corner. The app icon is composited
       onto the lower half by scripts/gen-icons.mjs. -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#ds)">
    <path d="M112 40 h224 l64 64 v304 a24 24 0 0 1 -24 24 H112 a24 24 0 0 1 -24 -24 V64 a24 24 0 0 1 24 -24 z"
          fill="url(#sheet)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- folded corner -->
    <path d="M336 40 l64 64 h-48 a16 16 0 0 1 -16 -16 z" fill="#cbd5e1"/>
  </g>

  <!-- Extension badge -->
  <rect x="150" y="118" width="164" height="54" rx="14" fill="#3b82f6"/>
  <text x="232" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#ffffff">.mmap</text>
</svg>
