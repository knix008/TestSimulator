<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- My ThinkMap — the same thick 3D squircle as the sibling apps (extruded,
       lit from the top-left) with a recessed well. In the well a small mind
       map: a glowing central topic and four tapered branches ending in
       coloured topics. Rasterized by scripts/generate-icons.mjs (sharp). -->
  <defs>
    <linearGradient id="face" x1="0.08" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="0.22" stop-color="#14b8a6"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="0.82" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="0.18" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.22" cy="0.14" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="sideB" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="well" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#042f2e" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#0f172a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.36"/>
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fef3c7"/>
      <stop offset="0.75" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="nodeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="nodeC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="nodeD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="ground" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="tileSh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="nodeSh" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <clipPath id="faceClip"><rect x="46" y="30" width="396" height="396" rx="92"/></clipPath>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="268" cy="486" rx="176" ry="22" fill="#020617" fill-opacity="0.42" filter="url(#ground)"/>

  <!-- extruded body -->
  <rect x="78" y="78" width="396" height="396" rx="92" fill="#020617"/>
  <rect x="70" y="66" width="396" height="396" rx="92" fill="url(#sideB)"/>
  <rect x="58" y="50" width="396" height="396" rx="92" fill="url(#sideR)"/>
  <rect x="52" y="40" width="396" height="396" rx="92" fill="#0f766e"/>

  <!-- front face -->
  <g filter="url(#tileSh)">
    <rect x="46" y="30" width="396" height="396" rx="92" fill="url(#face)"/>
  </g>
  <g clip-path="url(#faceClip)">
    <rect x="46" y="30" width="396" height="150" fill="url(#faceTop)"/>
    <rect x="46" y="30" width="396" height="396" fill="url(#spec)"/>
    <ellipse cx="150" cy="70" rx="210" ry="88" fill="#ffffff" fill-opacity="0.2"/>
    <ellipse cx="390" cy="390" rx="200" ry="110" fill="#020617" fill-opacity="0.28"/>
    <rect x="88" y="88" width="312" height="280" rx="52" fill="url(#well)"/>
    <rect x="92" y="92" width="304" height="272" rx="48" fill="none" stroke="#020617" stroke-opacity="0.28" stroke-width="3"/>
    <rect x="90" y="90" width="304" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
  </g>
  <rect x="49" y="33" width="390" height="390" rx="89" fill="none" stroke="url(#bevel)" stroke-width="6"/>
  <rect x="46" y="30" width="396" height="396" rx="92" fill="none" stroke="#020617" stroke-opacity="0.28" stroke-width="2"/>

  <!-- the mind map: tapered branches from the centre to four topics -->
  <g filter="url(#nodeSh)">
    <path d="M244 214 C 206 200, 186 150, 150 146 L 152 158 C 182 164, 204 214, 244 232 Z" fill="#fb7185"/>
    <path d="M244 218 C 206 236, 188 292, 150 302 L 150 314 C 194 308, 214 250, 244 238 Z" fill="#60a5fa"/>
    <path d="M244 216 C 284 196, 300 150, 338 144 L 336 156 C 306 164, 286 212, 244 234 Z" fill="#a78bfa"/>
    <path d="M244 220 C 284 238, 300 292, 338 300 L 338 312 C 296 306, 276 250, 244 238 Z" fill="#84cc16"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M128 146 C 116 128, 112 120, 104 116" stroke="#fda4af"/>
    <path d="M128 304 C 116 322, 112 330, 104 336" stroke="#93c5fd"/>
    <path d="M360 144 C 372 126, 376 118, 384 114" stroke="#c4b5fd"/>
    <path d="M360 304 C 372 322, 376 330, 384 336" stroke="#bef264"/>
  </g>

  <!-- branch topics: rounded pills with a highlight -->
  <g filter="url(#nodeSh)">
    <rect x="100" y="128" width="64" height="40" rx="20" fill="url(#nodeA)"/>
    <rect x="100" y="286" width="64" height="40" rx="20" fill="url(#nodeB)"/>
    <rect x="324" y="126" width="64" height="40" rx="20" fill="url(#nodeC)"/>
    <rect x="324" y="286" width="64" height="40" rx="20" fill="url(#nodeD)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.45">
    <rect x="110" y="133" width="44" height="9" rx="4.5"/>
    <rect x="110" y="291" width="44" height="9" rx="4.5"/>
    <rect x="334" y="131" width="44" height="9" rx="4.5"/>
    <rect x="334" y="291" width="44" height="9" rx="4.5"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.95">
    <rect x="114" y="150" width="36" height="6" rx="3"/>
    <rect x="114" y="308" width="36" height="6" rx="3"/>
    <rect x="338" y="148" width="36" height="6" rx="3"/>
    <rect x="338" y="308" width="36" height="6" rx="3"/>
  </g>

  <!-- central topic: a glowing amber orb -->
  <circle cx="244" cy="226" r="74" fill="url(#glow)"/>
  <g filter="url(#nodeSh)">
    <circle cx="244" cy="226" r="46" fill="url(#core)"/>
  </g>
  <circle cx="244" cy="226" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
  <ellipse cx="230" cy="206" rx="22" ry="12" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="222" y="226" width="44" height="7" rx="3.5" fill="#92400e" fill-opacity="0.75"/>
  <rect x="228" y="240" width="32" height="6" rx="3" fill="#92400e" fill-opacity="0.5"/>
</svg>
