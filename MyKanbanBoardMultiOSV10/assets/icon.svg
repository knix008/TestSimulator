<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MyKanbanBoard app icon: a raised 3D tile with three Kanban columns.
       The border is transparent; the top-left corner glows. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset="0.55" stop-color="#3a6cf0"/>
      <stop offset="1" stop-color="#2236b8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a8f"/>
      <stop offset="1" stop-color="#0f1a5e"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0a124a" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#e8f3ff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#06103f" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faceClip"><rect x="112" y="96" width="800" height="780" rx="170"/></clipPath>
  </defs>

  <!-- soft shadow on the ground (stays inside the transparent border) -->
  <ellipse cx="530" cy="930" rx="380" ry="34" fill="#0a1240" opacity="0.45" filter="url(#shadow)"/>
  <!-- extruded side: gives the tile its thickness -->
  <rect x="112" y="136" width="800" height="780" rx="170" fill="url(#side)"/>
  <!-- face -->
  <rect x="112" y="96" width="800" height="780" rx="170" fill="url(#face)"/>
  <g clip-path="url(#faceClip)">
    <!-- columns -->
    <rect x="182" y="250" width="196" height="540" rx="40" fill="url(#lane)"/>
    <rect x="414" y="250" width="196" height="540" rx="40" fill="url(#lane)"/>
    <rect x="646" y="250" width="196" height="540" rx="40" fill="url(#lane)"/>
    <!-- column headers -->
    <rect x="206" y="278" width="148" height="26" rx="13" fill="#ffffff" opacity="0.75"/>
    <rect x="438" y="278" width="148" height="26" rx="13" fill="#ffffff" opacity="0.75"/>
    <rect x="670" y="278" width="148" height="26" rx="13" fill="#ffffff" opacity="0.75"/>
    <!-- cards -->
    <g filter="url(#cardShadow)">
      <rect x="202" y="330" width="156" height="118" rx="22" fill="url(#card)"/>
      <rect x="202" y="470" width="156" height="118" rx="22" fill="url(#card)"/>
      <rect x="202" y="610" width="156" height="118" rx="22" fill="url(#card)"/>
      <rect x="434" y="330" width="156" height="118" rx="22" fill="url(#card)"/>
      <rect x="434" y="470" width="156" height="118" rx="22" fill="url(#card)"/>
      <rect x="666" y="330" width="156" height="118" rx="22" fill="url(#card)"/>
    </g>
    <!-- card colour stripes -->
    <rect x="222" y="352" width="70" height="16" rx="8" fill="#ff9f1c"/>
    <rect x="222" y="492" width="54" height="16" rx="8" fill="#ff5d8f"/>
    <rect x="222" y="632" width="80" height="16" rx="8" fill="#ff9f1c"/>
    <rect x="454" y="352" width="76" height="16" rx="8" fill="#2ec4b6"/>
    <rect x="454" y="492" width="58" height="16" rx="8" fill="#ff5d8f"/>
    <rect x="686" y="352" width="64" height="16" rx="8" fill="#5dd39e"/>
    <!-- text lines on the cards -->
    <g fill="#9fb2e6">
      <rect x="222" y="390" width="116" height="12" rx="6"/><rect x="222" y="414" width="84" height="12" rx="6"/>
      <rect x="222" y="530" width="116" height="12" rx="6"/><rect x="222" y="554" width="96" height="12" rx="6"/>
      <rect x="222" y="670" width="104" height="12" rx="6"/><rect x="222" y="694" width="70" height="12" rx="6"/>
      <rect x="454" y="390" width="116" height="12" rx="6"/><rect x="454" y="414" width="90" height="12" rx="6"/>
      <rect x="454" y="530" width="110" height="12" rx="6"/><rect x="454" y="554" width="76" height="12" rx="6"/>
      <rect x="686" y="390" width="116" height="12" rx="6"/><rect x="686" y="414" width="64" height="12" rx="6"/>
    </g>
    <!-- check mark on the "done" card -->
    <path d="M760 432l18 18 34-38" fill="none" stroke="#2fbf71" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- glossy top half and the top-left glow -->
    <path d="M112 96h800v300C700 330 400 330 112 440z" fill="url(#gloss)" opacity="0.6"/>
    <rect x="112" y="96" width="800" height="780" fill="url(#glow)"/>
  </g>
  <!-- bevel rim: light top-left, dark bottom-right -->
  <rect x="120" y="104" width="784" height="764" rx="163" fill="none" stroke="url(#bevel)" stroke-width="16"/>
  <!-- sparkle at the top-left corner -->
  <circle cx="232" cy="200" r="70" fill="url(#spark)" opacity="0.9"/>
  <path d="M232 128l12 60 60 12-60 12-12 60-12-60-60-12 60-12z" fill="#ffffff"/>
</svg>
