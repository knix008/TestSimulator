[package]
name = "mydcmviewer"
version = "1.0.0"
description = "MyDCMViewer — DICOM and medical image viewer"
authors = ["SHKWON <knix008@naver.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mydcmviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools" keeps View › Developer Tools working in the installed build.
tauri = { version = "2", features = ["devtools"] }
# ResizeDirection for the resize grip (the version tauri itself uses)
tauri-runtime = "2.12"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Clipboard pictures (the webview's async Clipboard API needs a fresh user gesture,
# which a menu click or a key press has already used up by the time the image is encoded).
arboard = { version = "3.7", features = ["image-data"] }
# Delete from the folder panel goes to the Recycle Bin / Trash, never straight to disk.
trash = "5"
# The folder panel refreshes when files appear or disappear in the open folder.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
# Pages for the printer arrive as JPEGs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"

# Printing straight to the printer chosen in the app (GDI), without a second system print window.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
