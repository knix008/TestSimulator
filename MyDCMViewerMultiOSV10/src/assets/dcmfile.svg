<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#c3ccd8"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d4f9e"/>
      <stop offset="0.5" stop-color="#14245c"/>
      <stop offset="1" stop-color="#070d24"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="scan" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#bae6fd"/>
      <stop offset="0.6" stop-color="#38bdf8"/>
      <stop offset="0.85" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#083752"/>
    </radialGradient>
    <radialGradient id="inner" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#041e2c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect x="60" y="92" width="136" height="108" rx="10"/></clipPath>
  </defs>
  <!-- page with drop shadow -->
  <g filter="url(#shadow)">
    <path d="M56 14h96l56 56v162a12 12 0 0 1-12 12H56a12 12 0 0 1-12-12V26a12 12 0 0 1 12-12z" fill="url(#page)" stroke="#64748b" stroke-width="3"/>
  </g>
  <path d="M152 14v44a12 12 0 0 0 12 12h44z" fill="url(#fold)" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
  <!-- top-left sheen on the page -->
  <path d="M46 26a12 12 0 0 1 12-12h90c-30 40-70 60-102 66z" fill="#fff" opacity="0.45"/>
  <!-- image panel -->
  <rect x="60" y="92" width="136" height="108" rx="10" fill="url(#panel)"/>
  <g clip-path="url(#panelClip)"><path d="M60 92h136v34c-50 22-100 24-136 8z" fill="url(#gloss)"/></g>
  <rect x="61" y="93" width="134" height="106" rx="9" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5"/>
  <g filter="url(#shadow)"><ellipse cx="128" cy="146" rx="50" ry="40" fill="url(#scan)"/></g>
  <ellipse cx="128" cy="146" rx="50" ry="40" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <ellipse cx="128" cy="148" rx="32" ry="25" fill="url(#inner)"/>
  <ellipse cx="108" cy="122" rx="16" ry="7" fill="#fff" opacity="0.5" transform="rotate(-20 108 122)"/>
  <path d="M128 100v12M128 180v12M72 146h12M172 146h12" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <text x="128" y="232" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a" letter-spacing="2">DCM</text>
</svg>
