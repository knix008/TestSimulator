[package]
name = "mypaint"
version = "10.0.0"
description = "MyPaint 10.0 drawing tool"
authors = ["SHKWON <knix008@naver.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "mypaint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pictures onto and off the system clipboard, so other programs can paste what MyPaint copied.
arboard = { version = "3.7", features = ["image-data"] }
base64 = "0.22"
# Every installed font family, for the font menus.
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# "Open a web address": a plain blocking GET with progress, run off the main thread.
ureq = "2.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
