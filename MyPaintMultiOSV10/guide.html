<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyPaint 10.0 — 사용 설명서</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="style/guide.css">
</head>
<body>
  <div id="guide" class="guide">
    <header id="titlebar" class="g-titlebar" data-tauri-drag-region>
      <img class="g-appicon" src="assets/icon.png" alt="" width="18" height="18" data-tauri-drag-region draggable="false">
      <span id="title" class="g-title" data-tauri-drag-region>MyPaint 10.0 — 사용 설명서</span>
      <div id="winButtons" class="g-winbuttons" hidden>
        <button type="button" class="g-win" data-win="minimize" id="winMin"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 6.5h8"/></svg></button>
        <button type="button" class="g-win" data-win="maximize" id="winMax"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
        <button type="button" class="g-win g-close" data-win="close" id="winClose"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </header>

    <div id="toolbar" class="g-toolbar" role="toolbar">
      <button type="button" id="tocToggle" class="g-btn g-icon" aria-pressed="true"></button>
      <span class="g-sep" aria-hidden="true"></span>
      <div class="g-group" role="group" id="langGroup">
        <button type="button" class="g-btn g-flag" data-lang="ko" id="langKo"></button>
        <button type="button" class="g-btn g-flag" data-lang="en" id="langEn"></button>
      </div>
      <span class="g-sep" aria-hidden="true"></span>
      <div class="g-group g-stepper" role="group" id="fontGroup">
        <button type="button" class="g-btn g-step" id="fontDown">−</button>
        <output id="fontValue" class="g-value">15</output>
        <button type="button" class="g-btn g-step" id="fontUp">+</button>
        <button type="button" class="g-btn g-icon" id="fontReset"></button>
      </div>
      <span class="g-sep" aria-hidden="true"></span>
      <label class="g-search" id="searchBox">
        <span class="g-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></span>
        <input id="search" type="search" autocomplete="off" spellcheck="false">
        <button type="button" id="searchClear" class="g-clear" hidden>×</button>
      </label>
    </div>

    <div class="g-body">
      <nav id="toc" class="g-toc" aria-label="Contents">
        <div id="tocHead" class="g-toc-head"></div>
        <ol id="tocList" class="g-toc-list"></ol>
      </nav>
      <main id="content" class="g-content" tabindex="-1">
        <div id="searchInfo" class="g-search-info" hidden></div>
        <div id="sections"></div>
        <nav id="pager" class="g-pager"></nav>
      </main>
    </div>
  </div>

  <div id="lightbox" class="g-lightbox" hidden>
    <figure class="g-lightbox-figure">
      <img id="lightboxImg" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button type="button" id="lightboxClose" class="g-lightbox-close">×</button>
  </div>

  <script src="src/themes.js"></script>
  <script src="src/store.js"></script>
  <script src="src/icons.js"></script>
  <script src="src/guide-content.js"></script>
  <script src="src/host/tauri-bridge.js"></script>
  <script src="src/guide.js"></script>
</body>
</html>
