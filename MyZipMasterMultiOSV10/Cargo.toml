[workspace]
members = ["core", "wasm-engine", "src-tauri"]
default-members = ["core"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["SHKWON <knix008@naver.com>"]

# Engine tests run big buffers through real codecs: an unoptimized LZMA takes minutes.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# The web engine is downloaded, so it is built for size.
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
