<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- The tile: a raised, glossy slab -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff0d8"/>
      <stop offset=".5" stop-color="#149c82"/>
      <stop offset="1" stop-color="#04382f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd0ae"/>
      <stop offset=".55" stop-color="#128f78"/>
      <stop offset="1" stop-color="#075c4e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <!-- The box: three lit faces -->
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffc94d"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#e07a0c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e98a13"/>
      <stop offset="1" stop-color="#a84f04"/>
    </linearGradient>
    <linearGradient id="teeth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c7d6"/>
    </linearGradient>
    <linearGradient id="pull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c3ced9"/>
      <stop offset="1" stop-color="#6d7c8c"/>
    </linearGradient>
  </defs>

  <rect x="30" y="42" width="452" height="452" rx="100" fill="#000" opacity=".42" filter="url(#tileShadow)"/>
  <rect x="24" y="22" width="464" height="464" rx="104" fill="url(#rim)"/>
  <rect x="36" y="34" width="440" height="440" rx="94" fill="url(#face)"/>
  <path d="M36 128a94 94 0 0 1 94-94h252a94 94 0 0 1 94 94v44c-70 44-150 64-220 64S106 214 36 172z" fill="url(#gloss)"/>

  <ellipse cx="256" cy="420" rx="154" ry="30" fill="#02241d" opacity=".55" filter="url(#soft)"/>

  <!-- Isometric box -->
  <path d="M256 92 424 176 256 260 88 176z" fill="url(#top)"/>
  <path d="M88 176 256 260v170L88 346z" fill="url(#left)"/>
  <path d="M424 176 256 260v170l168-84z" fill="url(#right)"/>
  <path d="M88 176 256 260 424 176" fill="none" stroke="#fff4d0" stroke-opacity=".75" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256 260v170" stroke="#7a3a02" stroke-opacity=".35" stroke-width="4"/>
  <path d="M256 92 424 176 256 260 88 176z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linejoin="round"/>

  <!-- Zipper down the top and the front edge -->
  <path d="M170 134 340 218" stroke="#7a4a06" stroke-width="30" stroke-linecap="round" opacity=".55"/>
  <path d="M170 130 340 214" stroke="#3b2a12" stroke-width="24" stroke-linecap="round"/>
  <g fill="url(#teeth)">
    <path d="M186 134l14 7-7 4-14-7z"/>
    <path d="M208 145l14 7-7 4-14-7z"/>
    <path d="M230 156l14 7-7 4-14-7z"/>
    <path d="M252 167l14 7-7 4-14-7z"/>
    <path d="M274 178l14 7-7 4-14-7z"/>
    <path d="M296 189l14 7-7 4-14-7z"/>
    <path d="M318 200l14 7-7 4-14-7z"/>
  </g>
  <path d="M340 214l-2 76" stroke="#3b2a12" stroke-width="22" stroke-linecap="round"/>
  <rect x="318" y="210" width="44" height="30" rx="8" fill="url(#pull)" stroke="#55626f" stroke-width="2"/>
  <path d="M328 240h24l6 74a18 18 0 0 1-36 0z" fill="url(#pull)" stroke="#55626f" stroke-width="2"/>
  <circle cx="340" cy="312" r="7" fill="#42505d"/>
  <path d="M332 218h16" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
</svg>
