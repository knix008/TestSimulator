[package]
name = "qrgenerator"
version = "1.0.0"
description = "QR code generator: Rust encoder with a JavaScript designer."
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "qrgenerator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qrcore = { path = "../qrcore" }
qrimage = { path = "../qrimage" }
arboard = { version = "3", default-features = false, features = ["image-data"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
