<!DOCTYPE html>
<html lang="en" class="popup-host">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Menu</title>
  <link rel="stylesheet" href="./styles/main.css">
  <style>
    /* Transparent host: only the menu itself paints (see popupMenu.js / main.js popup window) */
    html.popup-host, html.popup-host body { background: transparent !important; margin: 0; overflow: hidden; width: 100%; height: 100%; }
    html.popup-host #context-menu { animation: none; }
  </style>
</head>
<body>
  <div id="context-menu"></div>
  <script src="./js/contextMenu.js"></script>
  <script src="./js/popupMenu.js"></script>
</body>
</html>
