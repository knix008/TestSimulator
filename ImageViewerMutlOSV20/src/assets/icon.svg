<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ec8ea"/>
      <stop offset="100%" stop-color="#3a86b8"/>
    </linearGradient>
    <linearGradient id="cardMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="100%" stop-color="#c5dff0"/>
    </linearGradient>
    <linearGradient id="frame3d" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#f3f8fc"/>
      <stop offset="100%" stop-color="#c8d7e4"/>
    </linearGradient>
    <linearGradient id="frameEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8aa4b8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="18%" y2="100%">
      <stop offset="0%" stop-color="#6ec4f5"/>
      <stop offset="48%" stop-color="#c7ebff"/>
      <stop offset="100%" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="mountA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6aa8d4"/>
      <stop offset="100%" stop-color="#3d7eab"/>
    </linearGradient>
    <linearGradient id="mountB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3cb07a"/>
      <stop offset="100%" stop-color="#1e6d4c"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7b0"/>
      <stop offset="60%" stop-color="#ffc94a"/>
      <stop offset="100%" stop-color="#ef9a1c"/>
    </radialGradient>
    <linearGradient id="lensMetal" x1="20%" y1="15%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#f8fcff"/>
      <stop offset="45%" stop-color="#8eb4cc"/>
      <stop offset="100%" stop-color="#3d6a86"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#d9f3ff"/>
      <stop offset="40%" stop-color="#4aa3d6"/>
      <stop offset="100%" stop-color="#1b5f88"/>
    </radialGradient>
    <filter id="softShadow" x="-35%" y="-25%" width="170%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0b2a40" flood-opacity="0.38"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#0b2a40" flood-opacity="0.28"/>
    </filter>
    <clipPath id="photoClip">
      <rect x="62" y="70" width="132" height="96" rx="8" ry="8"/>
    </clipPath>
  </defs>

  <!-- Ground contact shadow (no outer tile / no opaque border) -->
  <ellipse cx="128" cy="228" rx="78" ry="12" fill="#0b2a40" opacity="0.18"/>

  <!-- Rear card -->
  <g transform="rotate(-16 128 128)" filter="url(#cardShadow)">
    <rect x="58" y="46" width="140" height="164" rx="14" fill="url(#cardBack)"/>
  </g>

  <!-- Middle card -->
  <g transform="rotate(11 128 128)" filter="url(#cardShadow)">
    <rect x="60" y="48" width="136" height="160" rx="13" fill="url(#cardMid)"/>
  </g>

  <!-- Front 3D photo frame -->
  <g filter="url(#softShadow)">
    <rect x="50" y="54" width="156" height="148" rx="16" fill="url(#frame3d)"/>
    <rect x="50" y="54" width="156" height="148" rx="16" fill="url(#frameEdge)" opacity="0.35"/>
    <!-- Inner well -->
    <rect x="62" y="70" width="132" height="96" rx="8" fill="#0d3a55"/>

    <g clip-path="url(#photoClip)">
      <rect x="62" y="70" width="132" height="96" fill="url(#sky)"/>
      <circle cx="164" cy="92" r="16" fill="#ffe080" opacity="0.28"/>
      <circle cx="164" cy="92" r="12" fill="url(#sun)"/>
      <polygon points="62,166 98,112 136,166" fill="url(#mountA)" opacity="0.92"/>
      <polygon points="108,166 150,104 194,166" fill="url(#mountB)"/>
      <polygon points="162,166 194,128 194,166" fill="#1f5f82" opacity="0.7"/>
      <rect x="62" y="152" width="132" height="14" fill="#3d9ec4" opacity="0.42"/>
      <rect x="70" y="156" width="70" height="1.6" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- Frame bevel highlight -->
    <path d="M66 58h124a10 10 0 0 1 10 10v8H56v-8a10 10 0 0 1 10-10z" fill="#ffffff" opacity="0.42"/>
    <rect x="50" y="54" width="156" height="148" rx="16" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.35"/>
  </g>

  <!-- 3D lens badge -->
  <g transform="translate(168 168)">
    <circle r="26" fill="url(#lensMetal)" filter="url(#cardShadow)"/>
    <circle r="18" fill="url(#lensGlass)"/>
    <circle r="8" fill="#0e3d5c" opacity="0.35"/>
    <ellipse cx="-6" cy="-7" rx="8" ry="5" fill="#ffffff" opacity="0.45"/>
    <circle r="26" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.4"/>
  </g>
</svg>
