<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>박스</title>
  <link rel="stylesheet" href="fence.css" />
</head>
<body>
  <!-- 테두리 창. 제목 줄과 가장자리만 그린다.
       가운데는 비어 있고, 그 자리의 마우스는 아래의 바탕화면 아이콘으로 흘러간다. -->
  <div id="panel">
    <header id="title">
      <span id="name"></span>
      <input id="rename" hidden spellcheck="false" />
      <button id="gear" type="button" title="설정"><img src="../../assets/menu/settings.png" alt="" /></button>
    </header>
    <div class="edge n" data-edge="n"></div>
    <div class="edge s" data-edge="s"></div>
    <div class="edge e" data-edge="e"></div>
    <div class="edge w" data-edge="w"></div>
    <div class="edge ne" data-edge="ne"></div>
    <div class="edge nw" data-edge="nw"></div>
    <div class="edge se" data-edge="se"></div>
    <div class="edge sw" data-edge="sw"></div>
    <div id="grip" aria-hidden="true"></div>
  </div>
  <script src="../shared/arrange.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="fence.js"></script>
</body>
</html>
