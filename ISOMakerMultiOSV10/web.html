<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var t = localStorage.getItem('isomaker.theme')
        var l = localStorage.getItem('isomaker.locale')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
        document.documentElement.lang = l === 'en' ? 'en' : 'ko'
      } catch (e) {}
    </script>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self';"
    />
    <link rel="icon" type="image/png" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <title>ISO Maker Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web-main.tsx"></script>
  </body>
</html>
