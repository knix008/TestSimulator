<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- .mcad drawing icon: a 3D drawing sheet with a folded corner, a gear with
       its dimension, and the title block in the bottom-right corner.
       Same palette as the app icon; transparent border, a soft sheen at the top-left. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3e3ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9bd8"/>
      <stop offset="1" stop-color="#3f58a8"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a9c2f2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c64d8"/>
      <stop offset="1" stop-color="#0a2a7a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe59a"/>
      <stop offset="0.4" stop-color="#ffb43a"/>
      <stop offset="1" stop-color="#b8530a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#eef6ff" stop-opacity="0.15"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#0a1a55" flood-opacity="0.4"/>
    </filter>
    <clipPath id="pageClip"><path d="M244 88H648L824 264V832Q824 872 784 872H244Q204 872 204 832V128Q204 88 244 88Z"/></clipPath>
  </defs>

  <!-- soft shadow on the ground -->
  <ellipse cx="520" cy="932" rx="330" ry="30" fill="#0a1240" opacity="0.45" filter="url(#shadow)"/>
  <!-- sheet thickness -->
  <path transform="translate(0 30)" fill="url(#edge)" d="M244 88H648L824 264V832Q824 872 784 872H244Q204 872 204 832V128Q204 88 244 88Z"/>
  <!-- sheet -->
  <path fill="url(#page)" d="M244 88H648L824 264V832Q824 872 784 872H244Q204 872 204 832V128Q204 88 244 88Z"/>
  <g clip-path="url(#pageClip)">
    <!-- drawing frame -->
    <rect x="236" y="120" width="556" height="720" fill="none" stroke="#5f7fc8" stroke-width="6"/>
    <!-- centre lines -->
    <path d="M314 500H714M514 300V700" stroke="#3a6cf0" stroke-opacity="0.7" stroke-width="6" stroke-dasharray="34 12 6 12" fill="none"/>
    <!-- gear -->
    <g filter="url(#soft)" transform="translate(514 500) scale(0.82) translate(-512 -560)">
      <path fill="url(#metal)" fill-rule="evenodd" d="M470.0 430.7L488.2 426.1L493.9 391.0L530.1 391.0L535.8 426.1L554.0 430.7L571.4 437.7L596.7 412.6L626.0 433.9L610.0 465.7L622.0 480.1L632.0 496.0L667.2 490.5L678.4 525.0L646.7 541.3L648.0 560.0L646.7 578.7L678.4 595.0L667.2 629.5L632.0 624.0L622.0 639.9L610.0 654.3L626.0 686.1L596.7 707.4L571.4 682.3L554.0 689.3L535.8 693.9L530.1 729.0L493.9 729.0L488.2 693.9L470.0 689.3L452.6 682.3L427.3 707.4L398.0 686.1L414.0 654.3L402.0 639.9L392.0 624.0L356.8 629.5L345.6 595.0L377.3 578.7L376.0 560.0L377.3 541.3L345.6 525.0L356.8 490.5L392.0 496.0L402.0 480.1L414.0 465.7L398.0 433.9L427.3 412.6L452.6 437.7Z M512 512a48 48 0 1 0 0.1 0z"/>
    </g>
    <!-- dimension above the gear -->
    <g stroke="#1c3f9a" stroke-width="7" fill="#1c3f9a" stroke-linecap="round">
      <path d="M380 290V236M648 290V236M406 262H622" fill="none"/>
      <path d="M380 262l34-14v28z" stroke="none"/>
      <path d="M648 262l-34-14v28z" stroke="none"/>
    </g>
    <!-- title block -->
    <rect x="540" y="690" width="300" height="200" fill="url(#block)"/>
    <path d="M540 740H840M540 790H840M650 690V890" stroke="#ffffff" stroke-opacity="0.7" stroke-width="6"/>
    <rect x="566" y="706" width="64" height="16" rx="8" fill="#ffffff" opacity="0.8"/>
    <rect x="676" y="756" width="120" height="16" rx="8" fill="#ffffff" opacity="0.8"/>
    <!-- top-left glow -->
    <rect x="204" y="88" width="620" height="784" fill="url(#glow)"/>
  </g>
  <!-- folded corner -->
  <path fill="url(#fold)" d="M648 88V222Q648 264 690 264H824Z"/>
  <path fill="none" stroke="#7f9bd8" stroke-width="5" d="M648 88V222Q648 264 690 264H824"/>
  <!-- sparkle at the top-left corner -->
  <circle cx="276" cy="168" r="50" fill="url(#spark)" opacity="0.3"/>
  <path d="M276 132l6 32 32 6-32 6-6 32-6-32-32-6 32-6z" fill="#ffffff" opacity="0.45"/>
</svg>
