appId: com.shkwon.mydiffmerge
productName: My Diff & Merge
copyright: Copyright (c) SHKWON(knix008@naver.com)

directories:
  output: release
  buildResources: build

# The packaged app is the built UI, the bundled server and the Electron shell.
# node_modules is bundled into dist-server/ by scripts/bundle-server.mjs, so the
# dependency tree would only be dead weight in the installer.
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - core/themeSeeds.json
  - package.json
  - "!node_modules/**/*"

extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: build/document.ico
    to: document.ico

asar: true
npmRebuild: false

# The app's own save format. The installer registers it with its own icon, so a
# .dmrg session opens in My Diff & Merge from the file manager.
fileAssociations:
  - ext: dmrg
    name: My Diff & Merge Session
    description: My Diff & Merge Session
    mimeType: application/x-mydiffmerge-session
    icon: build/document.ico
    role: Editor

win:
  icon: build/icon.ico
  artifactName: MyDiffMerge-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: My Diff & Merge
  runAfterFinish: true
  # An existing installation is removed in full before the new one is laid down
  # (build/installer.nsh), and the user is asked what to do with their data.
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
  installerLanguages:
    - en_US
    - ko_KR
  multiLanguageInstaller: true
  displayLanguageSelector: true

portable:
  artifactName: MyDiffMerge-${version}-win-${arch}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  artifactName: MyDiffMerge-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  title: My Diff & Merge ${version}

linux:
  icon: build/icons
  category: Development
  synopsis: File, directory and 3-way merge tool for git and standalone use
  description: |
    My Diff & Merge compares two files or two directory trees side by side, highlights
    added, removed and modified lines, and resolves 3-way merge conflicts. It can be
    registered as a git difftool and mergetool, and also runs as a web application.
  maintainer: SHKWON <knix008@naver.com>
  desktop:
    entry:
      Name: My Diff & Merge
      Comment: File, directory and 3-way merge tool
      Categories: Development;Utility;
      MimeType: application/x-mydiffmerge-session;
  artifactName: MyDiffMerge-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64, arm64]
