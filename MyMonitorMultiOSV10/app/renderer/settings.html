<!DOCTYPE html>
<html lang="ko" class="settings" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>설정 — MyMonitor MultiOS</title>
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="settings-body">
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <form id="settings-form" class="settings-form">
    <div class="dlg-title">
      <svg class="dlg-icon settings-gear" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/>
      </svg>
      <h2 data-i18n="settingsTitle">설정</h2>
    </div>
    <div class="settings-tabs" role="tablist">
      <button type="button" role="tab" data-tab="general" aria-selected="true">
        <span data-i18n="tabGeneral">일반</span>
      </button>
      <button type="button" role="tab" data-tab="theme" aria-selected="false">
        <span data-i18n="theme">테마</span>
      </button>
    </div>

    <section class="settings-panel" data-tab-panel="general" role="tabpanel">
      <label><span data-i18n="language">언어</span>
        <div>
          <button type="button" class="tb-btn" data-action="toggle-lang" data-i18n-tip="tipLang">
            <span class="flag flag-clone" aria-hidden="true"></span>
            <span id="settings-lang-label">한국어</span>
          </button>
        </div>
      </label>
      <div>
        <div data-i18n="refresh">실시간 갱신 주기</div>
        <div class="interval-stepper" data-step="interval">
          <button type="button" class="step-btn" data-interval-dir="-1" data-i18n-tip="tipIntervalDown" data-i18n-aria="intervalDown">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <input id="settings-interval" class="interval-input" type="text" inputmode="numeric" spellcheck="false" value="1000" />
          <button type="button" class="step-btn" data-interval-dir="1" data-i18n-tip="tipIntervalUp" data-i18n-aria="intervalUp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <p class="muted" data-i18n="refreshHelp">로컬·시뮬레이터·원격 에이전트 구독 주기에 적용됩니다. 200–10000 ms.</p>
      <div>
        <div data-i18n="windowLabel">그래프 시간 창</div>
        <div class="interval-stepper" data-step="window">
          <button type="button" class="step-btn" data-window-dir="-1" data-i18n-tip="tipWindowDown" data-i18n-aria="windowDown">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <input id="settings-window" class="interval-input" type="text" inputmode="numeric" spellcheck="false" value="60" />
          <button type="button" class="step-btn" data-window-dir="1" data-i18n-tip="tipWindowUp" data-i18n-aria="windowUp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <p class="muted" data-i18n="windowHelp">그래프가 쌓이는 시간 창입니다. 10–600초.</p>
    </section>

    <section class="settings-panel hidden" data-tab-panel="theme" role="tabpanel">
      <div class="settings-tabs settings-tabs-sub" role="tablist">
        <button type="button" data-theme-group="dark" aria-selected="true">
          <span data-i18n="themeDark">Dark 10</span>
        </button>
        <button type="button" data-theme-group="light" aria-selected="false">
          <span data-i18n="themeLight">Light 10</span>
        </button>
      </div>
      <div id="theme-dark" class="theme-grid"></div>
      <div id="theme-light" class="theme-grid hidden"></div>
    </section>

    <div class="dlg-actions">
      <button type="button" id="btn-settings-close" class="btn ghost" data-i18n="close">닫기</button>
      <button type="submit" class="btn primary" data-i18n="apply">적용</button>
    </div>
  </form>
  <script src="i18n.js"></script>
  <script src="web-bridge.js"></script>
  <script src="settings.js"></script>
</body>
</html>
