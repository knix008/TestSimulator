<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- .mumlt template icon: a raised 3D page with a folded corner, a stencil of
       a dashed flowchart outline. Same style as the app icon (transparent border, glowing
       top-left), its own picture. Centred: the page spans x 192…832, y 112…912. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ece4ff"/>
      <stop offset="1" stop-color="#9d8bd6"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a46a8"/><stop offset="1" stop-color="#2c1f66"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9cfff"/><stop offset="1" stop-color="#7b66c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.45" stop-color="#241657" stop-opacity="0"/>
      <stop offset="1" stop-color="#241657" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="barShadow" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#241657" flood-opacity="0.4"/></filter>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pageClip"><path d="M192 160a48 48 0 0 1 48-48h400l192 192v560a48 48 0 0 1-48 48H240a48 48 0 0 1-48-48z"/></clipPath>
  </defs>
  <ellipse cx="512" cy="950" rx="330" ry="30" fill="#1a1040" opacity="0.45" filter="url(#shadow)"/>
  <path d="M192 196a48 48 0 0 1 48-48h400l192 192v560a48 48 0 0 1-48 48H240a48 48 0 0 1-48-48z" fill="url(#side)" transform="translate(0 -36)"/>
  <g clip-path="url(#pageClip)">
    <rect x="192" y="112" width="640" height="800" fill="url(#face)"/>
    <!-- dashed flowchart outline: a starting point -->
    <g fill="none" stroke="#5a46a8" stroke-width="9" stroke-dasharray="22 14" stroke-linecap="round" stroke-linejoin="round">
      <rect x="412" y="330" width="200" height="70" rx="35"/>
      <path d="M512 440l60 100-60 100-60-100z"/>
      <rect x="262" y="610" width="160" height="90" rx="14"/>
      <rect x="602" y="610" width="160" height="90" rx="14"/>
    </g>
    <g fill="none" stroke="#5a46a8" stroke-opacity="0.6" stroke-width="8" stroke-linecap="round"><path d="M512 400v40M452 540h-110v70M572 540h110v70"/></g>
    <rect x="192" y="112" width="640" height="800" fill="url(#shade)"/>
    <rect x="192" y="112" width="640" height="800" fill="url(#glow)"/>
  </g>
  <!-- folded corner -->
  <path d="M640 112v144a48 48 0 0 0 48 48h144z" fill="url(#fold)"/>
  <path d="M640 112v144a48 48 0 0 0 48 48h144" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6"/>
  <!-- file type label -->
  <rect x="252" y="776" width="250" height="76" rx="22" fill="#5a46a8"/>
  <text x="377" y="830" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">MUMLT</text>
  <circle cx="262" cy="186" r="62" fill="url(#spark)" opacity="0.95"/>
  <path d="M262 122l10 52 52 10-52 10-10 52-10-52-52-10 52-10z" fill="#ffffff"/>
</svg>
