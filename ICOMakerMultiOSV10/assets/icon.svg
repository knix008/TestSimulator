<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent border: artwork is inset, corners fully transparent -->
  <defs>
    <!-- Main 3D body gradient (top-left light -> bottom-right dark) -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#6ec3ff"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1"   stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Bevel edge highlight -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Top-left specular light reflection -->
    <radialGradient id="spec" cx="0.30" cy="0.26" r="0.7">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glossy sweep across upper half -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Front icon-tile shading -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2efff"/>
    </linearGradient>

    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#0b1b3a" flood-opacity="0.45"/>
    </filter>
    <filter id="tileshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1b3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Drop shadow + 3D tile body -->
  <g filter="url(#dropshadow)">
    <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#body)"/>
  </g>

  <!-- Bevel edge -->
  <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#bevel)" opacity="0.55"/>

  <!-- Emblem: cascade of icon tiles of different sizes (multi-resolution icon set) -->
  <g filter="url(#tileshadow)">
    <!-- back tile (large, faint) -->
    <rect x="470" y="300" width="200" height="200" rx="44" fill="#ffffff" opacity="0.32"/>
    <!-- mid tile -->
    <rect x="405" y="368" width="205" height="205" rx="46" fill="#ffffff" opacity="0.62"/>
    <!-- front tile (bright, the finished icon) -->
    <rect x="336" y="438" width="212" height="212" rx="48" fill="url(#tile)"/>
  </g>

  <!-- 4-point "generate" sparkle centered on the front tile -->
  <path d="M 442 486 L 460 528 L 502 544 L 460 560 L 442 602 L 424 560 L 382 544 L 424 528 Z"
        fill="#3b82f6"/>

  <!-- small accent sparkle (top-right) -->
  <path d="M 704 300 l 14 34 l 34 14 l -34 14 l -14 34 l -14 -34 l -34 -14 l 34 -14 z"
        fill="#ffffff" opacity="0.95"/>

  <!-- Glossy top sweep -->
  <path d="M 132 300 L 132 300 A 180 180 0 0 1 312 120 L 712 120 A 180 180 0 0 1 892 300 L 892 470 Q 512 560 132 470 Z"
        fill="url(#gloss)"/>

  <!-- Top-left specular reflection -->
  <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#spec)"/>
</svg>
