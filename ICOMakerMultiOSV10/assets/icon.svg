<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent border: artwork is inset, corners fully transparent -->
  <defs>
    <!-- Main 3D body gradient (top-left light -> bottom-right dark) -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#6ec3ff"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1"   stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Bevel edge highlight -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Top-left specular light reflection -->
    <radialGradient id="spec" cx="0.30" cy="0.26" r="0.7">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glossy sweep across upper half -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Front icon-frame shading -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2efff"/>
    </linearGradient>

    <!-- Source image gradient (little picture that gets converted) -->
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76e"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>

    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#0b1b3a" flood-opacity="0.45"/>
    </filter>
    <filter id="tileshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1b3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Drop shadow + 3D tile body -->
  <g filter="url(#dropshadow)">
    <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#body)"/>
  </g>

  <!-- Bevel edge -->
  <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#bevel)" opacity="0.55"/>

  <!-- Emblem: source image being converted into a multi-resolution icon frame -->
  <g filter="url(#tileshadow)">
    <!-- Multi-resolution stack (small icon sizes) behind the main frame -->
    <rect x="470" y="250" width="120" height="120" rx="26" fill="#ffffff" opacity="0.30"/>
    <rect x="512" y="300" width="150" height="150" rx="32" fill="#ffffff" opacity="0.50"/>

    <!-- Main framed icon output (largest resolution) -->
    <rect x="360" y="300" width="304" height="304" rx="56" fill="url(#tile)"/>

    <!-- Little source picture inside: mountains + sun (a generic image being turned into an icon) -->
    <g>
      <rect x="404" y="344" width="216" height="176" rx="24" fill="url(#photo)"/>
      <circle cx="462" cy="398" r="24" fill="#fff6d6"/>
      <path d="M 404 520 L 404 476 L 470 416 L 528 470 L 566 440 L 620 492 L 620 520 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Bold "ICO" wordmark makes the tool's purpose explicit -->
  <text x="512" y="742" text-anchor="middle"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="176" font-weight="800" letter-spacing="6"
        fill="#ffffff">ICO</text>

  <!-- Small accent sparkle (top-right) -->
  <path d="M 720 288 l 14 34 l 34 14 l -34 14 l -14 34 l -14 -34 l -34 -14 l 34 -14 z"
        fill="#ffffff" opacity="0.95"/>

  <!-- Glossy top sweep -->
  <path d="M 132 300 L 132 300 A 180 180 0 0 1 312 120 L 712 120 A 180 180 0 0 1 892 300 L 892 470 Q 512 560 132 470 Z"
        fill="url(#gloss)"/>

  <!-- Top-left specular reflection -->
  <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#spec)"/>
</svg>
