<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- MyMarkDownMaker: three Markdown documents merging into one numbered document -->
  <defs>
    <!-- Main 3D body gradient (top-left light -> bottom-right dark) -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#86c6ff"/>
      <stop offset="0.45" stop-color="#3d7bf5"/>
      <stop offset="1"    stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Bevel edge highlight -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Top-left specular reflection -->
    <radialGradient id="spec" cx="0.30" cy="0.26" r="0.7">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glossy sweep across upper half -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Merged (result) sheet shading -->
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eef8"/>
    </linearGradient>

    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#0a1f4d" flood-opacity="0.45"/>
    </filter>
    <filter id="cardshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a1f4d" flood-opacity="0.35"/>
    </filter>

    <!-- Arrowhead that auto-rotates to match each line's direction -->
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="52" markerHeight="52"
            viewBox="0 0 10 10" refX="6.6" refY="5" orient="auto">
      <path d="M0 0.6 L9 5 L0 9.4 L3.1 5 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Drop shadow + 3D tile body -->
  <g filter="url(#dropshadow)">
    <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#body)"/>
  </g>
  <!-- Bevel edge -->
  <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#bevel)" opacity="0.55"/>

  <!-- ── Three source Markdown documents (top), each tagged with the Markdown "M↓" ── -->
  <g filter="url(#cardshadow)">
    <!-- doc 1 -->
    <g transform="translate(224 210)">
      <rect width="150" height="188" rx="20" fill="#ffffff"/>
      <rect x="22" y="120" width="106" height="12" rx="6" fill="#9fb0c7"/>
      <rect x="22" y="146" width="80"  height="12" rx="6" fill="#c2ccdc"/>
      <!-- Markdown mark -->
      <g fill="#3d7bf5">
        <path d="M28 34 h14 l14 18 l14 -18 h14 v56 h-16 v-30 l-12 15 l-12 -15 v30 h-16 z"/>
        <path d="M96 34 h16 v34 h16 l-24 26 l-24 -26 h16 z"/>
      </g>
    </g>
    <!-- doc 2 -->
    <g transform="translate(437 188)">
      <rect width="150" height="188" rx="20" fill="#ffffff"/>
      <rect x="22" y="120" width="106" height="12" rx="6" fill="#9fb0c7"/>
      <rect x="22" y="146" width="80"  height="12" rx="6" fill="#c2ccdc"/>
      <g fill="#3d7bf5">
        <path d="M28 34 h14 l14 18 l14 -18 h14 v56 h-16 v-30 l-12 15 l-12 -15 v30 h-16 z"/>
        <path d="M96 34 h16 v34 h16 l-24 26 l-24 -26 h16 z"/>
      </g>
    </g>
    <!-- doc 3 -->
    <g transform="translate(650 210)">
      <rect width="150" height="188" rx="20" fill="#ffffff"/>
      <rect x="22" y="120" width="106" height="12" rx="6" fill="#9fb0c7"/>
      <rect x="22" y="146" width="80"  height="12" rx="6" fill="#c2ccdc"/>
      <g fill="#3d7bf5">
        <path d="M28 34 h14 l14 18 l14 -18 h14 v56 h-16 v-30 l-12 15 l-12 -15 v30 h-16 z"/>
        <path d="M96 34 h16 v34 h16 l-24 26 l-24 -26 h16 z"/>
      </g>
    </g>
  </g>

  <!-- ── Merge arrows: each of the three docs flows down into the result. ── -->
  <!-- ──   Arrowheads use marker-end so they align to each line's angle.  ── -->
  <g stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95">
    <!-- left doc -> left of sheet -->
    <path d="M299 404 C 330 468, 398 500, 448 520" marker-end="url(#ah)"/>
    <!-- center doc -> center of sheet -->
    <path d="M512 384 L 512 520" marker-end="url(#ah)"/>
    <!-- right doc -> right of sheet -->
    <path d="M725 404 C 694 468, 626 500, 576 520" marker-end="url(#ah)"/>
  </g>

  <!-- ── Merged result document with fresh numbering (1, 1.1, 2 …) ── -->
  <g filter="url(#cardshadow)">
    <rect x="372" y="540" width="280" height="286" rx="28" fill="url(#sheet)"/>
    <g fill="#1e3a8a">
      <!-- 1 -->
      <rect x="408" y="580" width="26" height="18" rx="4"/>
      <rect x="448" y="580" width="150" height="18" rx="6" opacity="0.32"/>
      <!-- 1.1 -->
      <rect x="430" y="620" width="34" height="15" rx="4"/>
      <rect x="478" y="620" width="120" height="15" rx="6" opacity="0.28"/>
      <!-- 1.2 -->
      <rect x="430" y="654" width="34" height="15" rx="4"/>
      <rect x="478" y="654" width="120" height="15" rx="6" opacity="0.28"/>
      <!-- 2 -->
      <rect x="408" y="694" width="26" height="18" rx="4"/>
      <rect x="448" y="694" width="150" height="18" rx="6" opacity="0.32"/>
      <!-- 2.1 -->
      <rect x="430" y="734" width="34" height="15" rx="4"/>
      <rect x="478" y="734" width="120" height="15" rx="6" opacity="0.28"/>
    </g>
  </g>

  <!-- Glossy top sweep -->
  <path d="M 132 300 A 180 180 0 0 1 312 120 L 712 120 A 180 180 0 0 1 892 300 L 892 470 Q 512 560 132 470 Z"
        fill="url(#gloss)"/>
  <!-- Top-left specular reflection -->
  <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#spec)"/>
</svg>
