[package]
name = "myphotomanager"
version = "1.0.0"
description = "Cross-platform photo manager and viewer"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "myphotomanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
filetime = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
trash = "5"
wallpaper = "3.2"

[dev-dependencies]
tempfile = "3"
