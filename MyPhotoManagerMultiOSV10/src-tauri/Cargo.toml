[package]
name = "myphotomanager"
version = "1.0.0"
description = "Cross-platform photo manager and viewer"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"

[lib]
name = "myphotomanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
filetime = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
trash = "5"
wallpaper = "3.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }
# Direct printing through WebView2 (same versions Tauri uses).
webview2-com = "0.39"
windows-core = "0.62"
