<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fe4"/>
      <stop offset="1" stop-color="#14256e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fbf6f"/>
      <stop offset="1" stop-color="#17804a"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6b8c"/>
      <stop offset="1" stop-color="#2f3b57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="photo"><rect x="250" y="300" width="560" height="420" rx="18"/></clipPath>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="200" fill="url(#bg)"/>
  <!-- back photos of the stack -->
  <g filter="url(#shadow)">
    <rect x="196" y="236" width="600" height="460" rx="26" fill="#f4f6fb" transform="rotate(-9 496 466)"/>
    <rect x="214" y="262" width="600" height="460" rx="26" fill="#ffffff" transform="rotate(5 514 492)"/>
  </g>
  <!-- front photo -->
  <g filter="url(#shadow)">
    <rect x="226" y="276" width="608" height="468" rx="28" fill="#ffffff"/>
  </g>
  <g clip-path="url(#photo)">
    <rect x="250" y="300" width="560" height="420" fill="url(#sky)"/>
    <circle cx="690" cy="400" r="54" fill="#ffd34d"/>
    <path d="M250 640 L420 450 L520 560 L600 480 L810 690 L810 720 L250 720 Z" fill="url(#peak)"/>
    <path d="M420 450 L462 497 L440 505 L420 488 L398 510 L384 491 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M250 660 Q420 590 560 650 T810 640 L810 720 L250 720 Z" fill="url(#hill)"/>
  </g>
  <!-- rating star badge -->
  <g transform="translate(742 690)">
    <circle r="112" fill="#ffb300" stroke="#ffffff" stroke-width="20"/>
    <path d="M0 -62 L18 -20 L63 -19 L28 9 L40 53 L0 28 L-40 53 L-28 9 L-63 -19 L-18 -20 Z" fill="#ffffff"/>
  </g>
</svg>
