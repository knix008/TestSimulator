<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- MyMarkdownMaster: a Markdown note being written — a pencil writing the last line, an eraser beside it -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#7fdcc4"/>
      <stop offset="0.45" stop-color="#2fb59a"/>
      <stop offset="1"    stop-color="#12564a"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.30" cy="0.26" r="0.7">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2f3ec"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9d9cd"/>
    </linearGradient>
    <!-- pencil facets run along the pencil, so the gradients go across it (y) -->
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d7a8"/>
      <stop offset="1" stop-color="#e9b877"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#f4f6f8"/>
      <stop offset="0.45" stop-color="#b8c2cc"/>
      <stop offset="1"    stop-color="#7d8894"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3c1"/>
      <stop offset="1" stop-color="#e0607a"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc2cd"/>
      <stop offset="1" stop-color="#ef7d93"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#2563c9"/>
    </linearGradient>
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#063a30" flood-opacity="0.45"/>
    </filter>
    <filter id="cardshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#063a30" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- tile -->
  <g filter="url(#dropshadow)">
    <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#body)"/>
  </g>
  <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#bevel)" opacity="0.55"/>
  <rect x="132" y="120" width="760" height="760" rx="180" ry="180" fill="url(#spec)"/>

  <!-- ── the note ── -->
  <g transform="rotate(-6 470 480)">
    <g filter="url(#cardshadow)">
      <path d="M262 196 H600 L690 286 V752 Q690 776 666 776 H262 Q238 776 238 752 V220 Q238 196 262 196 Z" fill="url(#sheet)"/>
    </g>
    <!-- folded corner -->
    <path d="M600 196 V262 Q600 286 624 286 H690 Z" fill="url(#fold)"/>
    <!-- Markdown mark + title -->
    <g fill="#1f8f79" transform="translate(268 236) scale(1.05)">
      <path d="M28 34 h14 l14 18 l14 -18 h14 v56 h-16 v-30 l-12 15 l-12 -15 v30 h-16 z"/>
      <path d="M96 34 h16 v34 h16 l-24 26 l-24 -26 h16 z"/>
    </g>
    <rect x="420" y="282" width="150" height="22" rx="11" fill="#12564a" opacity="0.75"/>
    <!-- text lines -->
    <g fill="#12564a">
      <rect x="290" y="372" width="350" height="16" rx="8" opacity="0.30"/>
      <rect x="290" y="420" width="300" height="16" rx="8" opacity="0.30"/>
      <rect x="290" y="468" width="88"  height="16" rx="8" opacity="0.30"/>
      <rect x="290" y="516" width="320" height="16" rx="8" opacity="0.30"/>
      <!-- bullet list -->
      <circle cx="300" cy="580" r="10" opacity="0.55"/>
      <rect x="324" y="572" width="210" height="16" rx="8" opacity="0.30"/>
    </g>
    <!-- the erased part of line 3: a faint smudge where the words were -->
    <rect x="396" y="464" width="214" height="24" rx="12" fill="#f3b9c4" opacity="0.35"/>
    <!-- the line being written by hand -->
    <path d="M292 652 c 18 -22 30 -22 40 0 s 24 22 38 0 s 26 -22 40 0 s 24 22 38 0 s 26 -20 38 -2"
          fill="none" stroke="#12564a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── eraser (bottom left), with crumbs ── -->
  <g filter="url(#cardshadow)" transform="rotate(-20 292 766)">
    <rect x="176" y="708" width="232" height="116" rx="22" fill="url(#rubber)"/>
    <!-- worn, rounded working end -->
    <rect x="176" y="708" width="40" height="116" rx="20" fill="#ffd3db" opacity="0.7"/>
    <!-- paper sleeve -->
    <path d="M262 702 H392 Q414 702 414 724 V808 Q414 830 392 830 H262 Z" fill="url(#sleeve)"/>
    <rect x="262" y="702" width="152" height="18" fill="#ffffff" opacity="0.28"/>
    <rect x="286" y="752" width="100" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
    <rect x="286" y="772" width="66"  height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  </g>
  <g fill="#ef8ea0">
    <ellipse cx="420" cy="676" rx="11" ry="7" transform="rotate(-25 420 676)"/>
    <ellipse cx="446" cy="700" rx="8"  ry="5"/>
    <ellipse cx="404" cy="706" rx="6"  ry="4"/>
  </g>

  <!-- ── pencil: tip at the end of the handwritten line, pointing down-left ── -->
  <g filter="url(#cardshadow)" transform="translate(508 648) rotate(-48) scale(0.78)">
    <!-- graphite point + sharpened wood -->
    <path d="M0 0 L112 -40 L112 40 Z" fill="url(#wood)"/>
    <path d="M0 0 L34 -12 Q40 0 34 12 Z" fill="#2f3a45"/>
    <path d="M112 -40 q-10 13 0 27 q-10 13 0 27 q-10 13 0 26 L112 40 Z" fill="#e9b877"/>
    <!-- body: three facets -->
    <rect x="112" y="-40" width="350" height="27" fill="#ffd24d"/>
    <rect x="112" y="-13" width="350" height="26" fill="#f7b928"/>
    <rect x="112" y="13"  width="350" height="27" fill="#d9901a"/>
    <path d="M112 -40 q-10 13 0 27 q-10 13 0 27 q-10 13 0 26" fill="none" stroke="#b97a14" stroke-width="3" opacity="0.6"/>
    <!-- metal ferrule -->
    <rect x="462" y="-42" width="62" height="84" rx="6" fill="url(#ferrule)"/>
    <g stroke="#6b7682" stroke-width="5" opacity="0.7">
      <line x1="478" y1="-40" x2="478" y2="40"/>
      <line x1="508" y1="-40" x2="508" y2="40"/>
    </g>
    <!-- eraser cap -->
    <path d="M524 -40 H560 Q584 -40 584 -16 V16 Q584 40 560 40 H524 Z" fill="url(#cap)"/>
  </g>
</svg>
