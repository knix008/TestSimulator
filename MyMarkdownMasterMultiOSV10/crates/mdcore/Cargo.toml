[package]
name = "mdcore"
version = "1.0.0"
edition = "2021"
description = "MyMarkdownMaster core: note parsing, vault index, link resolution, search, rendering and export"
authors = ["SHKWON <knix008@naver.com>"]

[lib]
path = "src/lib.rs"

[dependencies]
comrak = { version = "0.39", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
