<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="1280" height="940" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .t { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #334155; }
      .m { font-size: 11px; fill: #475569; }
      .h { font-size: 19px; font-weight: 800; fill: #0f172a; }
      .b { stroke-width: 1.5; rx: 10; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="1280" height="940" fill="#ffffff"/>
  <text x="640" y="34" text-anchor="middle" class="h">MyMarkdownMaster 1.0.0 — 전체 구조 / Overall architecture</text>
  <text x="640" y="56" text-anchor="middle" class="m">화면은 JavaScript, 핵심은 Rust · UI in JavaScript, the core in Rust (native on the desktop, WebAssembly on the web)</text>

  <!-- UI layer -->
  <rect x="30" y="76" width="1220" height="300" fill="#eef2ff" stroke="#6366f1" class="b"/>
  <text x="48" y="100" class="t">화면 (WebView / 브라우저) · UI — src/</text>
  <rect x="48" y="112" width="290" height="120" fill="#fff" stroke="#818cf8" class="b"/>
  <text x="62" y="134" class="t">셸 (MySketchBook)</text>
  <text x="62" y="154" class="s">메뉴 막대 · 툴바(») · 상태 표시줄</text>
  <text x="62" y="172" class="s">접는 좌/우/하단 패널 · 시작 카드 보드</text>
  <text x="62" y="190" class="s">팝업 창(설정·메뉴·확인·진행률)</text>
  <text x="62" y="208" class="s">테마 · 한/영 · 튜토리얼 · 도움말 창</text>
  <text x="62" y="224" class="m">app.js · popup.js · ui/* · themes.js</text>

  <rect x="352" y="112" width="290" height="120" fill="#fff" stroke="#818cf8" class="b"/>
  <text x="366" y="134" class="t">작업 공간 · Workspace</text>
  <text x="366" y="154" class="s">창 나누기(가로·세로) · 탭 끌어 옮기기</text>
  <text x="366" y="172" class="s">메모 보기: 실시간 / 소스 / 읽기 / 나란히</text>
  <text x="366" y="190" class="s">나란히: 원문·미리보기 각각 접기, 스크롤 맞춤</text>
  <text x="366" y="208" class="s">작업 공간 저장 · 뒤로/앞으로</text>
  <text x="366" y="224" class="m">workspace/layout.js · views/note-view.js</text>

  <rect x="656" y="112" width="290" height="120" fill="#fff" stroke="#818cf8" class="b"/>
  <text x="670" y="134" class="t">편집기 · 미리보기</text>
  <text x="670" y="154" class="s">CodeMirror 6: 라이브 프리뷰, 접기, [[ # : / 완성</text>
  <text x="670" y="172" class="s">집중·타자기 모드 · 문체 밑줄 · 표 정렬</text>
  <text x="670" y="190" class="s">KaTeX · Mermaid · 코드 강조 · 차트 · 콜아웃</text>
  <text x="670" y="208" class="s">읽기 테마 5종 · 슬라이드 / 읽기 발표</text>
  <text x="670" y="224" class="m">editor/* · render/*</text>

  <rect x="960" y="112" width="276" height="120" fill="#fff" stroke="#818cf8" class="b"/>
  <text x="974" y="134" class="t">보기 · 패널 · AI</text>
  <text x="974" y="154" class="s">그래프(전체·로컬) · 캔버스(JSON Canvas)</text>
  <text x="974" y="172" class="s">파일·검색·책갈피·태그·메모 목록</text>
  <text x="974" y="190" class="s">개요·백링크·링크·속성·통계</text>
  <text x="974" y="208" class="s">AI 채팅·메모 작업 (14개 공급자)</text>
  <text x="974" y="224" class="m">views/* · panels/* · ai/* · features.js</text>

  <rect x="48" y="250" width="1188" height="44" fill="#fff" stroke="#a5b4fc" class="b"/>
  <text x="62" y="277" class="s">색인 보기 (vault/index.js): Rust 코어의 스냅숏을 받아 패널·그래프·완성이 바로 읽음 — JS는 메모를 해석하지 않음 · The page only reads the core's snapshot; JS never parses notes</text>

  <rect x="48" y="306" width="580" height="56" fill="#fff" stroke="#a5b4fc" class="b"/>
  <text x="62" y="328" class="t">core/core.js — core.call(method, args)</text>
  <text x="62" y="348" class="s">데스크톱: invoke('core_call') · 웹: mdcore.wasm (JSON ABI, wasm-bindgen 없음)</text>
  <rect x="642" y="306" width="594" height="56" fill="#fff" stroke="#a5b4fc" class="b"/>
  <text x="656" y="328" class="t">vault/storage.js — Vault</text>
  <text x="656" y="348" class="s">데스크톱: Rust 명령(vault_*) · 웹: 폴더(File System Access) / 브라우저 저장소(OPFS)</text>

  <!-- Rust core -->
  <rect x="30" y="420" width="1220" height="210" fill="#fff7ed" stroke="#f97316" class="b"/>
  <text x="48" y="444" class="t">Rust 코어 · crates/mdcore (데스크톱과 웹이 같은 코드)</text>
  <g>
    <rect x="48" y="458" width="182" height="74" fill="#fff" stroke="#fb923c" class="b"/>
    <text x="60" y="480" class="t">note · scan</text><text x="60" y="499" class="s">속성(YAML) · 제목 · 링크</text><text x="60" y="516" class="s">태그 · ^블록 · 할 일 · 단어</text>
    <rect x="240" y="458" width="182" height="74" fill="#fff" stroke="#fb923c" class="b"/>
    <text x="252" y="480" class="t">index</text><text x="252" y="499" class="s">링크 해석(Obsidian 규칙)</text><text x="252" y="516" class="s">백링크 · 미해결 · 별칭</text>
    <rect x="432" y="458" width="182" height="74" fill="#fff" stroke="#fb923c" class="b"/>
    <text x="444" y="480" class="t">search</text><text x="444" y="499" class="s">tag: path: line:( ) …</text><text x="444" y="516" class="s">"구절" -빼기 OR /정규식/</text>
    <rect x="624" y="458" width="182" height="74" fill="#fff" stroke="#fb923c" class="b"/>
    <text x="636" y="480" class="t">render</text><text x="636" y="499" class="s">comrak + [[ ]] ![[ ]] 콜아웃</text><text x="636" y="516" class="s">==강조== #태그 [TOC] 줄 번호</text>
    <rect x="816" y="458" width="182" height="74" fill="#fff" stroke="#fb923c" class="b"/>
    <text x="828" y="480" class="t">rename</text><text x="828" y="499" class="s">이름 바꾸면 모든 링크</text><text x="828" y="516" class="s">자동 수정 · 합치기</text>
    <rect x="1008" y="458" width="228" height="74" fill="#fff" stroke="#fb923c" class="b"/>
    <text x="1020" y="480" class="t">export (17 형식)</text><text x="1020" y="499" class="s">HTML DOCX ODT EPUB RTF LaTeX</text><text x="1020" y="516" class="s">MD TXT Djot RST AsciiDoc …</text>
    <rect x="48" y="542" width="374" height="74" fill="#fff" stroke="#fb923c" class="b"/>
    <text x="60" y="564" class="t">writing · template · emoji</text><text x="60" y="583" class="s">통계·읽는 시간·문체 검사(한/영)·품사</text><text x="60" y="600" class="s">Moment 날짜 형식 · {{date}} {{title}} · :smile:</text>
    <rect x="432" y="542" width="804" height="74" fill="#fff" stroke="#fb923c" class="b"/>
    <text x="444" y="564" class="t">engine — Engine::call(method, args) : 하나의 JSON API</text>
    <text x="444" y="583" class="s">setFiles · setText · snapshot · resolve · backlinks · unlinked · search · quickSwitch · render · flatten</text>
    <text x="444" y="600" class="s">rename · stats · styleCheck · template · formatDate · setProperty · export · exportFormats · emoji</text>
  </g>

  <!-- Desktop and web -->
  <rect x="30" y="680" width="740" height="236" fill="#ecfdf5" stroke="#10b981" class="b"/>
  <text x="48" y="704" class="t">데스크톱 백엔드 · src-tauri (Tauri 2 / Rust) — Windows · macOS · Linux</text>
  <rect x="48" y="716" width="350" height="128" fill="#fff" stroke="#34d399" class="b"/>
  <text x="62" y="738" class="t">vault.rs</text>
  <text x="62" y="757" class="s">폴더 읽기(walkdir) → Engine 색인</text>
  <text x="62" y="774" class="s">파일 감시(notify) → vault-changed</text>
  <text x="62" y="791" class="s">쓰기(원자적)·이름 바꾸기+링크·휴지통</text>
  <text x="62" y="808" class="s">파일 복구 스냅숏 · 내보내기 쓰기</text>
  <text x="62" y="830" class="m">core_call · vault_open/read/write/rename/delete/export …</text>
  <rect x="408" y="716" width="346" height="60" fill="#fff" stroke="#34d399" class="b"/>
  <text x="422" y="738" class="t">ai.rs</text>
  <text x="422" y="757" class="s">AI HTTP 프록시(reqwest·rustls) · 스트리밍 ai-chunk</text>
  <rect x="408" y="784" width="346" height="60" fill="#fff" stroke="#34d399" class="b"/>
  <text x="422" y="806" class="t">lib.rs · files · printing · window_state · explorer</text>
  <text x="422" y="825" class="s">창·팝업·PDF·인쇄·창 위치·여러 실행·탐색기</text>
  <rect x="48" y="854" width="706" height="48" fill="#fff" stroke="#34d399" class="b"/>
  <text x="62" y="883" class="s">설치: NSIS(Windows) · DMG(macOS) · deb/rpm/AppImage(Linux) — npm run build:win / build:mac / build:linux</text>

  <rect x="790" y="680" width="460" height="236" fill="#f0f9ff" stroke="#0ea5e9" class="b"/>
  <text x="808" y="704" class="t">웹 빌드 · Web (Vite, 어느 브라우저든)</text>
  <rect x="808" y="716" width="424" height="76" fill="#fff" stroke="#38bdf8" class="b"/>
  <text x="822" y="738" class="t">crates/mdwasm → public/mdcore.wasm</text>
  <text x="822" y="757" class="s">같은 mdcore를 wasm32로 컴파일 (npm run build:wasm)</text>
  <text x="822" y="774" class="s">md_alloc · md_call · md_result_len · md_free</text>
  <rect x="808" y="800" width="424" height="102" fill="#fff" stroke="#38bdf8" class="b"/>
  <text x="822" y="822" class="t">브라우저 보관함</text>
  <text x="822" y="841" class="s">진짜 폴더: File System Access (Chrome·Edge)</text>
  <text x="822" y="858" class="s">브라우저 안 보관함: OPFS (모든 최신 브라우저)</text>
  <text x="822" y="875" class="s">스냅숏: IndexedDB · AI: fetch(스트리밍)</text>
  <text x="822" y="892" class="m">내보내기: core('export') → 내려받기 · PDF는 인쇄 대화상자</text>

  <!-- arrows -->
  <path class="line" d="M338 362 L338 420" /><text x="346" y="396" class="m">core.call</text>
  <path class="line" d="M640 362 L640 420" /><text x="648" y="396" class="m">vault_* 명령 (데스크톱) · Rust commands (desktop)</text>
  <path class="line dash" d="M400 630 L400 680" /><text x="408" y="660" class="m">네이티브로 링크 · linked natively</text>
  <path class="line dash" d="M1020 630 L1020 680" /><text x="1028" y="660" class="m">WebAssembly로 컴파일 · compiled to wasm</text>
</svg>
