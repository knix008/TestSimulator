<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A MyStableFast3D document: a sheet of paper with a folded corner,
       carrying the program's picture → 3D model mark. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceef4"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7fa"/>
      <stop offset="1" stop-color="#cfd4de"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a66"/>
      <stop offset="0.5" stop-color="#e5554c"/>
      <stop offset="1" stop-color="#8a34f2"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9cd"/>
      <stop offset="1" stop-color="#ffb8a2"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a66"/>
      <stop offset="1" stop-color="#d9493f"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#6436d6"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a0d55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a0d55" stop-opacity="0"/>
    </radialGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- the sheet, its folded corner -->
  <g filter="url(#paperShadow)">
    <path d="M118 28h214l110 110v322a28 28 0 0 1-28 28H118a28 28 0 0 1-28-28V56a28 28 0 0 1 28-28z" fill="url(#paper)"/>
    <path d="M118 28h214l110 110v322a28 28 0 0 1-28 28H118a28 28 0 0 1-28-28V56a28 28 0 0 1 28-28z" fill="none" stroke="#b9bfcc" stroke-width="5"/>
  </g>
  <path d="M332 28v82a28 28 0 0 0 28 28h82z" fill="url(#fold)" stroke="#b9bfcc" stroke-width="5" stroke-linejoin="round"/>

  <!-- the picture … -->
  <rect x="128" y="84" width="118" height="92" rx="10" fill="#ffffff" stroke="#d3d7e0" stroke-width="4"/>
  <rect x="138" y="94" width="98" height="66" rx="6" fill="url(#photo)"/>
  <path d="M140 158 172 122l20 22 16-14 26 28z" fill="#e5554c"/>
  <circle cx="216" cy="112" r="9" fill="#f6b73c"/>

  <!-- … becomes the model -->
  <ellipse cx="300" cy="372" rx="92" ry="17" fill="url(#contact)"/>
  <path d="M300 186 386 234 300 282 214 234z" fill="url(#top)"/>
  <path d="M214 234 300 282 300 372 214 324z" fill="url(#left)"/>
  <path d="M386 234 300 282 300 372 386 324z" fill="url(#right)"/>
  <path d="M214 234 300 186 386 234" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M300 186 386 234 386 324 300 372 214 324 214 234z" fill="none" stroke="#3a1a5c" stroke-opacity="0.3" stroke-width="4" stroke-linejoin="round"/>

  <!-- the program's colours along the foot of the sheet -->
  <rect x="118" y="408" width="296" height="44" rx="12" fill="url(#band)"/>
  <path d="M146 430h120M286 430h40" stroke="#ffffff" stroke-opacity="0.8" stroke-width="8" stroke-linecap="round"/>
</svg>
