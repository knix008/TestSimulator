; 게임 설정 파일 (settings.ini)
; 세미콜론으로 시작하는 줄은 주석입니다.
; 값을 바꾼 뒤 게임을 다시 시작해야 적용됩니다.

[General]
Language=ko
PlayerName=용감한모험가
AutoSave=true
AutoSaveIntervalMinutes=10
ShowTutorial=false

[Display]
Width=2560
Height=1440
Fullscreen=true
VSync=true
FrameLimit=144
Brightness=0.55
; 낮음(low) / 보통(medium) / 높음(high) / 최고(ultra)
Quality=high

[Graphics]
Shadows=high
TextureQuality=ultra
AntiAliasing=TAA
MotionBlur=false
ViewDistance=1200
FieldOfView=90

[Audio]
MasterVolume=80
MusicVolume=60
EffectsVolume=85
VoiceVolume=100
Subtitles=true

[Controls]
MouseSensitivity=1.25
InvertY=false
KeyForward=W
KeyBack=S
KeyLeft=A
KeyRight=D
KeyJump=Space
KeyInventory=I
KeyMap=M

[Network]
Server=asia-east.example.com
Port=27015
MaxPing=120
