[package]
name = "mymind"
version = "2.0.0"
description = "MyMind - Tauri shell"
authors = ["SHKWON <knix008@naver.com>"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
# Pictures in formats the WebView cannot show are converted to PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "dds", "hdr", "exr", "pnm", "ff", "qoi", "avif"] }
psd = "0.3"
# The installed font families for the font drop-down: WebKit has no queryLocalFonts, and WebView2's asks.
fontdb = "0.23"

# The system's print dialog: what Tauri offers opens the browser's, inside the window.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
