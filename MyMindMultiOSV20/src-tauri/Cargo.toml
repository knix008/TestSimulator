[package]
name = "mymind"
version = "2.0.0"
description = "MyMind - Tauri shell"
authors = ["SHKWON <knix008@naver.com>"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
# The installed font families for the font drop-down: WebKit has no queryLocalFonts, and WebView2's asks.
fontdb = "0.23"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
