<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bright, distinguishable background gradient (teal -> blue -> violet) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded-square app tile -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#glow)"/>

  <!-- Connecting branches (drawn under the nodes) -->
  <g stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.92">
    <line x1="256" y1="256" x2="156" y2="156"/>
    <line x1="256" y1="256" x2="356" y2="156"/>
    <line x1="256" y1="256" x2="156" y2="356"/>
    <line x1="256" y1="256" x2="356" y2="356"/>
  </g>

  <!-- Four colourful branch nodes -->
  <g stroke="#ffffff" stroke-width="8" filter="url(#soft)">
    <rect x="110" y="110" width="92" height="92" rx="24" fill="#fbbf24"/>
    <rect x="310" y="110" width="92" height="92" rx="24" fill="#34d399"/>
    <rect x="110" y="310" width="92" height="92" rx="24" fill="#a78bfa"/>
    <rect x="310" y="310" width="92" height="92" rx="24" fill="#fb7185"/>
  </g>

  <!-- Central node -->
  <rect x="198" y="198" width="116" height="116" rx="30" fill="url(#center)" stroke="#ffffff" stroke-width="10" filter="url(#soft)"/>
  <rect x="224" y="224" width="64" height="64" rx="18" fill="#3b82f6"/>
</svg>
