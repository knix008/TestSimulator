<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Tile: a teal-to-indigo gradient face over a darker extruded side. -->
    <linearGradient id="face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#1e1048"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7f3d0"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <linearGradient id="barD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <radialGradient id="dot" cx="0.35" cy="0.3" r="0.7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e7ff"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1030" flood-opacity="0.45"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1030" flood-opacity="0.35"/></filter>
  </defs>
  <!-- tile -->
  <rect x="84" y="104" width="856" height="856" rx="196" fill="url(#side)"/>
  <rect x="84" y="72" width="856" height="856" rx="196" fill="url(#face)" filter="url(#shadow)"/>
  <rect x="84" y="72" width="856" height="856" rx="196" fill="url(#glow)"/>
  <!-- glass card -->
  <rect x="190" y="190" width="644" height="560" rx="64" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6"/>
  <!-- grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="5">
    <line x1="246" x2="778" y1="340" y2="340"/>
    <line x1="246" x2="778" y1="460" y2="460"/>
    <line x1="246" x2="778" y1="580" y2="580"/>
  </g>
  <line x1="246" x2="790" y1="690" y2="690" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <!-- bars -->
  <g filter="url(#soft)">
    <rect x="276" y="470" width="92" height="220" rx="18" fill="url(#barA)"/>
    <rect x="404" y="380" width="92" height="310" rx="18" fill="url(#barB)"/>
    <rect x="532" y="430" width="92" height="260" rx="18" fill="url(#barC)"/>
    <rect x="660" y="300" width="92" height="390" rx="18" fill="url(#barD)"/>
  </g>
  <!-- trend line -->
  <polyline points="322,420 450,320 578,372 706,236" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <g filter="url(#soft)">
    <circle cx="322" cy="420" r="26" fill="url(#dot)" stroke="#4338ca" stroke-width="10"/>
    <circle cx="450" cy="320" r="26" fill="url(#dot)" stroke="#4338ca" stroke-width="10"/>
    <circle cx="578" cy="372" r="26" fill="url(#dot)" stroke="#4338ca" stroke-width="10"/>
    <circle cx="706" cy="236" r="26" fill="url(#dot)" stroke="#4338ca" stroke-width="10"/>
  </g>
  <!-- pie badge -->
  <g transform="translate(760 760)" filter="url(#shadow)">
    <circle r="132" fill="#ffffff"/>
    <path d="M0 0 L0 -110 A110 110 0 0 1 104.6 34 Z" fill="#f97316"/>
    <path d="M0 0 L104.6 34 A110 110 0 0 1 -64.7 89 Z" fill="#8b5cf6"/>
    <path d="M0 0 L-64.7 89 A110 110 0 0 1 0 -110 Z" fill="#14b8a6"/>
    <circle r="46" fill="#ffffff"/>
  </g>
</svg>
