    <polyline points="334,391.6 459,291.6 584,346.6 709,211.6" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="334" cy="391.6" r="30" fill="url(#ball)" filter="url(#soft)"/>
    <circle cx="459" cy="291.6" r="30" fill="url(#ball)" filter="url(#soft)"/>
    <circle cx="584" cy="346.6" r="30" fill="url(#ball)" filter="url(#soft)"/>
    <circle cx="709" cy="211.6" r="30" fill="url(#ball)" filter="url(#soft)"/>
