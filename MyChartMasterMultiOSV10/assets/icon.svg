    <rect x="522" y="428.6" width="84" height="245" fill="url(#f2)"/>
    <polygon points="522,428.6 562,404.6 646,404.6 606,428.6" fill="#93e0c6"/>
    <rect x="530" y="436.6" width="12" height="229" rx="6" fill="#ffffff" opacity="0.28"/>
    <polygon points="731,293.6 771,269.6 771,649.6 731,673.6" fill="url(#s3)"/>
    <rect x="647" y="293.6" width="84" height="380" fill="url(#f3)"/>
