<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.3"/></filter>
  </defs>
  <!-- the page -->
  <path d="M232 80h400l200 200v620a44 44 0 0 1-44 44H232a44 44 0 0 1-44-44V124a44 44 0 0 1 44-44z" fill="url(#paper)" stroke="#94a3b8" stroke-width="10" filter="url(#shadow)"/>
  <path d="M632 80v156a44 44 0 0 0 44 44h156z" fill="url(#fold)"/>
  <!-- a small chart on it -->
  <g stroke="#cbd5e1" stroke-width="8"><line x1="270" x2="740" y1="420" y2="420"/><line x1="270" x2="740" y1="530" y2="530"/></g>
  <rect x="290" y="470" width="80" height="170" rx="14" fill="#f59e0b"/>
  <rect x="400" y="390" width="80" height="250" rx="14" fill="#e11d48"/>
  <rect x="510" y="440" width="80" height="200" rx="14" fill="#10b981"/>
  <rect x="620" y="340" width="80" height="300" rx="14" fill="#0ea5e9"/>
  <line x1="270" x2="740" y1="640" y2="640" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
  <!-- the badge -->
  <rect x="250" y="700" width="524" height="190" rx="56" fill="url(#badge)" filter="url(#shadow)"/>
  <text x="512" y="826" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="104" font-weight="800" fill="#ffffff">CHART</text>
</svg>
