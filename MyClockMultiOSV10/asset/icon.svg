<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    MyClock 앱 아이콘.
    입체감은 세 겹으로 만든다: (1) 대각선 그라디언트로 칠한 본체,
    (2) 좌측 상단에서 들어오는 반사광, (3) 문자판 아래 그림자와 베젤 하이라이트.
    SVG 필터는 쓰지 않는다 — 래스터라이저(resvg)가 확실히 지원하는 그라디언트만 쓴다.
  -->
  <defs>
    <!-- 본체: 좌상단이 밝고 우하단으로 갈수록 어두워진다 -->
    <linearGradient id="body" x1="0.06" y1="0" x2="0.94" y2="1">
      <stop offset="0%" stop-color="#4E5578" />
      <stop offset="38%" stop-color="#262B40" />
      <stop offset="100%" stop-color="#0D0F17" />
    </linearGradient>

    <!-- 좌측 상단 반사광 -->
    <radialGradient id="gloss" cx="0.28" cy="0.2" r="0.66">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- 위쪽을 덮는 유리 띠 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 테두리 림 라이트: 좌상단은 밝게, 우하단은 어둡게 -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.70" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.40" />
    </linearGradient>

    <!-- 문자판 아래 그림자 (가운데는 문자판에 가려진다) -->
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="76%" stop-color="#000000" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 문자판: 좌상단에서 빛이 드는 오목한 느낌 -->
    <radialGradient id="face" cx="0.33" cy="0.26" r="0.88">
      <stop offset="0%" stop-color="#2E3450" />
      <stop offset="52%" stop-color="#171B29" />
      <stop offset="100%" stop-color="#080A11" />
    </radialGradient>

    <!-- 금속 베젤 -->
    <linearGradient id="bezel" x1="0.12" y1="0.02" x2="0.88" y2="0.98">
      <stop offset="0%" stop-color="#D8E6FF" />
      <stop offset="26%" stop-color="#9DC0FF" />
      <stop offset="58%" stop-color="#4A6BAE" />
      <stop offset="82%" stop-color="#6E96DC" />
      <stop offset="100%" stop-color="#A9C8FF" />
    </linearGradient>

    <!-- 문자판 위 유리 반사 -->
    <linearGradient id="glass" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 중심 캡 -->
    <radialGradient id="cap" cx="0.34" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#FFC4D4" />
      <stop offset="55%" stop-color="#F38BA8" />
      <stop offset="100%" stop-color="#B85A76" />
    </radialGradient>

    <clipPath id="bodyClip">
      <rect x="16" y="16" width="480" height="480" rx="112" />
    </clipPath>
    <clipPath id="faceClip">
      <circle cx="256" cy="256" r="166" />
    </clipPath>
  </defs>

  <!-- ── 본체 ───────────────────────────────────────────────────── -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#body)" />
  <g clip-path="url(#bodyClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#gloss)" />
    <ellipse cx="248" cy="64" rx="300" ry="176" fill="url(#sheen)" />
  </g>
  <rect
    x="17.5"
    y="17.5"
    width="477"
    height="477"
    rx="111"
    fill="none"
    stroke="url(#rim)"
    stroke-width="3"
  />

  <!-- ── 문자판 ─────────────────────────────────────────────────── -->
  <circle cx="256" cy="264" r="196" fill="url(#shade)" />
  <circle cx="256" cy="256" r="176" fill="url(#face)" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#bezel)" stroke-width="20" />
  <circle cx="256" cy="256" r="166" fill="none" stroke="#000000" stroke-width="3" opacity="0.40" />

  <!-- 눈금 -->
  <g stroke="#E3E9FA" stroke-linecap="round">
    <line x1="256" y1="106" x2="256" y2="146" stroke-width="15" />
    <line x1="406" y1="256" x2="366" y2="256" stroke-width="15" />
    <line x1="256" y1="406" x2="256" y2="366" stroke-width="15" />
    <line x1="106" y1="256" x2="146" y2="256" stroke-width="15" />
  </g>
  <g stroke="#7C88AD" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="331" y1="126" x2="321" y2="143" />
    <line x1="386" y1="181" x2="369" y2="191" />
    <line x1="386" y1="331" x2="369" y2="321" />
    <line x1="331" y1="386" x2="321" y2="369" />
    <line x1="181" y1="386" x2="191" y2="369" />
    <line x1="126" y1="331" x2="143" y2="321" />
    <line x1="126" y1="181" x2="143" y2="191" />
    <line x1="181" y1="126" x2="191" y2="143" />
  </g>

  <!-- 바늘: 시침은 1시 방향(30°). 어두운 복제본을 살짝 비껴 깔아 두께감을 준다 -->
  <g stroke="#05070C" opacity="0.5" stroke-linecap="round">
    <line x1="259" y1="259" x2="306" y2="178" stroke-width="22" />
    <line x1="259" y1="259" x2="337" y2="302" stroke-width="16" />
  </g>
  <line x1="256" y1="256" x2="303" y2="175" stroke="#EDF1FB" stroke-width="22" stroke-linecap="round" />
  <line x1="256" y1="256" x2="334" y2="299" stroke="#89B4FA" stroke-width="16" stroke-linecap="round" />
  <line x1="256" y1="256" x2="197" y2="331" stroke="#F38BA8" stroke-width="9" stroke-linecap="round" />

  <!-- ── 유리 반사 (문자판 좌측 상단) ───────────────────────────── -->
  <g clip-path="url(#faceClip)">
    <ellipse cx="196" cy="146" rx="190" ry="118" fill="url(#glass)" transform="rotate(-20 196 146)" />
  </g>

  <circle cx="256" cy="256" r="19" fill="url(#cap)" />
  <circle cx="250" cy="250" r="6" fill="#FFFFFF" opacity="0.55" />
</svg>
