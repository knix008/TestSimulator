<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"
    />
    <title>MyClock</title>
    <link rel="stylesheet" href="styles/clock.css" />
  </head>
  <body class="clock-body">
    <div id="root" class="clock-root">
      <!-- 마우스를 올렸을 때만 보이는 창 배경 (디지털에서만) -->
      <div id="chromeBackground" class="chrome-background" hidden></div>

      <!-- 디지털 시계 — 숫자 바로 위에 "도시 오전/오후 날짜" 한 줄.
           아날로그에서는 도시·오전/오후·날짜를 문자판 안에 그린다. -->
      <div id="digitalPanel" class="digital-panel">
        <div class="digital-header">
          <span id="cityName" class="header-city"></span>
          <span id="amPmText" class="header-ampm"></span>
          <span id="headerDate" class="header-date" hidden></span>
        </div>
        <div class="digital-body">
          <div id="canvasDigital" class="canvas-digital">
            <canvas id="digitalCanvas" class="digital-canvas"></canvas>
          </div>
          <div id="textClockBox" class="text-clock-box" hidden>
            <div id="textClockInner" class="text-clock-inner">
              <div id="textTime" class="text-time"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 아날로그 시계 -->
      <canvas id="analogCanvas" class="analog-canvas" hidden></canvas>

      <!-- 호버 시 표시되는 오버레이 -->
      <div id="chromeToolbar" class="chrome-toolbar" hidden>
        <button id="modeToggleBtn" class="chrome-btn" type="button" title="아날로그 시계로 전환">◷</button>
        <button id="settingsBtn" class="chrome-btn" type="button" title="이 시계 설정">⚙</button>
        <button id="closeBtn" class="chrome-btn" type="button" title="이 시계 닫기">✕</button>
      </div>
      <div id="resizeOutline" class="resize-outline" hidden></div>
      <div id="resizeGrip" class="resize-grip" title="끌어서 크기 조절" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <line x1="8" y1="16" x2="16" y2="8" stroke="currentColor" stroke-width="1.3" opacity="0.7" />
          <line x1="4" y1="16" x2="16" y2="4" stroke="currentColor" stroke-width="1.3" opacity="0.85" />
          <line x1="0" y1="16" x2="16" y2="0" stroke="currentColor" stroke-width="1.3" />
        </svg>
      </div>
    </div>

    <script src="js/data/themes.js"></script>
    <script src="js/data/styles.js"></script>
    <script src="js/zone-time.js"></script>
    <script src="js/korean.js"></script>
    <script src="js/digital-display.js"></script>
    <script src="js/analog-clock.js"></script>
    <script src="js/zoneclock.js"></script>
  </body>
</html>
