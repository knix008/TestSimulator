[package]
name = "sim-wasm"
version = "1.0.0"
edition = "2021"
description = "My3DMaker solver core compiled to WebAssembly for the web build"
authors = ["SHKWON <knix008@naver.com>"]
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
sim-core = { path = "../sim-core" }
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
