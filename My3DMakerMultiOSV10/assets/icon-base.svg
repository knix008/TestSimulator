<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MyMechanics app icon: a machined steel spur gear meshing with a small amber gear, on a deep steel-blue tile
       with a soft light from the upper left (no grid). The tile sits in the exact centre (112…912 both ways); the
       border is transparent. Gear outlines are computed (scripts: 12 and 8 teeth, straight flanks). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5d9e"/>
      <stop offset="0.55" stop-color="#173763"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2140"/>
      <stop offset="1" stop-color="#050d1c"/>
    </linearGradient>
    <radialGradient id="light" cx="0.22" cy="0.14" r="0.75">
      <stop offset="0" stop-color="#8fc2ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#5a8fd6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="steel" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#dfe6ee"/>
      <stop offset="0.7" stop-color="#9aa8b8"/>
      <stop offset="1" stop-color="#5f6e80"/>
    </linearGradient>
    <linearGradient id="steelEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d8b9b"/>
      <stop offset="1" stop-color="#2c3644"/>
    </linearGradient>
    <radialGradient id="web" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#8e9cad"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd78a"/>
      <stop offset="0.5" stop-color="#ffab2e"/>
      <stop offset="1" stop-color="#c8650a"/>
    </linearGradient>
    <linearGradient id="amberEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8620e"/>
      <stop offset="1" stop-color="#6a3204"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="112" y="112" width="800" height="776" rx="176"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="10" dy="22" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <!-- the tile -->
  <rect x="112" y="136" width="800" height="776" rx="176" fill="url(#tileEdge)"/>
  <rect x="112" y="112" width="800" height="776" rx="176" fill="url(#tile)"/>
  <rect x="112" y="112" width="800" height="776" rx="176" fill="url(#light)"/>
