      <path d="M454 510 h28 v-22 h-28z" fill="#22303f"/>
    </g>
  </g>
  <rect x="120" y="120" width="784" height="760" rx="170" fill="none" stroke="url(#bevel)" stroke-width="12"/>
</svg>
