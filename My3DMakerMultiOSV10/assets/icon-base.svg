      <!-- the web recess and the hub -->
      <path d="M298 562 a170 170 0 1 0 340 0 a170 170 0 1 0 -340 0Z" fill="none" stroke="#5b6979" stroke-opacity="0.55" stroke-width="5"/>
      <path d="M376 562 a92 92 0 1 0 184 0 a92 92 0 1 0 -184 0Z M412 562 a56 56 0 1 0 112 0 a56 56 0 1 0 -112 0Z" fill="url(#web)" fill-rule="evenodd" stroke="#4b5868" stroke-width="5"/>
