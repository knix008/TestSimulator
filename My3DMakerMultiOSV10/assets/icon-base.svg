      <path d="M642 326 a62 62 0 1 0 124 0 a62 62 0 1 0 -124 0Z" fill="none" stroke="#fff1d2" stroke-opacity="0.55" stroke-width="6"/>
    </g>
    <g filter="url(#shadow)">
