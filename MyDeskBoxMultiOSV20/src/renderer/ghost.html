<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    /* 끌고 있는 동안 손에 들려 있는 것처럼 살짝 기울여 띄운다. */
    img {
      width: 44px;
      height: 44px;
      margin: 8px 0 0 16px;
      transform: rotate(-5deg) scale(1.06);
      filter:
        drop-shadow(0 2px 2px rgba(0, 0, 0, 0.4))
        drop-shadow(0 12px 16px rgba(0, 0, 0, 0.55));
    }
  </style>
</head>
<body>
  <img id="icon" alt="" />
  <script src="ghost.js"></script>
</body>
</html>
