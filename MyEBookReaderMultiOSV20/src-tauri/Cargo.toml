[package]
name = "myebookreader"
version = "1.0.2"
description = "Cross-platform e-book reader: PDF, EPUB, MOBI, AZW / AZW3, DjVu, FB2, CBZ and more, with page-turn effects and highlights"
authors = ["SHKWON <knix008@naver.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "myebookreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Clipboard text and pictures (the webview's async Clipboard API needs a fresh
# user gesture, which a context-menu click has already used up).
arboard = { version = "3.7", features = ["image-data"] }
fontdb = "0.23"
# ZIP archives opened as books (src/unzip.rs): deflate and the entry checksums.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# "Open URL": a plain blocking GET with progress, run off the main thread.
ureq = "2.12"

# Printing straight to the printer chosen in the app (GDI), without a second
# system print window.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
