<?xml version="1.0" encoding="UTF-8"?>
<!-- MyEBookReader application icon (2026).
     A thick, glossy tile in the current soft-3D style: its face is an indigo →
     violet gradient lit by an aurora of cyan (top left) and coral (bottom
     right), with a specular sheen across the top, a light rim along the upper
     edge and an inner shade along the lower one. Under the face the tile's
     side shows as a darker band, and a soft shadow falls beneath it, so the
     whole tile stands off the desktop.

     On it lies an e-book page whose bottom-right corner is curling over — the
     page turn the reader is built around — with a second page behind it for
     depth, a few lines of text, an accent title bar and a coral bookmark
     ribbon. Shapes are large and simple so the icon still reads at 16 px.
     The canvas outside the tile and its shadow stays transparent. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tile face -->
    <linearGradient id="face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#5b6cff"/>
      <stop offset="0.45" stop-color="#6a3df0"/>
      <stop offset="1"    stop-color="#3a1596"/>
    </linearGradient>
    <radialGradient id="auroraCyan" cx="0.16" cy="0.12" r="0.62">
      <stop offset="0"    stop-color="#52e3ff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#52e3ff" stop-opacity="0.28"/>
      <stop offset="1"    stop-color="#52e3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraCoral" cx="0.9" cy="0.92" r="0.66">
      <stop offset="0"    stop-color="#ff7a6b" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#ff5fa2" stop-opacity="0.42"/>
      <stop offset="1"    stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.7"  stop-color="#1a0650" stop-opacity="0"/>
      <stop offset="1"    stop-color="#1a0650" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3b178f"/>
      <stop offset="1"    stop-color="#1c0a4d"/>
    </linearGradient>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="pageShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="96" y="80" width="832" height="832" rx="210"/>
    </clipPath>

    <!-- The page -->
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.7"  stop-color="#f6f4ff"/>
      <stop offset="1"    stop-color="#e3ddff"/>
    </linearGradient>
    <linearGradient id="backPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#d9d3ff"/>
      <stop offset="1"    stop-color="#a99cf5"/>
    </linearGradient>
    <!-- The underside of the curled corner: lit at the fold, shaded at the tip -->
    <linearGradient id="curl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.5"  stop-color="#e6e1ff"/>
      <stop offset="1"    stop-color="#b8adf3"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#6a3df0"/>
      <stop offset="1"    stop-color="#2fb8ff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ff8a5c"/>
      <stop offset="1"    stop-color="#ff3d7f"/>
    </linearGradient>
  </defs>

  <!-- Shadow on the desktop, then the tile's side, then its face -->
  <rect x="128" y="150" width="768" height="790" rx="200" fill="#12052f" opacity="0.55" filter="url(#dropShadow)"/>
  <rect x="96" y="108" width="832" height="832" rx="210" fill="url(#side)"/>
  <rect x="96" y="80" width="832" height="832" rx="210" fill="url(#face)"/>
  <g clip-path="url(#tileClip)">
    <rect x="96" y="80" width="832" height="832" fill="url(#auroraCyan)"/>
    <rect x="96" y="80" width="832" height="832" fill="url(#auroraCoral)"/>
    <!-- Glossy sheen across the upper half -->
    <path d="M96 80 H928 V420 C760 360 300 470 96 380 Z" fill="url(#sheen)"/>
  </g>
  <rect x="100" y="84" width="824" height="824" rx="206" fill="none" stroke="url(#rim)" stroke-width="8"/>

  <!-- The page behind, turned a little -->
  <g transform="rotate(-8 512 520)">
    <rect x="300" y="250" width="400" height="500" rx="34" fill="#1d0a5a" opacity="0.35" filter="url(#pageShadow)" transform="translate(10 22)"/>
    <rect x="300" y="250" width="400" height="500" rx="34" fill="url(#backPaper)"/>
  </g>

  <!-- The front page, its bottom-right corner curling over -->
  <path d="M352 232 H664 a34 34 0 0 1 34 34 V572 L536 770 H352 a34 34 0 0 1 -34 -34 V266 a34 34 0 0 1 34 -34 Z"
        fill="#1d0a5a" opacity="0.4" filter="url(#pageShadow)" transform="translate(8 24)"/>
  <path d="M352 232 H664 a34 34 0 0 1 34 34 V572 L536 770 H352 a34 34 0 0 1 -34 -34 V266 a34 34 0 0 1 34 -34 Z"
        fill="url(#paper)"/>

  <!-- Bookmark ribbon hanging from the top edge -->
  <path d="M582 232 h62 v136 l-31 -26 l-31 26 Z" fill="url(#ribbon)"/>

  <!-- Title bar and lines of text -->
  <rect x="366" y="292" width="184" height="34" rx="17" fill="url(#title)"/>
  <g fill="#8f86c9" opacity="0.75">
    <rect x="366" y="372" width="282" height="20" rx="10"/>
    <rect x="366" y="420" width="282" height="20" rx="10"/>
    <rect x="366" y="468" width="246" height="20" rx="10"/>
    <rect x="366" y="516" width="282" height="20" rx="10"/>
    <rect x="366" y="564" width="196" height="20" rx="10"/>
    <rect x="366" y="612" width="130" height="20" rx="10"/>
  </g>

  <!-- The curl: shadow it casts, then the turned-over corner -->
  <path d="M698 572 L536 770 C520 700 540 650 560 628 C600 610 650 596 698 572 Z" fill="#2a1270" opacity="0.3" filter="url(#pageShadow)"/>
  <path d="M698 572 C640 600 590 612 548 622 C562 668 552 720 536 770 Z" fill="url(#curl)"/>
  <path d="M698 572 L536 770" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <path d="M548 622 C562 668 552 720 536 770" fill="none" stroke="#8a7fe0" stroke-width="3" opacity="0.5"/>
</svg>
