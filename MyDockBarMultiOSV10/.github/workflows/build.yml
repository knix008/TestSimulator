name: Build installers

# macOS and Linux artifacts cannot be produced from a Windows host
# (dmg needs macOS tooling, AppImage needs symlinks), so each platform
# is built on its own runner.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: windows
          - os: macos-latest
            script: build:mac
            artifact: macos
          - os: ubuntu-22.04
            script: build:linux
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK for the webview, AppIndicator for the tray icon, and the
      # tools the AppImage bundler shells out to.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install dependencies
        run: npm ci

      # `pretest` generates the artwork, which is not in version control.
      # `npm test` runs both the Node and the Rust suites.
      - name: Run tests
        run: npm test

      # Each script ends with scripts/copy-installer.js, which copies the
      # installers out of src-tauri/target/release/bundle into the root.
      - name: Build installers
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: MyDockBar-${{ matrix.artifact }}
          path: |
            MyDockBar-*.exe
            MyDockBar-*.dmg
            MyDockBar-*.AppImage
            MyDockBar-*.deb
          if-no-files-found: error
