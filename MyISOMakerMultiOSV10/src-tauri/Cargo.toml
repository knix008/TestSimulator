[package]
name = "myisomaker"
version = "1.0.2"
description = "MyISOMaker — Tauri shell around the Node ISO host"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "myisomaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Open / save / folder dialogs, the unsaved-changes fallback message
tauri-plugin-dialog = "2"
# "Open folder" (Electron's shell.openPath)
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
# Tree rows dragged out of the window become an OS file drag (Electron's startDrag)
drag = "2"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
