[package]
name = "isomaker-host"
version = "1.0.2"
description = "MyISOMaker's image engine: ISO 9660 / Joliet, SquashFS, AppImage, Docker tar, xorriso, mounting, packages"
authors = ["SHKWON <knix008@naver.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "isomaker_host"
path = "src/lib.rs"

# The same engine over stdin/stdout (one JSON object per line): the tests drive it like the app.
[[bin]]
name = "isomaker-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# gzip / zlib: SquashFS blocks, .tar.gz, MSYS2 packages
flate2 = "1"
# zstd (pure Rust): MSYS2 packages and databases, zstd SquashFS
ruzstd = "0.9"
# Docker save / tar archives
tar = "0.4"
sha2 = "0.10"
# Downloads: MSYS2 packages, the AppImage runtime
ureq = { version = "2", default-features = false, features = ["tls"] }
