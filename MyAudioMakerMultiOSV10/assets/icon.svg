<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MyAudioMaker app icon: a raised violet-to-coral tile with a pair of beamed notes over a glowing
       waveform, and an AI sparkle, with a soft ground shadow under it. The tile sits in the exact centre (112…912 both ways); the border is transparent. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#c04bd8"/>
      <stop offset="1" stop-color="#ff6a7f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3fd6"/>
      <stop offset="1" stop-color="#b9375a"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe7f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2a0f4a" flood-opacity="0.35"/>
    </filter>
    <filter id="ground" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <ellipse cx="512" cy="944" rx="360" ry="30" fill="#2a0f4a" opacity="0.45" filter="url(#ground)"/>
  <rect x="112" y="132" width="800" height="780" rx="180" fill="url(#edge)"/>
  <rect x="112" y="112" width="800" height="772" rx="180" fill="url(#face)"/>
  <ellipse cx="420" cy="300" rx="300" ry="160" fill="url(#glow)"/>
  <!-- waveform -->
  <g stroke="#ffffff" stroke-opacity="0.38" stroke-width="22" stroke-linecap="round">
    <path d="M210 610v40M270 570v120M330 600v60M390 520v220M450 590v80M510 560v140M570 610v40M630 540v180M690 590v80M750 620v20M810 600v60"/>
  </g>
  <!-- beamed notes -->
  <g filter="url(#shadow)" fill="url(#note)">
    <ellipse cx="370" cy="690" rx="92" ry="70" transform="rotate(-20 370 690)"/>
    <ellipse cx="660" cy="640" rx="92" ry="70" transform="rotate(-20 660 640)"/>
    <rect x="432" y="290" width="40" height="400" rx="16"/>
    <rect x="722" y="240" width="40" height="400" rx="16"/>
    <path d="M432 290l330-50v110l-330 50z"/>
  </g>
  <!-- AI sparkle -->
  <g fill="#fff6b8" filter="url(#shadow)">
    <path d="M280 220l26 64 64 26-64 26-26 64-26-64-64-26 64-26z"/>
    <path d="M820 420l14 34 34 14-34 14-14 34-14-34-34-14 34-14z"/>
  </g>
</svg>
