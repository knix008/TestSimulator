    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff6a7f"/>
    </linearGradient>
    <filter id="ground" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <ellipse cx="512" cy="958" rx="320" ry="30" fill="#2a0f4a" opacity="0.45" filter="url(#ground)"/>
