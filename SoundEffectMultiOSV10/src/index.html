<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; script-src 'self'" />
  <title>사운드 이펙트 스튜디오</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/app-icon.svg" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <!-- Shared icon sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v10m0 0l-3.5-3.5M12 13l3.5-3.5M5 17.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tone" viewBox="0 0 24 24"><path d="M4 14c1.5-4 3-6 4.5-6S11 12 12 14s2.5 6 4 6 3-2 4.5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5V3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 3v6h8V3M8 21v-7h8v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 5v5h5M10 9l3 3-5 2 2-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z" fill="currentColor"/></symbol>
    <symbol id="i-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M7 7h9v3l4-4-4-4v3H5v6h2V7zm10 10H8v-3l-4 4 4 4v-3h11v-6h-2v4z" fill="currentColor"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 7.5v6M7.5 10.5h6M15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 10.5h6M15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 5v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cancel" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-create" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2m-7 0l1 12h6l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-track" viewBox="0 0 24 24"><path d="M4 8h16M4 12h10M4 16h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-fx" viewBox="0 0 24 24"><path d="M4 14V10h3l2-5 3 14 2-9 2 5h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 5h4v14H4zm6 0h4v14h-4zm6 0h4v14h-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="toolbar">
      <div class="brand">
        <div class="brand-mark">
          <img src="./assets/icons/app-icon.svg" alt="Sound Effect Studio" />
        </div>
        <div class="brand-text">
          <h1 data-i18n="appName">사운드 이펙트 스튜디오</h1>
          <p data-i18n="appTagline">크로스플랫폼 사운드 편집기</p>
        </div>
      </div>

      <div class="toolbar-actions">
        <div class="btn-cluster">
          <button id="btnImport" class="btn primary" type="button">
            <svg class="btn-icon" aria-hidden="true"><use href="#i-import"/></svg>
            <span data-i18n="importAudio">음원 등록</span>
          </button>
          <button id="btnTone" class="btn" type="button">
            <svg class="btn-icon" aria-hidden="true"><use href="#i-tone"/></svg>
            <span data-i18n="generateTone">톤 생성</span>
          </button>
          <button id="btnSave" class="btn" type="button">
            <svg class="btn-icon" aria-hidden="true"><use href="#i-save"/></svg>
            <span data-i18n="save">저장</span>
          </button>
          <button id="btnReview" class="btn" type="button" data-i18n-title="reviewHint">
            <svg class="btn-icon" aria-hidden="true"><use href="#i-review"/></svg>
            <span data-i18n="review">검핵</span>
          </button>
        </div>

        <div class="toolbar-group">
          <label for="themeSelect" data-i18n="theme">테마</label>
          <select id="themeSelect" class="select" aria-label="Theme">
            <option value="dark" data-i18n="themeDark">다크</option>
            <option value="light" data-i18n="themeLight">라이트</option>
          </select>
        </div>

        <div class="toolbar-group">
          <label for="langSelect" data-i18n="language">언어</label>
          <select id="langSelect" class="select" aria-label="Language">
            <option value="ko" data-i18n="korean">한국어</option>
            <option value="en" data-i18n="english">English</option>
          </select>
        </div>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel library-panel">
        <div class="panel-header">
          <span class="panel-title">
            <svg class="panel-icon" aria-hidden="true"><use href="#i-library"/></svg>
            <span data-i18n="library">라이브러리</span>
          </span>
          <span class="panel-badge" id="clipCount">0</span>
        </div>
        <div class="panel-body">
          <div class="library-actions">
            <button id="btnImportSide" class="btn primary btn-block" type="button">
              <svg class="btn-icon" aria-hidden="true"><use href="#i-import"/></svg>
              <span data-i18n="importAudio">음원 등록</span>
            </button>
            <button id="btnToneSide" class="btn btn-block" type="button">
              <svg class="btn-icon" aria-hidden="true"><use href="#i-tone"/></svg>
              <span data-i18n="generateTone">톤 생성</span>
            </button>
          </div>
          <div id="libraryEmpty" class="library-empty" data-i18n="emptyLibrary">
            등록된 음원이 없습니다.
          </div>
          <div id="libraryList" class="library-list" hidden></div>
        </div>
      </aside>

      <section class="editor">
        <div class="track-header">
          <div class="track-identity">
            <span class="track-chip">1</span>
            <div class="track-meta">
              <strong id="trackName" data-i18n="noTrack">트랙 없음</strong>
              <span id="trackMeta" class="track-sub">—</span>
            </div>
          </div>
          <div class="editor-tools">
            <button id="btnZoomOut" class="btn btn-sm" type="button">
              <svg class="btn-icon" aria-hidden="true"><use href="#i-zoom-out"/></svg>
              <span data-i18n="zoomOut">축소</span>
            </button>
            <button id="btnZoomIn" class="btn btn-sm" type="button">
              <svg class="btn-icon" aria-hidden="true"><use href="#i-zoom-in"/></svg>
              <span data-i18n="zoomIn">확대</span>
            </button>
            <button id="btnClearSel" class="btn btn-sm" type="button">
              <svg class="btn-icon" aria-hidden="true"><use href="#i-clear"/></svg>
              <span data-i18n="clearSelection">선택 해제</span>
            </button>
          </div>
        </div>

        <div class="waveform-wrap">
          <div class="lane-label" data-i18n="waveform">파형</div>
          <canvas id="waveform"></canvas>
        </div>

        <div class="analyzer-deck">
          <div class="analyzer-main">
            <div class="spectrum-meta">
              <div class="spectrum-title-row">
                <span data-i18n="spectrumEq">스펙트럼 EQ</span>
                <span class="spectrum-hint" data-i18n="spectrumEqHint">핸들을 위·아래로 드래그</span>
              </div>
              <div class="spectrum-actions">
                <span id="peakLabel">Peak 0%</span>
                <button id="btnResetEq" class="btn btn-sm" type="button">
                  <svg class="btn-icon" aria-hidden="true"><use href="#i-reset"/></svg>
                  <span data-i18n="resetEq">EQ 초기화</span>
                </button>
              </div>
            </div>
            <div class="spectrum-eq-wrap">
              <canvas id="spectrum"></canvas>
            </div>
            <div id="eqFaders" class="eq-faders" aria-label="EQ bands"></div>
          </div>
          <div class="meter-bank" title="Level">
            <div class="meter-col">
              <div class="meter">
                <div id="meterFillL" class="meter-fill"></div>
              </div>
              <span>L</span>
            </div>
            <div class="meter-col">
              <div class="meter">
                <div id="meterFillR" class="meter-fill"></div>
              </div>
              <span>R</span>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel effects-panel">
        <div class="panel-header">
          <span class="panel-title">
            <svg class="panel-icon" aria-hidden="true"><use href="#i-fx"/></svg>
            <span data-i18n="effects">이펙트</span>
          </span>
        </div>
        <div class="panel-body effects-body">
          <section class="fx-module">
            <header class="fx-module-head" data-i18n="moduleLevel">레벨 / 속도</header>
            <div class="effect-row">
              <label><span data-i18n="gain">게인</span><span class="value" id="valGain">0 dB</span></label>
              <input type="range" id="fxGain" min="-24" max="12" step="0.1" value="0" />
            </div>
            <div class="effect-row">
              <label><span data-i18n="playbackRate">재생 속도</span><span class="value" id="valRate">1.00×</span></label>
              <input type="range" id="fxRate" min="0.25" max="2" step="0.01" value="1" />
            </div>
          </section>

          <section class="fx-module">
            <header class="fx-module-head" data-i18n="moduleFilter">필터</header>
            <div class="effect-row">
              <label><span data-i18n="filterType">필터 유형</span></label>
              <select id="fxFilterType" class="select">
                <option value="lowpass" data-i18n="lowpass">로우패스</option>
                <option value="highpass" data-i18n="highpass">하이패스</option>
                <option value="bandpass" data-i18n="bandpass">밴드패스</option>
                <option value="notch" data-i18n="notch">노치</option>
              </select>
            </div>
            <div class="effect-row">
              <label><span data-i18n="filterFreq">필터 주파수</span><span class="value" id="valFilterFreq">18000 Hz</span></label>
              <input type="range" id="fxFilterFreq" min="40" max="18000" step="1" value="18000" />
            </div>
            <div class="effect-row">
              <label><span data-i18n="filterQ">필터 Q</span><span class="value" id="valFilterQ">0.70</span></label>
              <input type="range" id="fxFilterQ" min="0.1" max="12" step="0.1" value="0.7" />
            </div>
          </section>

          <section class="fx-module">
            <header class="fx-module-head" data-i18n="moduleTime">타임 / 공간</header>
            <div class="effect-row">
              <label><span data-i18n="delayTime">딜레이 시간</span><span class="value" id="valDelayTime">0.18 s</span></label>
              <input type="range" id="fxDelayTime" min="0" max="1.5" step="0.01" value="0.18" />
            </div>
            <div class="effect-row">
              <label><span data-i18n="delayFeedback">딜레이 피드백</span><span class="value" id="valDelayFeedback">0.25</span></label>
              <input type="range" id="fxDelayFeedback" min="0" max="0.9" step="0.01" value="0.25" />
            </div>
            <div class="effect-row">
              <label><span data-i18n="delayMix">딜레이 믹스</span><span class="value" id="valDelayMix">0%</span></label>
              <input type="range" id="fxDelayMix" min="0" max="1" step="0.01" value="0" />
            </div>
            <div class="effect-row">
              <label><span data-i18n="reverbMix">리버브 믹스</span><span class="value" id="valReverbMix">0%</span></label>
              <input type="range" id="fxReverbMix" min="0" max="1" step="0.01" value="0" />
            </div>
            <div class="effect-row">
              <label><span data-i18n="reverbDecay">리버브 감쇠</span><span class="value" id="valReverbDecay">1.80 s</span></label>
              <input type="range" id="fxReverbDecay" min="0.2" max="4" step="0.05" value="1.8" />
            </div>
          </section>

          <section class="fx-module">
            <header class="fx-module-head" data-i18n="moduleDrive">드라이브</header>
            <div class="effect-row">
              <label><span data-i18n="distortion">디스토션</span><span class="value" id="valDistortion">0%</span></label>
              <input type="range" id="fxDistortion" min="0" max="1" step="0.01" value="0" />
            </div>
          </section>

          <div class="effect-actions">
            <button id="btnResetFx" class="btn btn-block" type="button">
              <svg class="btn-icon" aria-hidden="true"><use href="#i-reset"/></svg>
              <span data-i18n="resetEffects">이펙트 초기화</span>
            </button>
          </div>
        </div>
      </aside>
    </main>

    <footer class="transport">
      <div class="transport-left">
        <div class="timecode-block">
          <span class="timecode-label" data-i18n="position">위치</span>
          <div class="timecode">
            <span id="timeCurrent">0:00.000</span>
            <span class="sep">/</span>
            <span id="timeTotal">0:00.000</span>
          </div>
        </div>
        <div class="selection-info" id="selectionInfo"></div>
      </div>

      <div class="transport-center">
        <button id="btnStop" class="btn transport-btn" type="button">
          <svg class="btn-icon" aria-hidden="true"><use href="#i-stop"/></svg>
          <span data-i18n="stop">정지</span>
        </button>
        <button id="btnPlay" class="btn transport-btn primary play-btn" type="button">
          <svg id="iconPlay" class="btn-icon" aria-hidden="true"><use href="#i-play"/></svg>
          <svg id="iconPause" class="btn-icon" aria-hidden="true" hidden><use href="#i-pause"/></svg>
          <span id="playLabel" data-i18n="play">재생</span>
        </button>
        <button id="btnRecord" class="btn transport-btn record" type="button">
          <svg class="btn-icon" aria-hidden="true"><use href="#i-record"/></svg>
          <span data-i18n="record">녹음</span>
        </button>
        <button id="btnLoop" class="btn transport-btn" type="button">
          <svg class="btn-icon" aria-hidden="true"><use href="#i-loop"/></svg>
          <span data-i18n="loop">루프</span>
        </button>
      </div>

      <div class="transport-right">
        <button id="btnReviewTransport" class="btn" type="button">
          <svg class="btn-icon" aria-hidden="true"><use href="#i-review"/></svg>
          <span data-i18n="review">검핵</span>
        </button>
        <button id="btnSaveTransport" class="btn primary" type="button">
          <svg class="btn-icon" aria-hidden="true"><use href="#i-save"/></svg>
          <span data-i18n="save">저장</span>
        </button>
      </div>
    </footer>

    <div class="status-bar">
      <span id="statusText" data-i18n="statusReady">준비됨</span>
      <span class="hint" data-i18n="reviewHint">생성·편집한 음을 재생하여 검핵합니다 · Shift+드래그로 구간 선택</span>
    </div>
  </div>

  <div id="dropOverlay" class="drop-overlay">
    <div class="drop-card">
      <svg class="drop-icon" aria-hidden="true"><use href="#i-import"/></svg>
      <span data-i18n="dropHint">오디오 파일을 여기에 놓으세요</span>
    </div>
  </div>

  <div id="toneModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h2>
        <svg class="btn-icon" aria-hidden="true"><use href="#i-tone"/></svg>
        <span data-i18n="toneDialogTitle">톤 생성</span>
      </h2>
      <div class="field">
        <label for="toneType" data-i18n="toneType">파형</label>
        <select id="toneType" class="select">
          <option value="sine" data-i18n="sine">사인</option>
          <option value="square" data-i18n="square">사각</option>
          <option value="sawtooth" data-i18n="sawtooth">톱니</option>
          <option value="triangle" data-i18n="triangle">삼각</option>
          <option value="noise" data-i18n="noise">노이즈</option>
        </select>
      </div>
      <div class="field">
        <label for="toneFreq" data-i18n="toneFreq">주파수 (Hz)</label>
        <input type="number" id="toneFreq" min="20" max="8000" value="440" />
      </div>
      <div class="field">
        <label for="toneDuration" data-i18n="toneDuration">길이 (초)</label>
        <input type="number" id="toneDuration" min="0.1" max="30" step="0.1" value="2" />
      </div>
      <div class="modal-actions">
        <button id="toneCancel" class="btn" type="button">
          <svg class="btn-icon" aria-hidden="true"><use href="#i-cancel"/></svg>
          <span data-i18n="cancel">취소</span>
        </button>
        <button id="toneCreate" class="btn primary" type="button">
          <svg class="btn-icon" aria-hidden="true"><use href="#i-create"/></svg>
          <span data-i18n="create">생성</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
