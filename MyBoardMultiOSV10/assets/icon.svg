<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MyBoard app icon: a kanban board of three columns with cards (to do, doing, done) on a raised
       blue tile — bevel, light from the top left, gloss and a soft shadow, like MySketchBook's tile.
       The tile sits in the exact centre (112…912 both ways); the border is transparent. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0ff"/>
      <stop offset="0.5" stop-color="#3d86f0"/>
      <stop offset="1" stop-color="#2142b8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2f86"/>
      <stop offset="1" stop-color="#101a55"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0b1440" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#eaf4ff" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boardFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ebf7"/>
    </linearGradient>
    <linearGradient id="boardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6c4dc"/>
      <stop offset="1" stop-color="#8a9bba"/>
    </linearGradient>
    <linearGradient id="column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf2fa"/>
      <stop offset="1" stop-color="#dde5f2"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fd"/></linearGradient>
    <linearGradient id="cardAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a3"/><stop offset="1" stop-color="#ffcf5a"/></linearGradient>
    <linearGradient id="cardGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9efc7"/><stop offset="1" stop-color="#7fd99a"/></linearGradient>
    <filter id="shadow" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b1440" flood-opacity="0.5"/></filter>
    <filter id="card" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1c2f86" flood-opacity="0.35"/></filter>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faceClip"><rect x="112" y="112" width="800" height="760" rx="170"/></clipPath>
  </defs>

  <!-- the tile: shadow, side (thickness), face -->
  <ellipse cx="512" cy="948" rx="370" ry="32" fill="#0b1440" opacity="0.45" filter="url(#shadow)"/>
  <rect x="112" y="152" width="800" height="760" rx="170" fill="url(#side)"/>
  <rect x="112" y="112" width="800" height="760" rx="170" fill="url(#face)"/>

  <g clip-path="url(#faceClip)">
    <!-- the board: a white panel with a thickness, standing on the tile -->
    <g filter="url(#drop)">
      <rect x="214" y="250" width="596" height="512" rx="54" fill="url(#boardEdge)"/>
      <rect x="214" y="234" width="596" height="508" rx="54" fill="url(#boardFace)"/>
    </g>
    <!-- header bar with three dots -->
    <rect x="252" y="264" width="520" height="54" rx="22" fill="#2f63d8"/>
    <circle cx="286" cy="291" r="10" fill="#ff7a6b"/><circle cx="318" cy="291" r="10" fill="#ffd166"/><circle cx="350" cy="291" r="10" fill="#6ee7a0"/>
    <rect x="392" y="282" width="150" height="18" rx="9" fill="#ffffff" opacity="0.75"/>
    <!-- three columns -->
    <rect x="252" y="338" width="160" height="372" rx="24" fill="url(#column)"/>
    <rect x="432" y="338" width="160" height="372" rx="24" fill="url(#column)"/>
    <rect x="612" y="338" width="160" height="372" rx="24" fill="url(#column)"/>
    <!-- column heads -->
    <rect x="272" y="356" width="80" height="14" rx="7" fill="#8fa3c4"/>
    <rect x="452" y="356" width="94" height="14" rx="7" fill="#e0a92e"/>
    <rect x="632" y="356" width="70" height="14" rx="7" fill="#3fb36a"/>
    <!-- cards: three to do, two doing, one done (with a check) -->
    <g filter="url(#card)">
      <rect x="268" y="388" width="128" height="84" rx="14" fill="url(#cardBlue)"/>
      <rect x="268" y="486" width="128" height="84" rx="14" fill="url(#cardBlue)"/>
      <rect x="268" y="584" width="128" height="84" rx="14" fill="url(#cardBlue)"/>
      <rect x="448" y="388" width="128" height="104" rx="14" fill="url(#cardAmber)"/>
      <rect x="448" y="506" width="128" height="84" rx="14" fill="url(#cardAmber)"/>
      <rect x="628" y="388" width="128" height="104" rx="14" fill="url(#cardGreen)"/>
    </g>
    <!-- card text lines and tags -->
    <g fill="#9cadc8">
      <rect x="284" y="406" width="84" height="12" rx="6"/><rect x="284" y="428" width="58" height="12" rx="6"/>
      <rect x="284" y="504" width="92" height="12" rx="6"/><rect x="284" y="526" width="48" height="12" rx="6"/>
      <rect x="284" y="602" width="70" height="12" rx="6"/><rect x="284" y="624" width="88" height="12" rx="6"/>
    </g>
    <rect x="284" y="448" width="34" height="12" rx="6" fill="#e5484d"/>
    <rect x="284" y="546" width="34" height="12" rx="6" fill="#7a5af8"/>
    <g fill="#a3741a" opacity="0.65">
      <rect x="464" y="406" width="88" height="12" rx="6"/><rect x="464" y="428" width="60" height="12" rx="6"/>
      <rect x="464" y="524" width="78" height="12" rx="6"/><rect x="464" y="546" width="50" height="12" rx="6"/>
    </g>
    <circle cx="546" cy="464" r="13" fill="#2f63d8"/><circle cx="546" cy="464" r="13" fill="none" stroke="#ffffff" stroke-width="3"/>
    <g fill="#2a8a4d" opacity="0.65"><rect x="644" y="406" width="66" height="12" rx="6"/><rect x="644" y="428" width="86" height="12" rx="6"/></g>
    <circle cx="726" cy="466" r="17" fill="#2a8a4d"/>
    <path d="M717 466l7 7 12-14" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- a card being moved: lifted, tilted, with a stronger shadow -->
    <g transform="rotate(-7 690 600)">
      <rect x="626" y="566" width="132" height="88" rx="14" fill="#0b1440" opacity="0.28" transform="translate(10 16)"/>
      <rect x="626" y="560" width="132" height="88" rx="14" fill="url(#cardAmber)"/>
      <rect x="642" y="578" width="90" height="12" rx="6" fill="#a3741a" opacity="0.65"/>
      <rect x="642" y="600" width="56" height="12" rx="6" fill="#a3741a" opacity="0.65"/>
      <rect x="642" y="622" width="34" height="12" rx="6" fill="#2f9e8f"/>
    </g>
  </g>

  <!-- light: glow, gloss, bevel ring -->
  <rect x="112" y="112" width="800" height="760" rx="170" fill="url(#glow)"/>
  <path d="M282 112h460a170 170 0 0 1 170 170v40c-160 70-660 70-800 0v-40a170 170 0 0 1 170-170z" fill="url(#gloss)"/>
  <rect x="116" y="116" width="792" height="752" rx="166" fill="none" stroke="url(#bevel)" stroke-width="8"/>
  <!-- a sparkle on the top left corner -->
  <circle cx="232" cy="210" r="54" fill="url(#spark)" opacity="0.9"/>
  <path d="M232 160l8 42 42 8-42 8-8 42-8-42-42-8 42-8z" fill="#ffffff" opacity="0.95"/>
</svg>
