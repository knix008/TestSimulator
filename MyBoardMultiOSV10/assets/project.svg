<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The .myboard document icon: a page with a folded corner showing a small three-column board,
       with the app's blue tile badge at the bottom right. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6edf8"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7e1f2"/><stop offset="1" stop-color="#a9b9d6"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd0ff"/><stop offset="0.5" stop-color="#3d86f0"/><stop offset="1" stop-color="#2142b8"/></linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf2fa"/><stop offset="1" stop-color="#dbe4f2"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b1440" flood-opacity="0.35"/></filter>
    <filter id="card" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1c2f86" flood-opacity="0.3"/></filter>
  </defs>
  <g filter="url(#drop)">
    <path d="M232 96h420l200 200v596a40 40 0 0 1-40 40H232a40 40 0 0 1-40-40V136a40 40 0 0 1 40-40z" fill="url(#page)"/>
    <path d="M652 96v160a40 40 0 0 0 40 40h160z" fill="url(#fold)"/>
  </g>
  <rect x="252" y="330" width="150" height="440" rx="22" fill="url(#col)"/>
  <rect x="422" y="330" width="150" height="440" rx="22" fill="url(#col)"/>
  <rect x="592" y="330" width="150" height="440" rx="22" fill="url(#col)"/>
  <g filter="url(#card)">
    <rect x="266" y="350" width="122" height="84" rx="12" fill="#ffffff"/><rect x="266" y="448" width="122" height="84" rx="12" fill="#ffffff"/><rect x="266" y="546" width="122" height="84" rx="12" fill="#ffffff"/>
    <rect x="436" y="350" width="122" height="104" rx="12" fill="#ffd166"/><rect x="436" y="468" width="122" height="84" rx="12" fill="#ffd166"/>
    <rect x="606" y="350" width="122" height="104" rx="12" fill="#86dfa2"/>
  </g>
  <g fill="#9cadc8"><rect x="282" y="370" width="80" height="12" rx="6"/><rect x="282" y="468" width="88" height="12" rx="6"/><rect x="282" y="566" width="64" height="12" rx="6"/></g>
  <g fill="#a3741a" opacity="0.6"><rect x="452" y="370" width="84" height="12" rx="6"/><rect x="452" y="488" width="70" height="12" rx="6"/></g>
  <path d="M640 404l14 14 26-30" fill="none" stroke="#2a8a4d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#drop)">
    <rect x="604" y="684" width="248" height="236" rx="60" fill="#101a55"/>
    <rect x="604" y="668" width="248" height="236" rx="60" fill="url(#badge)"/>
    <rect x="644" y="716" width="46" height="140" rx="12" fill="#ffffff" opacity="0.92"/>
    <rect x="705" y="716" width="46" height="100" rx="12" fill="#ffe08a"/>
    <rect x="766" y="716" width="46" height="60" rx="12" fill="#a7f0bd"/>
    <path d="M630 688h196a50 50 0 0 1 2 30c-80 22-150 22-224 0a40 40 0 0 1 26-30z" fill="#ffffff" opacity="0.3"/>
